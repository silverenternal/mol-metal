[project]
name = "mol-metal"
version = "0.1.0"
description = "Mol-Metal: precious-metal anticancer drug design framework (Pt/Ru/Ir/Au/Pd) on top of Flow Matching + Structure-Based Drug Design + Lambda Calculus MCTS proof-search"
requires-python = "==3.12.*"
# torch & triton: CUDA 13.0 wheels (per AGENTS.md §5.1 — this host is
# pure CUDA, no AMD GPU).  Both come from the official cu130 index.
# If you need to retrain on a different host, re-pin via `uv add torch==<ver>+cu130`.
dependencies = [
    "torch>=2.14,<2.15",
    "triton==3.8.0",
    "numpy>=1.26,<3",
    # data layer (MetalCytoToxDB loader, transforms)
    "pandas>=2.0",
    # flow-matching optimal-transport solver (scipy is a lazy import, only
    # needed when --ot-mode hungarian is selected)
    "scipy>=1.11",
    # YAML config loader (the mini YAML fallback in utils.config works
    # without it, but pyyaml is the preferred path)
    "pyyaml>=6.0",
    # molmetal/ deps: hex-arch framework for de novo + SBDD
    "biopython>=1.81",
    "rdkit>=2024.3",
    "openpyxl>=3.1",
    # classical ML baselines (Krasnov 2026 reproduction: Morgan FP + XGBoost / RF)
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "hypothesis>=6.168.0",
    "datamol>=0.13.0",
    "molfeat>=0.11.0",
    "openbabel-wheel>=3.1.1.23",
    "meeko>=0.8.0",
    "torchdiffeq>=0.2.5",
    "gemmi>=0.7.5",
    "openmm>=8.6.1",
    "posebusters>=0.6.5",
    "prody>=2.6.1",
    "mdanalysis>=2.10.0",
    "vina>=1.2.7",
    "admet-ai>=2.0.1",
    # admetica removed 2026-09-12: unsatisfiable on torch>=2.14 (pinned torch==2.4.0).
    # Fallback documented in molmetal/reports/round7_install_report.md.
    "pot>=0.9.7.post1",
]

# =============================================================================
# Optional dependency groups
# =============================================================================
# `pocketgen`: protein pocket encoder backbone (PocketGen + ESM-2).
# NOT a default dep — pulls in torch_scatter, torch_geometric, esm
# (~700 MB total install).  Wf-A32 wire-in target.  Install with:
#   uv pip install "mol-metal[pocketgen]"
#   # or, if editable:
#   uv sync --extra pocketgen
# PyTorch CUDA / scatter wheels are host-specific; on this host (CUDA 13.0,
# Blackwell SM_120) the `cu130` index serves torch_scatter and torch_geometric
# natively.  On ROCm hosts the user must re-pin to the `rocm` index per
# AGENTS.md §5.9 single-venv rule.
[project.optional-dependencies]
pocketgen = [
    "torch-scatter>=2.1.2",
    "torch-geometric>=2.6.1",
    # facebookresearch/esm  (ESM-2 protein language model)
    "fair-esm>=2.0.0",
    "omegaconf>=2.3.0",
]

# P2Rank: pocket detection (Java CLI).  Install only if doing PDB → pocket
# extraction (Wf-A33).  Not a Python dep; we wrap the CLI in
# molmetal/adapters/p2rank_wrapper.py.
p2rank = [
    # Java is a system dep; Python wrapper has no extra Python deps.
]

[tool.uv]
managed = true

# =============================================================================
# ruff — the repo had NO config until 2026-10-03, so `--isolated` equalled hook
# behaviour and every rule the default set enables was reported.  This block
# declares ONLY the classes that were individually verified to be deliberate
# patterns.  Everything else stays VISIBLE: an unexamined finding is debt, and
# silencing it would be the defect this block is trying to avoid.
#
# Pinned version for all of the below: v0.6.9 (the .pre-commit-config.yaml pin,
# supplied by pre-commit's isolated hook env — /usr/bin/ruff is 0.16.8 and
# reports a different set).
# =============================================================================
[tool.ruff.lint]
# Rules deliberately NOT enabled here (each was checked; none is silenced):
#   F841 unused-variable   494 — ruff's fix DELETES the assignment, which
#                                changes behaviour whenever the RHS has a side
#                                effect.  Needs per-site judgement, not a sweep.
#   F401 unused-import     778 — a subset are `try/except ImportError`
#                                availability probes that ruff declines to
#                                touch by design; the rest need the same
#                                re-export/side-effect care the Wf-A16 lint
#                                pass applied to tests/**+scripts/**.
#   E741 ambiguous-name     97 — no autofix; each `l`/`I`/`O` needs renaming.
#   F811 redefinition       24 — each is a shadowed definition; may be real.
ignore = [
    # 1283 findings.  Imports follow an intentional setup step: 1036
    # `sys.path.insert`, 56 `sys.path.append`, 14 slice forms
    # (`sys.path[:0] = [...]`, `sys.path[:] = [...]`).  The import MUST come
    # after the path mutation, so E402 fires on correct code.  254 files carry
    # this shape.  The sites that were NOT deliberate — 22 findings across 9
    # files, in modules with no sys.path handling at all — were fixed
    # 2026-10-03 by moving the splitting statement below the import block.
    # Two files were attempted and REVERTED because the move broke a real
    # dependency: molmetal_lam/priors/__init__.py (a multi-line `__all__`
    # consumed by a later name) and scripts/diagnose_lambda_terminal_reactivity.py
    # (an import that depends on the preceding `sys.path[:0] = [...]`).
    "E402",
    # 151 findings, ALL inside annotations.  Verified with an AST pass plus a
    # check that nothing in this repo resolves annotations: zero
    # `get_type_hints` calls, zero pydantic/typer/fastapi/attrs/click imports,
    # and `dataclass` reads only annotation KEYS, never the types.  Under
    # `from __future__ import annotations` (present in 1912 files) these names
    # are never looked up.  The one non-annotation instance — a dead
    # `X if False else object` base — was fixed.
    "F821",
    # 27 findings, all under molmetal/reports/, which .pre-commit-config.yaml
    # already excludes from the hook.
    "F541",
]

[tool.setuptools]
packages = ["molmetal", "molmetal.molmetal_lam", "molmetal.data", "molmetal.baselines", "molmetal_lam"]

# Console-script entry point — mirrors OmegaFold's
# entry_points={"console_scripts": ["omegafold=omegafold.__main__:main"]} pattern
# in setup.py:32.  After `uv pip install -e .`, the `molmetal` command
# is on PATH and dispatches to `molmetal.__main__.cli_main`.
[project.scripts]
molmetal = "molmetal.__main__:cli_main"

# Keep pytest focused on this repository's maintained tests. Vendored research
# repositories under ``molmetal/references`` ship their own plugins, options,
# and optional dependencies; collecting them causes import-time failures.
#
# Per Wf-A2 code consolidation (~~AGENTS.md §5.8 omega-flow minimalism pattern~~
# → AGENTS.md §5.10 OmegaFold gap-fill — flat-package rule; full text in
# docs/STANDING_DIRECTIVES.md §G; corrected 2026-10-31):
#   - `tests/` is the CPU-only regression-guard surface (per-wave audits).
#   - `molmetal/tests/` is the canonical pytest root (558 script-aligned).
#   - See `tests/INDEX.md` for per-test-file scope + when-to-run map.
[tool.pytest.ini_options]
testpaths = ["tests", "molmetal"]
norecursedirs = ["references", ".venv", ".git", "__pycache__"]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests requiring optional external services or data",
    "gpu: marks tests requiring a GPU (QuickVina-GPU, CFM retrain, etc.)",
    "gpu_blocked: marks tests whose real path is BLOCKED on this CUDA host (placeholder for AMD-only tests; currently unused on pure-CUDA nodes per AGENTS.md §5.1)",
    # Wf-A16 (2026-10-03): this marker was USED (test_reproduce_R17.py) but never
    # DECLARED, and addopts carries --strict-markers — so the module errored at
    # COLLECTION with "Failed: 'reproduce_R17' not found" and contributed zero
    # coverage. Its own docstring documents the intent ("callers can opt-out via
    # -m 'not reproduce_R17' for fast inner-loop runs"), so declaring it is the
    # fix; deselecting it is now possible as designed.
    "reproduce_R17: slow single-command R17 reproducibility driver (deselect with '-m not reproduce_R17')",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest-xdist>=3.6",
]

# Download PyTorch's CUDA 13.0 build for cp312.  Default PyPI is still
# consulted for everything else (numpy, etc.).
[[tool.uv.index]]
name = "pytorch-cu130"
url  = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
