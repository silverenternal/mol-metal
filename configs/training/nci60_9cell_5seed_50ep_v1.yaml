# =============================================================================
# nci60_9cell_5seed_50ep_v1.yaml — Wf-A10 cell-line task axis on REAL labels
#
# Date: 2026-10-03 (Wf-A10)
# Owner: Hugo Lee + Wf-A10
# Status: SCAFFOLD-only until a USER_OK-gated GPU launch. No GPU launch was
#         performed by the wave that authored this file (AGENTS.md §5.1 +
#         kill_then_adapt §0).
#
# WHY THIS COHORT
# ---------------
# `platinai_4cell` (configs/training/platinai_pt_4cell_5seed_50ep_v1.yaml) is
# the wrong cohort to hang a result on: its labels are synthetic noise.
# MEASURED in molmetal/data/platinai_4cell.meta.json —
#   "framing": "synthetic IC50 labels for pipeline test; NOT directly
#               comparable to Rusanov 2025 Table S4-S5"
# so the per-cell AUC near 0.50 that cohort produces is a *null test* (it
# demonstrates no label leakage) and NOT a measurement of anything.
#
# This cohort carries REAL measured pIC50 from MetalCytoToxDB, and its nine
# cell lines include all four that Rusanov 2025 reports (MCF7 / A549 / A2780 /
# A2780cis). It is the cohort that can actually answer the multi-cell-line
# question.
#
# HONEST FRAMING (party-twenty-spirit §3.5)
# -----------------------------------------
# 1. SPLIT IS DELIBERATELY m21's, FOR COMPARABILITY. This config does NOT
#    invent a split. It reuses molmetal/scripts/train_nci60_10cell.py's
#    protocol — ScaffoldSplitter (Bemis-Murcko, largest_first, 70/10/20,
#    seed=0) run on the UNIQUE canonical SMILES. MEASURED: that reproduces
#    m21's split byte-for-byte (train/val/test = 3645/521/1041 unique
#    molecules; element-for-element identical, md5 4442bbfd7e44 /
#    19503c2260ba / f941b3bca78b). Changing the split would make any number
#    produced here incomparable to the shipped baseline, which defeats the
#    point.
# 2. THE HEADLINE BASELINE IS AN 8-CELL MEAN, NOT 9. metrics/by_metric/
#    nci60_precious_9cell_auc.json reports value_overall_mean_auc = 0.8007,
#    but DU145 is null across all three seeds — m21 could not measure it
#    (161 rows, smallest cell). 0.8007 is the mean over the 8 cells that
#    were measured. Any comparison must be made on the same 8.
# 3. TARGETS BELOW ARE MEASURED, NOT PROJECTED. They are m21's own per-cell
#    values, recorded so a re-run is compared against what actually shipped.
#    A number here that differs is a finding; a number that matches is a
#    reproduction.
# 4. Labels are the CSV's own `active` column (m21's 10 uM convention),
#    used verbatim rather than re-derived — re-deriving reproduces it only
#    to 99.32% and comparability is the whole point.
# =============================================================================

# ============================================================================
# DATA — REAL-labelled NCI-60 precious-metal 9-cell-line cohort
# Per AGENTS.md §5.4 + §10: Tier-2 computational-only, no wet-lab planning.
# ============================================================================
data:
  dataset: nci60_9cell  # --dataset {metalcytotox_5metal, platinai_4cell, nci60_9cell}
  # The task axis IS the cell line. With task_axis=metal the pool cannot even
  # be built (this cohort has no metal column) — the trainer raises a clear
  # ValueError rather than silently mis-training.
  task_axis: cell_line  # --task-axis {metal, cell_line}
  # two-component path -> argparse dest `metals`; "auto" resolves to the nine
  # cell lines by reading the CSV's cell_line column (Wf-A6 BLOCKER A).
  metals: [auto]
  cohort_filter:
    # Documentation of what `auto` resolves to; the functional setting is
    # `metals: [auto]` above. These are NCI-60 panel lines, all nine of which
    # appear in MetalCytoToxDB's precious-metal subset.
    cells: [MCF7, A549, A2780, A2780cis, HCT116, PC3, HL60, SKOV3, DU145]
  expected_columns_subset: [smiles, cell_line, pIC50, active]
  split:
    # m21 protocol — see honest-framing note 1. Do not change without also
    # re-deriving the 0.8007 baseline, or the two are not comparable.
    type: bemis_murcko_scaffold
    implementation: molmetal.data.splits.ScaffoldSplitter
    strategy: largest_first
    seed: 0
    train_frac: 0.7
    val_frac: 0.1
    test_frac: 0.2
    grouped_on: unique_canonical_smiles  # NOT rows: guarantees zero cross-cell leakage
  num_workers: 8
  pin_memory: true  # schema-only; D-MPNN trainer has no --pin-memory flag

# ============================================================================
# MODEL — D-MPNN multi-task: shared encoder + one head pair per cell line.
# This is the PECAN-style shared network the field uses for multi-cell-line
# cytotoxicity (PECAN predicts 59 NCI-60 lines from one shared network),
# rather than nine independent per-cell models.
# ============================================================================
model:
  backbone: chemprop_v2_v3
  ablation_config: mtl_baseline
  # Must be `hidden`, NOT `hidden_dim`. MEASURED: the argparse dest is
  # `hidden` (trainer line ~2514, `--hidden`, default DMPNN_HIDDEN=128).
  # A `model.hidden_dim` key has no matching dest, so the loader skips it
  # SILENTLY and the value never reaches the model — the sibling platinai
  # config carries `hidden_dim: 300` and has been running at 128 anyway.
  # 128 matches train_nci60_10cell.py's MT_HIDDEN (which is DMPNN_HIDDEN),
  # so the architecture is held fixed against the 0.8007 baseline.
  hidden: 128
  depth: 3  # == train_nci60_10cell.py MT_DEPTH
  task: multi_task
  wasserstein_weight: 0.05
  alpha: 0.5  # == train_nci60_10cell.py MT_ALPHA
  n_mc: 256
  w2_gradient_mode: sliced
  use_l2_guard: true

# ============================================================================
# TRAINING PROTOCOL — 9 × 5 × 50 (cell line × seed × epoch)
# 50-epoch / 5-seed is the Tier-2 §3–§4 standard, and matches m21's
# epochs=50 so a re-run is directly comparable.
# ============================================================================
protocol:
  n_seeds: 5
  seeds: [0, 1, 2, 3, 4]
  epochs: 50  # == train_nci60_10cell.py MT_EPOCHS
  # batch_size / lr are held at train_nci60_10cell.py's values (MT_BATCH_SIZE
  # = 32, MT_LR = 1e-3) rather than the Wf-A5-N4 resource-scaled 128 / 2e-3.
  # Reason: a comparison against the shipped 0.8007 must vary ONE thing — the
  # main trainer's loss machinery (Wasserstein pIC2O regularisation, L2 guard,
  # cosine schedule) — not also the batch size and learning rate. Changing
  # those too would confound any observed difference. The resource-scaled
  # variant belongs in a separate config, where it is the declared variable.
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-5
  max_norm: 5.0
  gradient_accumulation_steps: 1  # schema-only; D-MPNN has no such flag
  grad_clip_norm: 5.0  # schema-only; see max_norm
  bf16: false  # schema-only; D-MPNN trainer has no AMP path
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-6
  n_runs_total: 45  # 9 cell lines x 5 seeds

# ============================================================================
# EVALUATION — per-cell-line AUC, targets = m21's MEASURED shipped values.
# The aggregate to beat is 0.8007, which is a mean over the 8 cells below
# that were actually measurable (DU145 has no value to compare against).
# ============================================================================
eval:
  per_pair_metrics: [test_auc, val_auc, wasserstein_final, best_epoch]
  per_cell_line_metrics:
    - MCF7_test_auc
    - A549_test_auc
    - A2780_test_auc
    - A2780cis_test_auc
    - HCT116_test_auc
    - PC3_test_auc
    - HL60_test_auc
    - SKOV3_test_auc
    - DU145_test_auc
  # MEASURED — m21's shipped per-cell values, from
  # metrics/by_metric/nci60_precious_9cell_auc.json (seeds [0,1,2], 50 epochs).
  # Explicitly NOT projections: these are what actually shipped, recorded so
  # a re-run is compared against reality rather than against a wish.
  baseline_per_cell_line_MEASURED:
    MCF7: 0.7441
    A549: 0.7758
    A2780: 0.6931
    A2780cis: 0.7278
    HCT116: 0.7584
    PC3: 0.8700
    HL60: 0.9320
    SKOV3: 0.9046
    DU145: null  # HONEST-NEGATIVE: null across all 3 m21 seeds; not measurable there
  baseline_overall_MEASURED: 0.8007  # mean over the 8 non-null cells
  krasnov_2026_baseline_auc: 0.81  # cite-only reference, per the metric's honest_framing
  gate_target: 0.7

# ============================================================================
# OUTPUT
# ============================================================================
output:
  base_dir: results/nci60_9cell_5seed_50ep
  # `out_dir` too, not just `base_dir`. MEASURED: the argparse dest is
  # `out_dir`; `output.base_dir` only drives start.sh's `{out_dir}`
  # substitution, so a `--config`-only invocation (no start.sh) would
  # silently train into the trainer's default out_dir
  # (molmetal/reports/wf131_p1_ru_auc_multitask) and mix cohorts. The
  # sibling platinai config has exactly that gap. Setting both is safe:
  # when start.sh passes --out-dir explicitly the CLI value wins, and when
  # it does not, the YAML supplies it.
  out_dir: results/nci60_9cell_5seed_50ep
  per_metal_dir: results/nci60_9cell_5seed_50ep/{metal}/per_seed_metrics_seed{seed}.json
  training_summary: results/nci60_9cell_5seed_50ep/training_summary.json
  log_master: results/nci60_9cell_5seed_50ep/master.log
  # Checkpoint isolation (Wf-A10): ckpt_dir is pinned to THIS run's output
  # tree rather than the shared molmetal/checkpoints. MEASURED motivation:
  # with the shared path, a fresh run silently resumed stale checkpoints from
  # another cohort and reported train_seconds = 0.0035 (i.e. it trained
  # nothing). Isolated, that became 15.58 s. Do not repoint this at the
  # shared directory.
  ckpt_dir: results/nci60_9cell_5seed_50ep/checkpoints
  checkpoint_interval: 50
  resume_from: auto
  events_jsonl_path: results/nci60_9cell_5seed_50ep/events.jsonl
  events_jsonl: true

# ============================================================================
# COMPUTE
# Per AGENTS.md §5.9 single-venv rule: the launch wrapper MUST use the project
# venv /home/hugo/codes/mol-metal/.venv/bin/python.
# HONEST-NEGATIVE: the venv currently carries torch==2.14.0+rocm7.2, so
# cuda_available is False and a real launch falls back to CPU. Closure path =
# install the cu130 build (USER_OK-gated, 6-17 min wall). Until then this
# config can be smoke-tested on CPU but not launched for a real result.
# ============================================================================
compute:
  gpu: cuda:0  # GPU 0 only, per standing user directive "只用gpu0吧"
  cpu_workers: 8
  bf16: false  # schema-only; D-MPNN trainer has no AMP path
  torch_compile: false  # schema-only
  cudnn_benchmark: false  # schema-only
  channels_last: false  # schema-only; D-MPNN is not a ConvNet

# ============================================================================
# STANDING DIRECTIVES
# ============================================================================
directives:
  kill_then_adapt: true
  time_budget: 10h
  user_ok_required: true  # AGENTS.md §5.1 — the launch is the user's to make
  per_wave_user_ok_required: false
  pre_flight_gates_required:
    - p3_protocol_alignment_user_ok_gate
    - p3_protocol_alignment_baseline_paper_refs_bib
    - p3_wf385_scaffold_loss_wire_in_verified
    - p3_wf343c4_anchor_freshness_24h

# ============================================================================
# ENTRY POINT — start.sh parses entry.command
#   USER_OK=1 bash scripts/start.sh configs/training/nci60_9cell_5seed_50ep_v1.yaml
# ============================================================================
entry:
  # --dataset / --task-axis / --metals arrive from the data: section above via
  # the Wf-A2 config loader; only the run-scoped flags are spelled out here.
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_dmpnn_multitask_wasserstein.py --config {yaml_path} --out-dir {out_dir} --ckpt-dir {ckpt_dir} --device cuda:0
  warm_start_checkpoint: "n/a"  # cold start each seed; --resume-from auto per output.resume_from

# ============================================================================
# CROSS-REFERENCES
# ============================================================================
cross_references:
  # The script this config reproduces the split of, and compares against
  - molmetal/scripts/train_nci60_10cell.py
  # The shipped baseline this is compared to (0.8007 over 8 cells)
  - metrics/by_metric/nci60_precious_9cell_auc.json
  # The cohort
  - molmetal/data/nci60_precious_9cell.csv
  # The scaffold splitter that defines the protocol
  - molmetal/data/splits.py
  # Main trainer (cell-line task axis + nci60 loader added by Wf-A10)
  - molmetal/scripts/train_dmpnn_multitask_wasserstein.py
  # Wf-A2 unified YAML loader
  - molmetal/scripts/wfA2_config_loader.py
  # Single canonical launch script
  - scripts/start.sh
  # Why the platinai cohort is NOT used for a result (synthetic labels)
  - molmetal/data/platinai_4cell.meta.json
