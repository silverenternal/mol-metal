# ============================================================================
# DATA — REAL PlatinAI 4-cell cohort (Pt-coordination pIC50)
# Per TODO/decisions/0002-tier2-scope.md: Tier-2 paper target is in-silico +
# computational-only; no wet-lab planning per AGENTS.md §5.4 + §10.
# ============================================================================
data:
  dataset: platinai_4cell  # Wf-A8: --dataset {metalcytotox_5metal, platinai_4cell} default platinai_4cell for THIS config
  cohort_filter:
    metals: [Pt]  # Wf-A8 §5 MEASURED: 4078 SMILES × 4 cells = 16312 long-format rows
    cells: [A2780, MCF7, A549, A2780cis]  # Rusanov 2025 §3.2 per-cell-balanced
  expected_columns_subset: [SMILES_Ligands, pIC50_mcf7, pIC50_a549, pIC50_a2780, pIC50_a2780cis, metal]
  # 2026-10-07 (P-A m2 lock fix): the resolved cohort CSV is pinned as a LIVE
  # top-level `csv:` key (see the block below).  It is the SAME path
  # `_resolve_default_csv_path('platinai_4cell')` picks
  # (DEFAULT_PLATINAI_4CELL_CSV), now written down so
  # pre_flight_check.verify_protocol_lock has a concrete artifact to md5 — the
  # gate hashes what the config names, and `--dataset <name>` alone is not
  # hashable (this is what made the p3_wf35_protocol_lock_m2_r2_per_cell gate
  # FAIL with "trainer config names NO dataset artifact").
  # The resolved cohort CSV lives at the TOP-LEVEL `csv:` key further down this
  # file, NOT here — see that block for the MEASURED evidence and the
  # `data.csv` -> `--data-csv` mis-wire it avoids.
  # HONEST-NEGATIVE: .data/molmetal/platinai_4cell.csv has NO Year column
  # (Wf-A8 §6); split_strategy='70_10_10_hash' is the canonical option.
  # If future CSV has Year column, platinai_dataset.py must support split_strategy='year_2024'.
  #
  # 2026-10-07 (P-A m2 lock fix): `split:` -> `split_intent:`.  Every leaf
  # below was MEASURED dead in wfA2_config_loader (no argparse dest named
  # type / train_frac / val_frac / test_frac / temporal / temporal_substitute);
  # the block is documentation of intent, not run configuration.  The operative
  # split is hardcoded in `load_platinai_4cell_split_table(csv_path,
  # split_strategy="scaffold_70_10_10")` — deterministic canonical-SMILES hash,
  # 70/10/10 — NOT the 70/10/20 stated here, which Wf-A8 recorded from
  # PROTOCOL_ALIGNMENT_MATRIX prose.  Renaming keeps the gate from stringifying
  # this dict and reporting a fabricated diff against the lock's split field;
  # it does NOT make the split machine-checked (no trainer exposes a
  # split-protocol flag — see protocol_lock.yaml m2 `honest_negative`).
  split_intent:
    type: per_cell_line_balanced
    train_frac: 0.7
    val_frac: 0.1
    test_frac: 0.2
    temporal: pre_2024_train_and_2024_plus_test_HONEST_NEGATIVE_BLOCKED_no_Year_column_in_csv
    temporal_substitute: stable_hash_per_cell_balanced_70_10_10

  # 2026-10-04: renamed from `num_workers` to match the trainer flag.
  # --cpu-num-workers is the DataLoader num_workers knob (its own help reads
  # 'DataLoader num_workers (default 0 = main process)'); the old key name
  # resolved to no argparse dest and was silently dropped.
  cpu_num_workers: 8  # PyTorch DataLoader docs recommendation; Blackwell sm_120 + 6-batch featurisation handles 8 workers
  pin_memory: true  # wired -> --pin-memory / --no-pin-memory (2026-10-04)

# =============================================================================
# COHORT CSV — TOP-LEVEL `csv:` (added 2026-10-07, P-A m2 protocol-lock fix)
# =============================================================================
# Resolved cohort artifact, pinned so pre_flight_check.verify_protocol_lock has
# a concrete file to md5: the gate hashes what the config NAMES, and
# `--dataset platinai_4cell` alone is not hashable (that is what produced the
# p3_wf35_protocol_lock_m2_r2_per_cell FAIL "trainer config names NO dataset
# artifact").  This is the SAME path `--dataset platinai_4cell` already resolves
# to via _resolve_default_csv_path -> DEFAULT_PLATINAI_4CELL_CSV, so the key
# pins the existing behaviour rather than changing it.
#
# MEASURED 2026-10-07: md5 5a5d8da8d1b05a9647546a5c2101f6f2, 472144 bytes,
# 4078 data rows, columns SMILES_Ligands,pIC50_{mcf7,a549,a2780,a2780cis},metal.
# NOT molmetal/data/platinai_4cell.csv (md5 cbdb7c2d…, same 4078 complexes but
# columns complex_id,smiles,ic50_*_nm,source) — load_platinai_4cell_split_table
# raises ValueError on that one for a missing `SMILES_Ligands` column
# (train_dmpnn_multitask_wasserstein.py:469).
#
# NOTE ON SPELLING — top-level, not `data.csv`. That spelling is load-bearing
# (MEASURED 2026-10-07 through wfA2_config_loader):
#   `data.csv` -> _candidate_dests flat form `data_csv` -> matches --data-csv
#                 (the MetalCytoToxDB override) and wins on the flat-first
#                 rule, so it MIS-WIRES this PlatinAI path into the
#                 MetalCytoToxDB reader: ns.csv stayed None while ns.data_csv
#                 became the platinai path.
#   `csv:`     -> flat form `csv` -> matches --csv. Correct dest.
# §5.7 smoke evidence: ns.csv resolves to the path below and ns.data_csv stays None.
csv: /home/hugo/codes/mol-metal/.data/molmetal/platinai_4cell.csv

# ============================================================================
# MODEL — chemprop_v2_v3 D-MPNN multi-task Wasserstein pIC50
# Per TODO/decisions/0008-comparison-baselines.md: D-MPNN baseline on par
# with chemprop_v2_v3 + multi-task + Kendall + DANN ablations.
# Per TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md §2: chemprop_v2_v3
# multi-task baseline is the Tier-2 §3 main-result anchor.
# ============================================================================
model:
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'backbone' removed — the comment claimed a --backbone CLI flag; no such flag exists in either trainer.
  ablation_config: mtl_baseline  # --ablation-config {mtl_baseline, single_task_baseline, kendall_only, dann_only, ...}
  hidden_dim: 300  # per chemprop_v2_v3 5-seed × 50-epoch standard protocol
  depth: 3  # standard message-passing depth
  task: multi_task  # --single-task flag flips this off
  wasserstein_weight: 0.05  # --wasserstein-weight
  alpha: 0.5  # --alpha BCE weight
  n_mc: 256  # --n-mc W2 Monte Carlo samples
  w2_gradient_mode: sliced  # sliced W2 gradient (vs Sinkhorn OT, OT-CFM)
  use_l2_guard: true  # --use-l2-guard / --no-use-l2-guard default --use-l2-guard

# ============================================================================
# TRAINING PROTOCOL — 1 × 5 × 50 (Pt × 5-seed × 50-epoch)
# Per TODO/decisions/0002-tier2-scope.md: 50-epoch protocol is the
# Tier-2 §3 main-result standard.
# Per TODO/decisions/0008-comparison-baselines.md: 5-seed protocol is the
# Tier-2 §4 reproducibility standard.
# Per TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md §3: chemprop_v2_v3
# multi-task 5-seed × 50-epoch protocol cross-walks to Tier-2 §3.
# ============================================================================
protocol:
  n_seeds: 5
  seeds: [0, 1, 2, 3, 4]  # --seeds (default list of individual seed ints)
  epochs: 50  # --epochs
  batch_size: 128  # --batch-size (linear scaling rule; NVIDIA A100 paper)
  lr: 2.0e-3  # --lr (linear scaling: lr = base_lr × new_batch / old_batch)
  gradient_accumulation_steps: 1  # wired -> --gradient-accumulation-steps; 1 = no accumulation
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'grad_clip_norm: 5.0' removed (loader alias grad_clip_norm->--max-norm; operative key = protocol.max_norm below).
  weight_decay: 1.0e-5  # --weight-decay (Adam L2 regularisation)
  max_norm: 5.0  # --max-norm (Pascanu 2013 standard for transformer/GNN stability)
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'bf16: false' removed (no AMP path exists to disable).
  # Wf-A6 A2 BLOCKER C fix (2026-10-03) — LR scheduler (per user voice
  # "学习率的控制至少得用余弦退火或者更加高级的方案，做一下调研然后应用").
  # Loshchilov-Hutter 2017 SGDR + Smith-Topin 2018 super-convergence survey.
  # Linear warmup + CosineAnnealingLR as conservative primary path.
  scheduler:
    type: cosine  # --lr-scheduler {none, cosine, onecycle}; cosine = Linear warmup + CosineAnnealingLR via SequentialLR
    warmup_epochs: 5  # --lr-warmup-epochs (EDM 2022 recommendation)
    min_lr: 1.0e-6  # --lr-min-lr (CosineAnnealingLR floor; OneCycleLR final_div_factor)
  enumerated_runs:
    - {metal: Pt, seed: 0}
    - {metal: Pt, seed: 1}
    - {metal: Pt, seed: 2}
    - {metal: Pt, seed: 3}
    - {metal: Pt, seed: 4}
  n_runs_total: 5

# ============================================================================
# EVALUATION — Krasnov 2026 + Rusanov 2025 + Per-cell-line band targets
# Per TODO/decisions/0002-tier2-scope.md: Tier-2 §3 main result uses
# per-cell-line AUC bands (not a single aggregate target).
# Per TODO/decisions/0008-comparison-baselines.md: per-cell-line AUC is
# the Tier-2 §3 main result; aggregate is secondary.
# Per TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md §4: per-cell-line
# AUC bands match Krasnov 2026 §3.1 main + Rusanov 2025 Table S4-S5.
# Per TODO/02_metrics/METRICS_TARGETS.md §2: m1_auc target 0.86 MEASURED;
# per-cell-line band targets PROJECTED.
# Per TODO/02_metrics/MECHANISM_METRIC_MAPPING.md §3: M17 reference loader
# axis + M1 cytotoxicity metric axis cross-walk.
# HONEST FRAMING (party-twenty-spirit §3.5): per-cell-line targets are
# PROJECTED, not MEASURED — actual MEASURED values pending Wf-A8 retrain
# + USER_OK-gated Blackwell sm_120 launch per AGENTS.md §5.1.
# Per Rusanov 2025 Table S4-S5 approximations (Pt cisplatin):
#   A2780 ≥ 0.75 (most data; cisplatin-naive cell line)
#   MCF7 ≥ 0.70 (less data; breast cancer cell line)
#   A549 ≥ 0.65 (least data; lung cancer cell line)
#   A2780cis ≥ 0.85 (cisplatin-resistant variant; high discriminator)
# Per-cell-line targets are PROJECTED per Rusanov 2025 Table S4-S5
# approximations; MEASURED values pending Wf-A8 retrain.
# =============================================================================
eval:
  per_pair_metrics:
    - test_auc
    - val_auc
    - wasserstein_final
    - best_epoch  # val_auc-based selection (NOT best-seed)
  per_cell_line_metrics:
    - A2780_test_auc
    - MCF7_test_auc
    - A549_test_auc
    - A2780cis_test_auc
  # Per-cell-line target bands — PROJECTED per Rusanov 2025 Table S4-S5;
  # MEASURED values pending Wf-A8 retrain.
  target_per_cell_line:
    A2780: 0.75     # PROJECTED — most-data cell line; Rusanov 2025 Table S4-S5
    MCF7: 0.70      # PROJECTED — less-data cell line; Rusanov 2025 Table S4-S5
    A549: 0.65      # PROJECTED — least-data cell line; Rusanov 2025 Table S4-S5
    A2780cis: 0.85  # PROJECTED — cisplatin-resistant; high discriminator; Rusanov 2025 Table S4-S5
  target_overall: 0.74  # PROJECTED — average across 4 cells; consistent with m1_auc target per TODO/02_metrics/METRICS_TARGETS.md

# ============================================================================
# OUTPUT — REPO_ROOT results/ per project convention (TODO/README.md §1)
# Wf-A5 N3 checkpoint resumption per user voice "训练时不降低效率且能断点续训".
# Wf-A8 (2026-10-03) PlatinAI 4-cell loader — base_dir updated to match
# the renamed platinai_pt_4cell_5seed_50ep prefix.
# =============================================================================
output:
  base_dir: results/platinai_pt_4cell_5seed_50ep
  per_metal_dir: results/platinai_pt_4cell_5seed_50ep/{metal}/per_seed_metrics_seed{seed}.json
  training_summary: results/platinai_pt_4cell_5seed_50ep/training_summary.json
  log_master: results/platinai_pt_4cell_5seed_50ep/master.log
  # Wf-A6 A3 BLOCKER B fix (2026-10-03) — ckpt_dir is the canonical Wf-131 P3
  # + Wf-251-F4 checkpoint storage path per AGENTS.md §5.5 filesystem-truth;
  # do not remove or rename. Without this, start.sh fallback resolves
  # {ckpt_dir} to results/auto/ckpts instead of molmetal/checkpoints, which
  # breaks resume_from: auto (the resume_from code scans ckpt_dir for
  # dmpnn_mtw_{metal}_seed{seed}.pt). Wf-131 P3 + Wf-251-F4 use this
  # canonical path; Wf-A6 fixes it for Wf-A5 N3 resume_from integration.
  ckpt_dir: molmetal/checkpoints
  # Wf-A5 N3 — checkpoint resumption (per A5_remaining_tasks.json §N3
  # design field + user voice 2026-10-03 "训练时不降低效率且能断点续训").
  # checkpoint_interval = N epochs between persisted resumable checkpoints
  # (final epoch always saves regardless of interval).  resume_from = how
  # to load prior state at the start of each (metal, seed) run:
  #   'auto' — scan ckpt_dir for dmpnn_mtw_{metal}_seed{seed}.pt; cold
  #                   start if not found
  #   'none' — always cold start (ignore any pre-existing checkpoint)
  #   'path' — use --resume-from-path (explicit)
  # Both map to `torch.save` epoch + `trainer flag` — see Wf-A5-N3 closeout
  # in TODO/completed/N3_checkpoint_resume.md + trainer docs at line ~719.
  checkpoint_interval: 50
  resume_from: auto
  # Wf-TUI NEW — structured events.jsonl path for TUI dashboard per user
  # voice "希望他是一个会在终端里面会像nvtop一样实时刷新的表".
  events_jsonl_path: results/platinai_pt_4cell_5seed_50ep/events.jsonl
  events_jsonl: true

# ============================================================================
# COMPUTE
# Per TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md §6: Blackwell sm_120
# + RTX 5090 are the canonical Tier-2 §3 GPU compute; kanzi_venv pattern
# is deprecated per AGENTS.md §5.9 single-venv rule.
# Per AGENTS.md §5.9 single-venv rule: launch wrapper MUST use the project
# venv /home/hugo/codes/mol-metal/.venv/bin/python, NOT bare /usr/bin/python,
# NOT legacy CadButEaas venvs, NOT kanzi_venv.
# RESOLVED 2026-10-03. The paragraph that stood here read:
#   "HONEST-NEGATIVE: current venv has torch==2.14.0+rocm7.2 (cpu_available=False);
#    ... Closure path = pip install torch==2.14.0+cu130 + uv lock regen"
# That is now FALSE and has been removed rather than left to mislead.
# RE-MEASURED with .venv/bin/python:
#   torch 2.14.1+cu130 | torch.version.hip is None | cuda.is_available() True
#   device_count 2 | real 64x64 matmul on cuda:0 succeeded
# So the CUDA build the user asked for ("torch 环境的话应该是 cuda 的，rocm 在这个
# 机子里面彻底是不需要的") is ALREADY installed; no pip install / uv lock work is
# outstanding, and no GPU run falls back to CPU. Nothing further to close here.
# =============================================================================
compute:
  gpu: cuda:0  # RTX PRO 6000 Blackwell (per TODO/decisions/0002-tier2-scope.md)
  cpu_workers: 8  # PyTorch DataLoader docs; cross-ref: Wf-358-A3
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'bf16: false' removed — the 'only CFM trainer has --bf16' claim is FALSE: grep shows zero bf16/autocast in the CFM trainer too.
  torch_compile: false  # SCHEMA-ONLY field; D-MPNN trainer has no --torch-compile flag (only CFM trainer has Wf-431-B1)
  cudnn_benchmark: false  # SCHEMA-ONLY field; D-MPNN trainer has no --cudnn-benchmark flag
  channels_last: false  # SCHEMA-ONLY field; D-MPNN is not a ConvNet so channels_last does not apply
  tf32: high  # SCHEMA-ONLY field; torch default is 'high' for matmul.allow_tf32 + cudnn.allow_tf32
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'amp: bf16' removed (no AMP path).

