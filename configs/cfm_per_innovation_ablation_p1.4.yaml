# Wf-A8 yaml-unify pattern applied 2026-10-03 per task brief
# Wf-A8c yaml-alignment fix applied 2026-10-03 (this commit)
# Per AGENTS.md §5.5 filesystem-truth + §5.6 atomic-write + §5.7 trainer-flag-smoke
# Per user voice 2026-10-03 verbatim simple scientific fix for alignment-not-reproduction
# Cross-links: TODO/completed/A8_m17_yaml_rewrite.md §0 + TODO/decisions/0002-tier2-scope.md
# Cross-links: TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md + COMPARISON_BASELINES.md
# Original yaml preserved in .bak.wfa8other (yaml.safe_dump loses comments by design)
# Pre-patch backup: .bak.wfa8c (per AGENTS.md §5.6 safe_overwrite_check contract)
# Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: removed 'dry_run: true' + 'user_ok_required: true' (no consumer anywhere).
data:
  # 2026-10-04 — REPOINTED: MetalCytoToxDB -> tmQM (same change as
  # configs/cfm_full_retrain.yaml; see that file's data block for the full
  # account).  In short: `dataset: metalcytotox_5metal` resolved to no
  # argparse dest, no live corpus was wired, and the trainer's else branch
  # supplied ONE jittered square-planar Pt layout -- while the config's own
  # `do_not_claim` forbade claiming synthetic Pt clouds.  The property corpus
  # has no metal atom in its structures (MEASURED: 0 of 800 rows), so it
  # cannot feed a metal-GEOMETRY-conditioned decoder; it belongs to the
  # D-MPNN entry.  tmQM carries the metal in the geometry.
  dataset: tmqm
  tmqm_dir: .data/molmetal/tmQM
  tmqm_metals: Pt,Ru,Ir,Rh,Os,Re
  tmqm_coord_number: -1
  tmqm_val_frac: 0.2
model:
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'backbone' removed (no --backbone dest).
  hidden_dim: 128
  n_layers: 3
  # 2026-10-04: was 14, which matched NOTHING.  The YuelBond path derives
  # its width from _YUELBOND_Z_TABLE (13 entries) and the Lipman adapter
  # uses 12; the declared value reached no code path, so it was never
  # checked.  It is now a GUARD: --atom-vocab-size fails loudly on mismatch.
  atom_vocab_size: 13
  bond_head: learned
  joint_train: true
  cfm_decoder: yuelbond
  # 2026-10-04 — production EGNN velocity field (see configs/cfm_tmqm_all6.yaml
  # for the full rationale).  Without this the trainer builds CFMJointModel,
  # whose velocity path is a 2-layer MLP placeholder, and every `flow:` term
  # below regularises that placeholder instead of a real SE(3) field.
  use_egnn_velocity: true
  egnn_max_atomic_number: 100
  egnn_context_dropout: 0.1
  # 2026-10-04 — warm-start the EGNN encoder from the F2 tmQM pretrain
  # output (138,112 params, 5 regression targets incl. metal_bo_total and
  # coord_number).  The interface has existed since TODO-08 and the checkpoint
  # has been on disk all along, but no config-driven path ever set it, so the
  # velocity field trained from random init in every shipped run.
  use_tmqm_init: true
flow:
  # 2026-10-04 — bond head objective + decision rule.  See
  # configs/cfm_tmqm_all6.yaml for the full reasoning and the MEASURED
  # numbers behind each value.
  bond_class_weights: true
  bond_class_weight_power: 0.5
  bond_decision: threshold
  bond_decision_threshold: 0.5
  # 2026-10-04 — RESTORED, now that there is a sampler to configure.
  #
  # These keys were removed earlier the same day because the CFM trainer had
  # no generation path at all: no --n-steps, no --method, no generate(), so a
  # step count and an integrator configured nothing.  `decode_ratio` measures
  # the bond decoder on the REAL geometry, which is perception, not sampling.
  #
  # The trainer now integrates v(x,t) from x0 ~ N(0,I) with the cloned
  # reference solver (molmetal/adapters/flow_matching_lipman/_reference/solver)
  # and decodes the result — `gen_validity` in the metrics.  Integrator
  # accuracy verified against the exact solution of dx/dt = -x at 64 steps:
  # euler 2.9e-3, midpoint 1.5e-5, rk4 6.0e-8.
  n_steps: 100
  method: rk4
  # NOTE: `ot_solver: w_flow` is NOT restored.  The trainer's OT switch is
  # `--ot-coupling-mode {assignment,sample}` (plus --use-ot-cfm), which picks
  # between an exact permutation and a two-point Bass draw — not the
  # solver/loss pairing the old key name implied.  Naming it `ot_solver` here
  # would re-create exactly the kind of key that looks wired and is not.

protocol:
  # 2026-10-04 — how many val compositions to generate from noise and
  # decode for RDKit validity each epoch.  0 disables (decode-only).
  gen_validity_samples: 16
  n_seeds: 1  # Wf-A11: seed list removed — CFM dest is singular --seed (enumerated by entry.command_template); n_seeds read by scripts/start.sh
  epochs: 3
  batch_size: 16
  lr: 0.0001
  warmup_steps: 50  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: now wired via loader alias -> --lr-warmup-steps; inactive unless --use-lr-warmup is set (CFM default False).
  # Wf-A11 (2026-10-03): 'grad_clip_norm: 1.0' REMOVED — dead key (real dest is --max-norm,
  # declared 5.0 below); it never reached the trainer in any run.
  # RESOLVED 2026-10-03 by MEASUREMENT, not preference. 5.0 is correct and stays:
  #   grad norms from the real CFM run in results/cfm_per_innovation_ablation_p1.4/
  #   events.jsonl (14 epoch records): min 2.37 / median 2.83 / max 3.58.
  #     -> at max_norm=5.0 clipping binds 0/14 steps: a real safety net, never throttling a
  #        healthy run, which is what gradient clipping is for.
  #     -> at max_norm=1.0 it would bind 14/14, converting every update into a ~2.9x
  #        constant-magnitude rescale and silently changing the effective learning rate.
  #   Corroboration: chemprop v1.5.2 and v2.3.1 both default grad_clip to None (no clipping),
  #   so 5.0 is already MORE conservative than the reference framework.
  #   Reproducibility: every shipped CFM number was produced at 5.0; the trainer docstring
  #   pins 5.0 to preserve the Wf-124 P2 + Wf-148 baseline bit-for-bit.
  #   See TODO/completed/config_dead_key_remediation.md.
  ema_decay: 0.999
  # 2026-10-04: was 6.0, which the run never used — the decoder's own
  # default of 3.5 was in force, so this key misreported the geometry the
  # shipped numbers actually had.  3.5 is what YuelBond filters at
  # ("cutoff=3.5 A excludes 4.1 A Cl-Cl"); --edge-cutoff now carries it
  # into YuelBondDecoderHead, so editing this number now changes the run.
  edge_cutoff: 3.5
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'bf16' removed (zero bf16/autocast in either trainer).
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0
ablation_configs:
  a_full_stack:
    description: Full stack (YuelBond + W2 + Catherine) — Wf-124 P2 control
    flags:
    - --use-yuelbond
    expected_per_metric:
      decode_ratio: 0.7
      wasserstein_loss: 0.4
      catherine_pass_rate: 0.95
  b_yuelbond_only:
    description: YuelBond only (no W2, no Catherine)
    flags:
    - --use-yuelbond
    - --no-wasserstein
    - --no-closure-bounded
    expected_per_metric:
      decode_ratio: 0.6
      wasserstein_loss: 0.0
      catherine_pass_rate: 0.8
  c_w2_only:
    description: W2 only (no YuelBond, no Catherine)
    flags:
    - --no-yuelbond
    - --no-closure-bounded
    expected_per_metric:
      decode_ratio: 0.4
      wasserstein_loss: 0.4
      catherine_pass_rate: 0.8
  d_catherine_only:
    description: Catherine only (no YuelBond, no W2)
    flags:
    - --no-yuelbond
    - --no-wasserstein
    expected_per_metric:
      decode_ratio: 0.5
      wasserstein_loss: 0.0
      catherine_pass_rate: 0.95
output:
  base_dir: results/cfm_per_innovation_ablation_p1.4
  log_master: results/cfm_per_innovation_ablation_p1.4/master.log
  ckpt_dir: results/cfm_per_innovation_ablation_p1.4/checkpoints
  # 2026-10-04 — was `molmetal/checkpoints`, the repo-global directory.
  # MEASURED: that default let a 1-epoch/32-sample pytest run overwrite the
  # shipped `cfm_yuelbond_wasserstein.pt`, whose 50-epoch weights are not in
  # git and had no surviving copy.  With `--resume-from auto` also reading
  # this directory, a stale smoke checkpoint then poisons the next real
  # launch.  Pointed at this run's own directory so a run can only ever
  # resume from itself.  See the `--ckpt-dir` help in the trainer.
  events_jsonl: true
  # 2026-10-04 — `resume_from` replaces the `entry.warm_start_checkpoint`
  # key, which was DEAD: grep across *.py/*.sh finds zero readers, and
  # `entry:` is outside the config loader's whitelisted sections, so it
  # was dropped without even the usual skip warning.  start.sh reads
  # THIS key (scripts/start.sh:438) and passes it as --resume-from, which
  # the trainer now implements (it, too, had zero read sites before).
  # 'auto' = resume ckpt_dir/cfm_yuelbond_wasserstein_seed{seed}.pt when
  # present; 'none' = cold start; 'path' = --resume-from-path.
  resume_from: auto
  resume_from_path: null
waves:
  total_waves: 4
  wave_a:
    description: Full stack control (YuelBond + W2 + Catherine)
    ablation_config: a_full_stack
    seeds:
    - 0
    epochs: 3
    wall_time_estimate: 0.5
  wave_b:
    description: YuelBond only
    ablation_config: b_yuelbond_only
    seeds:
    - 0
    epochs: 3
    wall_time_estimate: 0.5
  wave_c:
    description: W2 only
    ablation_config: c_w2_only
    seeds:
    - 0
    epochs: 3
    wall_time_estimate: 0.5
  wave_d:
    description: Catherine only
    ablation_config: d_catherine_only
    seeds:
    - 0
    epochs: 3
    wall_time_estimate: 0.5
  total_wall_time_estimate: 2.0
compute:
  gpu: cuda:0
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'cpu_workers: 4' removed (CFM trainer has no --cpu-num-workers dest; only D-MPNN does).
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'bf16' removed (zero bf16/autocast in either trainer).
directives:
  kill_then_adapt: true
  # 2026-10-03 user directive: session budget is 48h ("我给48小时的预算").
  # The old 10h/13h values made the per-wave budget gate FAIL on a resource
  # dimension that is not actually constrained; with 48h the gate still does
  # real work (it FAILs a wave whose declared grid exceeds the declared
  # budget) but no longer blocks a legitimate launch.
  time_budget: 48h
  user_ok_required: true
  user_ok_granted: pending — DRY-RUN only
  per_wave_user_ok_required: true
  pre_flight_gates_required:
  - p1_pytorch_cuda_available
  - p2_tests_pass
  - p3_wf343c4_anchor_freshness_24h
  - p3_wf343c2_per_wave_runtime_check
entry:
  script: molmetal/scripts/train_cfm_yuelbond_wasserstein.py
  # Wf-A8c FIX C: replace inline CLI flags with yaml-driven --config pattern
  # Per AGENTS.md §5.5 + §5.7 + user voice "never use CLI again always yaml"
  # All retrain hyperparameters live in yaml sections above (data + model + flow + train + protocol);
  # trainer applies via wfA2_config_loader.py
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_cfm_yuelbond_wasserstein.py --config {yaml_path} --seed {seed} --out-dir {out_dir}
  # FIX C: yaml-driven config + only debug/seed/out-dir CLI flags remain (per task brief DEBUG_FLAG_OVERRIDES)
  # Original inline-CLI command preserved as legacy_inline_command for backward-compat rollback only
  # NOT used by start.sh per AGENTS.md §5.8 + §5.5 filesystem-truth
  legacy_inline_command: "CUDA_VISIBLE_DEVICES=0 /home/hugo/codes/mol-metal/.venv/bin/python \\n  molmetal/scripts/train_cfm_yuelbond_wasserstein.py\\n  --epochs {epochs} \\n  {flags_joined} \\n  --pocket-id {pocket_id} \\n  --seed {seed} \\n  --out-dir {out_dir}\n"
honest_framing:
  # 2026-10-04 CORRECTION — this config previously carried no corpus claim at
  # all, which is how it could run on the synthetic Pt-click layout while
  # sitting next to `dataset: metalcytotox_5metal` (a key that resolved to no
  # argparse dest).  The corpus is now stated, and it is the one actually read.
  claims:
  - 'Per-innovation CFM ablation: YuelBond / W2 / Catherine / all-combined'
  - Corpus is tmQM CSD-derived metal-bearing geometry (six target metals Pt/Ru/Ir/Rh/Os/Re, disjoint CSD-code-hash split)
  - 4 ablation configs x 1 seed x 3 epochs, ~2 hr on PRO 6000
  - Per-lever attribution matrix (4 ablations) for paper §3 honesty
  do_not_claim:
  - MetalCytoToxDB as this entry's corpus — its structures contain no metal atom (MEASURED 0 of 800 sampled rows)
  - Aggregate lift before per-lever attribution
  - Per-lever percentages as MEASURED until all 4 ablations complete
  - Interaction term sign or magnitude (may be >30% per TODO-182 §3.4)
  deferred:
  - 'Cross-leverage interaction runs (3 pairwise interactions: YuelBond x W2, YuelBond x Catherine, W2 x Catherine) — would
    double wave count to 8'
  - Per-cohort (PlatinAI / DrugOOD) cross-tabulation
  - ablation_report.json write + audit (post-wave)
cross_references:
- molmetal/reports/wf258_audit/cfm_todo_gap_audit.md
- TODO/completed/119_decode_ratio_strengthen.md
- TODO/pending/182_wf124_p3_per_innovation_ablation.md
- molmetal/reports/wf257_research/cfm_potential.md
- configs/cfm_full_retrain.yaml
- molmetal/scripts/train_cfm_yuelbond_wasserstein.py
- molmetal/checkpoints/cfm_yuelbond_wasserstein.pt
  - Per-config ablation matrix + ablation_report.json — the trainer emits the per-epoch metrics, but the matrix that consumes them is driven by the top-level waves block (metadata), not by the trainer
