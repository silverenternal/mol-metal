# Wf-A8 yaml-unify pattern applied 2026-10-03 per task brief
# Wf-A8c yaml-alignment fix applied 2026-10-03 (this commit)
# Per AGENTS.md §5.5 filesystem-truth + §5.6 atomic-write + §5.7 trainer-flag-smoke
# Per user voice 2026-10-03 verbatim simple scientific fix for alignment-not-reproduction
# Cross-links: TODO/completed/A8_m17_yaml_rewrite.md §0 + TODO/decisions/0002-tier2-scope.md
# Cross-links: TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md + COMPARISON_BASELINES.md
# Original yaml preserved in .bak.wfa8other (yaml.safe_dump loses comments by design)
# Pre-patch backup: .bak.wfa8c (per AGENTS.md §5.6 safe_overwrite_check contract)
dry_run: true
user_ok_required: true
data:
  dataset: metalcytotox_5metal  # Wf-A8c FIX A: rename cfm_per_innovation_ablation_p1.4 → metalcytotox_5metal (Krasnov 2026 baseline anchor per PROTOCOL_ALIGNMENT_MATRIX.md §1)
  csv: .data/molmetal/metalcytotox_5metal_multitask_v2.csv
  n_rows_expected: 26632
  expected_columns_subset:
  - smiles
  - metal
  - pic50
  - source
  cohort_filter:
    metals:
    - Ru
    - Ir
    - Os
    - Rh
    - Re
    scaffold_split: true
  split:  # Wf-A8c FIX B: add data.split block per PROTOCOL_ALIGNMENT_MATRIX.md §3 (Krasnov 2026 MetalCytoToxDB Bemis-Murcko 70/10/20 scaffold split)
    type: scaffold_split  # Krasnov 2026 baseline anchor
    train_frac: 0.7
    val_frac: 0.1
    test_frac: 0.2
    seed: 261  # Wf-261 strict Bemis-Murcko scaffold split RNG seed (0 leak verified)
model:
  backbone: chemprop_v2_mt
  hidden_dim: 128
  n_layers: 3
  atom_vocab_size: 14
  bond_head: learned
  joint_train: true
  cfm_decoder: yuelbond
flow:
  n_steps: 100
  method: rk4
  ot_solver: w_flow
protocol:
  n_seeds: 1
  seeds:
  - 0
  epochs: 3
  batch_size: 16
  lr: 0.0001
  warmup_steps: 50
  grad_clip_norm: 1.0
  ema_decay: 0.999
  edge_cutoff: 6.0
  bf16: true
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0
ablation_configs:
  a_full_stack:
    description: Full stack (YuelBond + W2 + Catherine) — Wf-124 P2 control
    flags:
    - --use-yuelbond
    expected_per_metric:
      decode_ratio: 0.7
      wasserstein_loss: 0.4
      catherine_pass_rate: 0.95
  b_yuelbond_only:
    description: YuelBond only (no W2, no Catherine)
    flags:
    - --use-yuelbond
    - --no-wasserstein
    - --no-closure-bounded
    expected_per_metric:
      decode_ratio: 0.6
      wasserstein_loss: 0.0
      catherine_pass_rate: 0.8
  c_w2_only:
    description: W2 only (no YuelBond, no Catherine)
    flags:
    - --no-yuelbond
    - --no-closure-bounded
    expected_per_metric:
      decode_ratio: 0.4
      wasserstein_loss: 0.4
      catherine_pass_rate: 0.8
  d_catherine_only:
    description: Catherine only (no YuelBond, no W2)
    flags:
    - --no-yuelbond
    - --no-wasserstein
    expected_per_metric:
      decode_ratio: 0.5
      wasserstein_loss: 0.0
      catherine_pass_rate: 0.95
eval:
  per_config_metrics:
  - decode_ratio
  - wasserstein_loss
  - catherine_pass_rate
  target_decode_ratio: 0.5
output:
  base_dir: results/cfm_per_innovation_ablation_p1.4
  per_config_dir: results/cfm_per_innovation_ablation_p1.4/{config_name}
  metrics_json: results/cfm_per_innovation_ablation_p1.4/ablation_report.json
  log_master: results/cfm_per_innovation_ablation_p1.4/master.log
  ckpt_dir: molmetal/checkpoints
  events_jsonl: true
waves:
  total_waves: 4
  wave_a:
    description: Full stack control (YuelBond + W2 + Catherine)
    ablation_config: a_full_stack
    seeds:
    - 0
    epochs: 3
    wall_time_estimate: 0.5
  wave_b:
    description: YuelBond only
    ablation_config: b_yuelbond_only
    seeds:
    - 0
    epochs: 3
    wall_time_estimate: 0.5
  wave_c:
    description: W2 only
    ablation_config: c_w2_only
    seeds:
    - 0
    epochs: 3
    wall_time_estimate: 0.5
  wave_d:
    description: Catherine only
    ablation_config: d_catherine_only
    seeds:
    - 0
    epochs: 3
    wall_time_estimate: 0.5
  total_wall_time_estimate: 2.0
compute:
  gpu: cuda:0
  cpu_workers: 4
  bf16: true
directives:
  kill_then_adapt: true
  time_budget: 10h
  user_ok_required: true
  user_ok_granted: pending — DRY-RUN only
  per_wave_user_ok_required: true
  pre_flight_gates_required:
  - p1_pytorch_cuda_available
  - p2_tests_pass
  - p3_wf343c4_anchor_freshness_24h
  - p3_wf343c2_per_wave_runtime_check
entry:
  script: molmetal/scripts/train_cfm_yuelbond_wasserstein.py
  # Wf-A8c FIX C: replace inline CLI flags with yaml-driven --config pattern
  # Per AGENTS.md §5.5 + §5.7 + user voice "never use CLI again always yaml"
  # All retrain hyperparameters live in yaml sections above (data + model + flow + train + protocol);
  # trainer applies via wfA2_config_loader.py
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_cfm_yuelbond_wasserstein.py --config {yaml_path} --flags "{flags_joined}" --seed {seed} --out-dir {out_dir}
  # FIX C: yaml-driven config + only debug/seed/out-dir CLI flags remain (per task brief DEBUG_FLAG_OVERRIDES)
  warm_start_checkpoint: molmetal/checkpoints/cfm_yuelbond_wasserstein.pt
  # Original inline-CLI command preserved as legacy_inline_command for backward-compat rollback only
  # NOT used by start.sh per AGENTS.md §5.8 + §5.5 filesystem-truth
  legacy_inline_command: "CUDA_VISIBLE_DEVICES=0 /home/hugo/codes/CadButEaas/.venv-vlm/bin/python \\n  molmetal/scripts/train_cfm_yuelbond_wasserstein.py\\n  --epochs {epochs} \\n  {flags_joined} \\n  --pocket-id {pocket_id} \\n  --seed {seed} \\n  --out-dir {out_dir}\n"
honest_framing:
  claims:
  - 'Per-innovation CFM ablation: YuelBond / W2 / Catherine / all-combined'
  - 4 ablation configs x 1 seed x 3 epochs, ~2 hr on PRO 6000
  - Per-lever attribution matrix (4 ablations) for paper §3 honesty
  do_not_claim:
  - Aggregate lift before per-lever attribution
  - Per-lever percentages as MEASURED until all 4 ablations complete
  - Interaction term sign or magnitude (may be >30% per TODO-182 §3.4)
  deferred:
  - 'Cross-leverage interaction runs (3 pairwise interactions: YuelBond x W2, YuelBond x Catherine, W2 x Catherine) — would
    double wave count to 8'
  - Per-cohort (PlatinAI / DrugOOD) cross-tabulation
  - ablation_report.json write + audit (post-wave)
cross_references:
- molmetal/reports/wf258_audit/cfm_todo_gap_audit.md
- TODO/completed/119_decode_ratio_strengthen.md
- TODO/pending/182_wf124_p3_per_innovation_ablation.md
- molmetal/reports/wf257_research/cfm_potential.md
- configs/cfm_full_retrain.yaml
- molmetal/scripts/train_cfm_yuelbond_wasserstein.py
- molmetal/checkpoints/cfm_yuelbond_wasserstein.pt
