# AttentiveFP backbone on BACE, 5 seeds (BLK-D1 Step 4).
#
# 2026-10-09 (AGENTS.md §5.11 — "以后要求能且只能用yaml配置启动训练和推理，
# no cli参数"): created when scripts/launch_wf_blk_d1_attentivefp_5seed.sh stopped passing hyperparameters as
# CLI flags. The values below are a FAITHFUL transcription of what that wrapper's
# command line actually passed, so this file records the run as it was executed.
#
# The loader resolves each leaf by name against the trainer's parser dests
# (wfA2_config_loader leaf-fallback over data/model/protocol/output); `--config` wiring was added
# to train_moleculenet.py on the same date, which is why a config could not express this
# run before.
data:
  tasks:
  - bace
  scaffold_split: true
model:
  backbone: attentivefp
  hidden: 300
  depth: 3
  class_weight: 'on'
protocol:
  epochs: 50
  batch_size: 64
  lr: 0.001
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
output:
  base_dir: molmetal/reports/blk_d1_attentivefp_5seed_2026_10_09
  out_metric: molmetal/reports/blk_d1_attentivefp_5seed_2026_10_09/metrics.json
  out_report: molmetal/reports/blk_d1_attentivefp_5seed_2026_10_09/report.md
  events_jsonl: true
entry:
  script: molmetal/scripts/train_moleculenet.py
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_moleculenet.py
    --config {yaml_path} --out-dir {out_dir}
honest_framing:
  note: FAITHFUL TRANSCRIPTION of the pre-§5.11 command line.
  residual: '`data.scaffold_split` is declared True because the trainer''s --scaffold-split
    default is True (store_true, default=True), so the wrapper never had to pass it.'
