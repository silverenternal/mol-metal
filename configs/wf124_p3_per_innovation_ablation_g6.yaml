      - 0
      - 1
      - 2
    no_wass:
      ru:
      - 0
      - 1
      - 2
      ir:
      - 0
      - 1
      - 2
      os:
      - 0
      - 1
      - 2
      rh:
      - 0
      - 1
      - 2
      re:
      - 0
      - 1
      - 2
    no_kendall:
      ru:
      - 0
      - 1
      - 2
      ir:
      - 0
