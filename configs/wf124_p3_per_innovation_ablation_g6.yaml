# Wf-A8 yaml-unify pattern applied 2026-10-03 per task brief
# Per AGENTS.md §5.5 filesystem-truth + §5.6 atomic-write + §5.7 trainer-flag-smoke
# Cross-links: TODO/completed/A8_m17_yaml_rewrite.md §0 + TODO/decisions/0002-tier2-scope.md
# Cross-links: TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md + COMPARISON_BASELINES.md
# Original yaml preserved in .bak.wfa8other (yaml.safe_dump loses comments by design)
# Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: removed 'dry_run: true' + 'user_ok_required: true' (no consumer anywhere; launch mode = start.sh flags + USER_OK env, AGENTS.md 5.1)
data:
  dataset: metalcytotox_5metal  # Wf-A8c FIX
  split:
    type: scaffold_split  # Krasnov 2026 baseline
  csv: .data/molmetal/metalcytotox_5metal_multitask_v4.csv
  n_rows_expected: 26632
  expected_columns_subset:
  - smiles
  - metal
  - scaffold_id
  - split
  - activity
  - pic50
  - cell_line
  - source
  cohort_filter:
  dataset: metalcytotox_5metal  # Wf-A8c FIX
  split:
    type: scaffold_split  # Krasnov 2026 baseline
    metals:
    - Ru
    - Ir
    - Os
    - Rh
    - Re
    scaffold_split: true
    # 2026-10-03: ratios added — the config declared `type: scaffold_split`
    # but no fractions, so a reader could not tell 70/10/20 from 80/10/10.
    # These mirror what the trainer actually does: wfA2's ScaffoldSplitter
    # is Bemis-Murcko / largest_first with fractions hardcoded at
    # train_dmpnn_multitask_wasserstein.py:699 as (0.7, 0.1, 0.2).  The
    # yaml does NOT control the split today (there are no split CLI flags),
    # so this is a truthful declaration, not a setting — pre-flight's
    # split check fails if the two ever diverge.
    train_frac: 0.7
    val_frac: 0.1
    test_frac: 0.2
    split_column: split
model:
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'backbone' removed (no --backbone dest in either trainer; never reached the trainer).
  hidden_dim: 300
  depth: 3
  alpha: 0.5
  n_mc: 256
  w2_gradient_mode: sliced
protocol:
  n_seeds: 3
  seeds:
  - 0
  - 1
  - 2
  epochs: 50
  batch_size: 64
  lr: 0.001
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'grad_clip_norm: 5.0' removed (loader alias grad_clip_norm->--max-norm; operative key = protocol.max_norm: 5.0 below).
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'bf16' removed (ZERO bf16/autocast/GradScaler occurrences in either trainer; claimed an AMP path that does not exist).
  total_runs: 60
  wave_decomposition: 8
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0
ablation_configs:
  no_multi_task:
    description: Single-task D-MPNN (Ru-only) + W2 + L2 guard (baseline lever off)
    flags:
    - --single-task
  no_wass:
    description: Multi-task 5-metal + L2 guard (W2 disabled)
    flags:
    - --wasserstein-weight 0.0
  no_kendall:
    description: Multi-task + W2 + L2 guard (Kendall uncertainty OFF)
    flags: null
    status: verified-by-wf283b+wf285b
  no_dann:
    description: Multi-task + W2 + L2 guard (DANN adversarial OFF)
    flags: null
    status: verified-by-wf283b+wf285b
  total_runs: 60
runs:
  per_config_count: 15
  total_count: 60
  matrix:
    no_multi_task:
      ru:
      - 0
      - 1
      - 2
      ir:
      - 0
      - 1
      - 2
      os:
      - 0
      - 1
      - 2
      rh:
      - 0
