# PlatinAI 4-cell re-run on the descriptor-labelled cohort.
#
# WHY THIS RUN EXISTS
# -------------------
# metrics/by_metric/platinai_4cell_auc.json is VOID (see its
# void_auc_measurement block, and commit 5781dd98f7): _predict scored
# every AUC on the first batch only, so the recorded numbers came from 32
# molecules rather than n_test=815. Those numbers must be replaced, not
# repaired.
#
# It also runs against a DIFFERENT cohort than the original. The original
# molmetal/data/platinai_4cell.csv has no molecule-dependent label term
# for MCF7/A549/A2780 - the label is a per-cell-line constant plus
# N(0, 0.45) noise (MEASURED corr(log10 IC50, heavy_atom_count) =
# -0.0095 / -0.0254 / -0.0324), so those three lines CANNOT exceed chance
# no matter what the model does. Only A2780cis carries a structure term,
# and it is gated on n_heavy > 25.
#
# platinai_4cell_desc_v1.csv is the versioned cohort built by
# `build_platinai_4cell.py --descriptor-terms`: it adds the HOMO/LUMO/gap/
# Polarizability linear model that the builder's own docstring always
# promised but never implemented. Its coefficients are A-PRIORI, NOT
# fitted - no real per-cell-line IC50 table is joinable to the tmQM DFT
# descriptors on this host. So this measures whether the model can LEARN
# a known linear signal; it is not evidence about real cytotoxicity.
#
# ORACLE CEILING, MEASURED (z-scored descriptors, n=3598 with a match):
# scoring on -desc_term gives AUC 0.81-0.83 on all four lines; a D-MPNN
# that learns nothing sits at 0.50. Anything at 0.50 here means the
# signal was not learned.

entry:
  script: molmetal/scripts/train_platinai_4cell.py
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_platinai_4cell.py
    --config {yaml_path} --out-dir {out_dir}
data: molmetal/data/platinai_4cell_desc_v1.csv
seeds: [0, 1, 2]

# SECTIONS, NOT FLAT KEYS (AGENTS.md §5.11).
#
# These six keys were flat at the top level until 2026-10-11 and the
# pre-flight gate flagged them. MEASURED cause: apply_yaml_overrides walks the
# NESTED structure, so a top-level `batch_size:` never reaches the dest. Every
# value here happened to equal its argparse default, so the run was not wrong --
# but any edit to them would have been silently ignored. Verified after the
# move: parse_args(["--config", this]) returns 32 / 1e-3 / 128 / 3 / 50 /
# 0.5 by TYPE and by value, and a probe config with non-default values in
# these same sections reaches every dest.
train:
  epochs: 50
  batch_size: 32
  lr: 1.0e-3
  alpha: 0.5
  scaffold_split: true

model:
  hidden: 128
  depth: 3

cuda_visible_devices: "0"

# Sections required by scripts/_pre_flight_check.sh (data/model/protocol/
# output/directives). `protocol.scaffold_split` is a _NON_TRAINER_PATH, so it
# does not shadow the `train.scaffold_split` dest.
protocol:
  scaffold_split: true
output:
  base_dir: molmetal/reports/platinai_4cell_desc_v1_rerun
  out_dir: molmetal/reports/platinai_4cell_desc_v1_rerun
  log_master: molmetal/reports/platinai_4cell_desc_v1_rerun/master.log
  training_summary: molmetal/reports/platinai_4cell_desc_v1_rerun/training_summary.json
directives:
  user_ok_required: true

out_dir: molmetal/reports/platinai_4cell_desc_v1_rerun
out_metric: molmetal/reports/platinai_4cell_desc_v1_rerun/metrics.json
out_report: molmetal/reports/platinai_4cell_desc_v1_rerun/final.md

# Wf-P1-1 (2026-10-11) — CHECKPOINT PERSISTENCE.
# Before this key, the trainer's only output was the JSON above: `torch.save`
# appeared zero times in train_platinai_4cell.py, so the strong PlatinAI model
# existed as a NUMBER with no WEIGHTS behind it and the cross-application
# route in wf_generated_to_activity.py had to fall back to the much weaker
# MultiTaskWassersteinModel family (its own recorded test AUCs ~0.51).
#
# The trainer now defaults ckpt_dir to <out_dir>/checkpoints when it is unset,
# so this key is not strictly required — it is pinned here so the location is
# written down rather than inferred, and so the same dir is named by both the
# writer (this config) and the consumer:
#
#   .venv/bin/python molmetal/scripts/wf_generated_to_activity.py \
#       --family platinai_4cell \
#       --ckpt-dir molmetal/reports/platinai_4cell_desc_v1_rerun/checkpoints \
#       --smiles-csv <generated_smiles.csv>
#
# Filenames are platinai4cell_seed{seed}.pt (one file per seed; the cohort is
# Pt-only, so there is no metal in the name).
ckpt_dir: molmetal/reports/platinai_4cell_desc_v1_rerun/checkpoints