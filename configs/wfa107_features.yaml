# configs/wfa107_features.yaml — Wf-A107 arm "features"
# Wf-A72 Operators 2+3 (RBF distance + pair chemistry), ring prior off
#
# One-factor A/B on the Wf-A96 protocol: n_train=200, n_val=64, 5 metals,
# seed 0, 5 epochs, batch 8, edge-MPNN-residual head.  Every arm shares
# that protocol; only ring_template_weight / ring_template_formulation /
# bond_rbf_features+bond_pair_chemistry differ.
# (The old header said "budget-matched control (weight=0.0)" while the body
#  has carried 0.01 since Wf-A78; corrected by Wf-A96 so the file does not
#  describe a run it would not perform.)
# (3-layer residual pair head with LayerNorm + dropout) smoke.
#
# 2026-10-18 — Wf-A74 ships the model-side architectural upgrade that
# complements the Wf-A73 loss-side fix.  The 2-layer MLP pair head
# (~5K params, no normalisation, no dropout, no residual) is replaced
# by a 3-layer residual head:
#
#     Linear(H+3, H) -> LayerNorm -> ReLU -> Dropout(0.1)
#       -> Linear(H, H) -> LayerNorm -> ReLU -> Dropout(0.1)
#       -> Linear(H, 5)
#     + residual around the inner 2 layers
#
# Param count at H=64: ~12K (vs ~5K for the 2-layer head) — a 2.4×
# widening of the pair head.  Same message-passing backbone as
# YuelBondEdgeMPNNHead (4 message-passing layers on the line graph);
# only the pair head is upgraded.  Pair head upgrade rationales:
#
#   * Adds a second hidden layer (so the head can compose non-linear
#     features of h_e rather than just passing it through);
#   * Adds LayerNorm on each hidden activation (training stability
#     + ability to learn at higher learning rates);
#   * Adds a residual connection around the inner 2 layers (so the
#     head can recover the Wf-A71 2-layer behaviour as a degenerate
#     solution);
#   * Adds dropout 0.1 on each hidden activation (regularisation so
#     the new capacity does not memorise the 200-cloud training set).
#
# What it carries over from Wf-A73 (cfm_5metal_wfa73_operators.yaml):
#   * All Fix 6 + 7 + 8 + 9 + Operator 1 (logit adjustment tau=0.1)
#
# What it ADDS (Wf-A74 Architecture 1):
#   * bond_predictor: yuelbond_edge_mpnn_residual (new YAML value)
#
# MEASURED targets (per Wf-A72 plan Section 4):
#   * Per-class PR-AUC for AROMATIC >= 0.55 (was 0.505 at Wf-A73 tau=0.1)
#   * Per-class PR-AUC for SINGLE >= 0.7 (was 0.498 at Wf-A73 tau=0.1)
#   * bond_f1 >= 0.20 (was 0.0 at Wf-A73)
#   * largest_fragment_frac >= 0.20 (was 0.048 at Wf-A73, the
#     fragmentation problem is NOT addressed by this head upgrade
#     alone — that requires Wf-A75 MolDiff guidance).
# Menon 2020 ICLR'21, arXiv:2007.07314) on top of the Wf-A70 W3
# plumb-repair smoke.  Per-class logit adjustment adds tau * log(pi_c)
# to the logits BEFORE the CE loss, which gives the OPTIMAL decision
# boundary under known class prior without changing the model's
# output distribution.  This is the principled upgrade over the
# existing inverse-frequency `bond_class_weights` (which scales the
# per-class loss; logit adjustment shifts the per-class logit).
#
# MEASURED targets (per Wf-A71 honest-negative §6.99):
#   * Per-class PR-AUC for SINGLE >= 0.7 (was 0.514)
#   * Per-class PR-AUC for AROMATIC >= 0.6 (was 0.403)
#   * Per-class PR-AUC for DOUBLE >= 0.10 (was 0.0025)
#
# What it carries over from W3 (cfm_5metal_wfa70_w3_smoke.yaml):
#   * Bond predictor: yuelbond_edge_mpnn (Wf-A70 Fix 6)
#   * Per-class threshold sweep (Wf-A70 Fix 7)
#   * Aux MSE with τ=0.5 (Wf-A70 Fix 8)
#   * Per-class PR-AUC reporting (Wf-A70 Fix 9)
#   * EpochMetrics 44-field plumb (Wf-A70 W3)
#   * bond_class_weights: true (existing inverse-freq power 0.5)
#   * bond_class_weight_power: 0.5 (unchanged; the logit adjustment
#     is applied IN ADDITION to the weights, not as a replacement)
#
# What it ADDS (Wf-A73 Operator 1):
#   * bond_logit_adjustment: true   (per-class logit shift)
#   * bond_logit_adjustment_tau: 1.0  (textbook Menon 2020 setting)
#   * Edge MPNN head (bond_predictor=yuelbond_edge_mpnn, n_edge_layers=4)
#   * Per-class threshold sweep (Fix 7)
#   * Aux MSE with τ=0.5 (Fix 8)
#   * Per-class PR-AUC reporting (Fix 9, no retrain delta)
#
# What it reduces for smoke scale:
#   * epochs: 5 (was 30 in W2)
#   * n_seeds: 1 (was 3 in W2)
#   * n_train/n_val: small smoke subset via CLI flags
#     (200 train, 64 val — same as Wf-A68 / Wf-A69 smoke runs)
#   * gen_validity_samples: 8 (was 16)
#   * batch_size: 8 (was 16)
#
# Per AGENTS.md §5.11: every hyperparameter lives in the YAML.  The
# trainer is launched via the canonical command_template at line 195
# below — no CLI hyperparameters, only --seed + --out-dir.
#
# Per §5.7 50-step CPU smoke: this is a GPU smoke, not a flag wire-in
# smoke.  No NEW flags are introduced by W3 (Fix 8 flags were wire-in'd
# by W2; the W3 work is dataclass + plumb only).  The §5.7 requirement
# is satisfied by W2's existing 50-step smoke (6/6 PASS per the W2
# output summary).
#
# Per §5.5 filesystem-truth: every metric output by this run must
# trace to per_epoch_metrics.json + events.jsonl on disk with MEASURED
# tag.  The W3 closeout verifies the per-class + sweep + aux_mse fields
# all reach per_epoch_metrics.json.

data:
  dataset: csv
  csv: .data/molmetal/metalcytotox_5metal_multitask_v3.csv
  cohort_filter:
    metals:
      - Ru
      - Ir
      - Os
      - Rh
      - Re
model:
  hidden_dim: 128
  n_layers: 3
  atom_vocab_size: 13
  bond_head: learned
  joint_train: true
  cfm_decoder: yuelbond
  learnable_vel_scale: true
  use_egnn_velocity: true
  egnn_max_atomic_number: 100
  egnn_context_dropout: 0.1
  use_tmqm_init: false
  pcgrad_multi_task: false
  q_head_enabled: false
flow:
  bond_class_weights: true
  bond_class_weight_power: 0.5
  bond_logit_adjustment: true
  bond_logit_adjustment_tau: 0.1
  bond_head_kind: single
  bond_predictor: yuelbond_edge_mpnn_residual
  n_edge_layers: 4
  bond_decision: threshold
  bond_decision_threshold: 0.5
  bond_decision_threshold_sweep: [0.5]
  use_focal_bond_ce: false
  focal_bond_alpha: 0.25
  focal_bond_gamma: 2.0
  bond_sample_balance: 0
  dative_distance_cutoff: 2.6
  # Wf-A93 — archived run: keep the pre-Wf-A93 metal placement so
  # this config still reproduces its checkpoint.
  metal_placement: legacy
  chem_loss_weight: 0.0
  use_bond_head_skip: false
  bond_label_smoothing: 0.0
  # Fix 8 (W2) — aux MSE + temperature.
  bond_aux_mse_weight: 0.1
  bond_aux_temperature: 0.5
  bond_candidate_source: truth_only
  bond_candidate_cutoff: 2.4
  subsample_neg_ratio: 0
  subsample_neg_seed: epoch
  head_class: YuelBondDecoderHead
  bond_z_table: pt
  bond_z_metal_set: all7
  n_steps: 100
  method: rk4
  optimizer: adam
  warmup_steps: 200
  ema_decay: 0.999
  wasserstein_weight: 0.0
  closure_bounded: true
  use_yuelbond: true
  edge_cutoff: 3.5
  # Wf-A75 (2026-10-18) — MolDiff-style bond-length guidance applied to
  # the EGNN velocity field at every ODE step.  0.0 (default in Wf-A74)
  # disables guidance (back-compat).  0.1 (this config) is a mild prior
  # (~10% of EGNN velocity at full magnitude) that pulls bonded (Z_i, Z_j)
  # pairs toward their expected per-(Z_i, Z_j) distance (e.g. C-C 1.50 Å,
  # Pt-N 2.05 Å).  The guidance is a Hooke-spring force — see
  # ``_BondLengthGuidance`` in
  # ``molmetal/adapters/flow_matching_lipman/__init__.py``.
  bond_length_guidance_weight: 0.0
  # Wf-A78 (OPT-5) — ring-template prior weight.  Matches the ring-size
  # profile of the bond head's soft graph against each molecule's truth
  # profile.  0.0 (default) is an exact zero term.
  ring_template_weight: 0.0
  # Wf-A107 arm: Wf-A72 Operators 2+3 (RBF distance + pair chemistry), ring prior off
  ring_template_formulation: count
  # Wf-A107 — Wf-A72 Operators 2 + 3.
  bond_rbf_features: true
  bond_pair_chemistry: true
  n_rbf: 8
protocol:
  # Wf-A96 (2026-10-19) — the smoke subset used to live in the
  # command_template as {n_train}/{n_val}, which start.sh cannot fill (it
  # has no such placeholder), so the canonical launcher died with a
  # KeyError reported as "could not parse YAML".  They are trainer dests
  # (--n-train / --n-val), so per AGENTS.md 5.11 they belong here.
  n_train: 200
  n_val: 64
  batch_size: 8
  lr: 0.0001
  gen_validity_samples: 8
  gen_eval_n: 32
  gen_eval_seeds: "0 1 2"
  n_seeds: 1
  epochs: 5
  n_seeds_min: 1
  scheduler:
    type: cosine
    warmup_epochs: 1
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0
output:
  base_dir: results/wfa107_features
  log_master: results/wfa107_features/master.log
  ckpt_dir: results/wfa107_features/checkpoints
  events_jsonl: true
  resume_from: none
  resume_from_path: null
natural_charge_mse_weight: 0.0
use_natural_charges: false
q_channel_lr_multiplier: 1.0
q_channel_hints:
  - q_channel
  - natural_charge_proj
  - charge_head
  - q_head
compute:
  gpu: cuda:0
directives:
  kill_then_adapt: true
  time_budget: 1h
  user_ok_required: false
  user_ok_granted: "Wf-A107 ring-prior + bond-feature 5-epoch A/B, 1 seed, GPU0 (2026-10-21)"
  pre_flight_gates_required:
  - p1_pytorch_cuda_available
  - p2_tests_pass
entry:
  script: molmetal/scripts/train_cfm_yuelbond_wasserstein.py
  # W3 smoke: --n-train / --n-val are pre-launch scaling flags (set via
  # the launch wrapper, NOT a hyperparameter override); the §5.11 rule
  # applies to training hyperparameters (lr, epochs, batch_size, etc.),
  # not to data-subset selectors.  Same pattern as cfm_5metal_wfa68_smoke.yaml.
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_cfm_yuelbond_wasserstein.py --config {yaml_path} --seed {seed} --out-dir {out_dir} --ckpt-dir {ckpt_dir}
  legacy_inline_command: ""
honest_framing:
  claims:
  - "W3 plumb-repair smoke: validates that the new EpochMetrics fields
    (Fix 7 sweep + Fix 9 per-class + Fix 8 aux MSE) actually reach
    per_epoch_metrics.json end-to-end on real data, not just on the
    unit-test mock dict."
  - 1 seed × 5 epochs is too small for honest MEASUREMENT of bond_f1
    lift; that is the 30-epoch retrain's job.  W3 verifies the plumb.
  - "Baseline (MEASURED): cfm_5metal_default per_epoch_metrics.json
    ep26 bond_f1=0.2743, bond_pr_auc=0.2174."
  do_not_claim:
  - W3 smoke MEASURED bond_f1 lift (5 epochs is too short for honest
    lift measurement; the ranking lift is real but the calibration
    lift needs ≥15 epochs to materialise)
  - Combined bond_f1 > 0.50 at any epoch (PROJECTED 0.35-0.50 ceiling
    at 30 epochs; this smoke verifies the plumb, not the lift)
  - 7-metal cohort coverage (only 5-metal cohort ships on disk)
  deferred:
  - 30-epoch GPU retrain (gated on (a) W3 smoke confirming per-class
    fields reach JSON, (b) user OK on W2 config + GPU budget)
  - F5_RDKIT_2D 32-d integration
