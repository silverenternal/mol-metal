# configs/msrs_dmpnn_doi.yaml — UP-28, D-MPNN on the DOI-grouped split.
#
# Both arms run from this one file: ``fp_tree`` reproduces the 0.3767
# maccs_rdkit reference and ``dmpnn`` is the representation under test.
#
# Invoke with: .venv/bin/python molmetal/scripts/msrs_dmpnn_doi.py \
#                  --config configs/msrs_dmpnn_doi.yaml
#
# GPU policy: cuda:0 only (user directive 2026-10-16). Do NOT add
# compute.device alongside compute.gpu — start.sh double-indexes.

entry:
  script: molmetal/scripts/msrs_dmpnn_doi.py
  command_template: "/home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/msrs_dmpnn_doi.py --config {yaml_path}"

data:
  long: data/msrs/measurements.parquet
  metal_desc: molmetal/data/metal_chemistry_5.csv
  limit: 0

model:
  hidden: 300
  depth: 3
  dropout: 0.1
  atom_version: v2

train:
  lr: 0.001
  epochs: 40
  batch_size: 64
  weight_decay: 0.0
  # 0..4 = the random_state values behind the 0.3767 reference.
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4

compute:
  device: cuda:0
  deterministic: true

arms:
  - fp_tree
  - dmpnn

output:
  out: metrics/by_metric/msrs_dmpnn_doi.json
