# configs/wfa110_typed_edges_smoke_2026_10_25.yaml — MOD1 smoke, CPU.
#
# WHAT THIS IS
# ------------
# The evidence arm for cfm_todo.json MOD1 (typed edges) and task T5.  It is
# the Wf-A108j fix arm with exactly one thing added: the bond order the head
# already predicts is fed back into the EGNN as a per-edge class.
#
# WHAT IT MEASURES
# ----------------
#   1. that the path is LIVE — the typed projection's gradient is non-zero
#      and its weight moves off zero, so the ablation is not measuring an
#      initialisation;
#   2. the M2-style ablation — ||v(order) - v(no order)|| / ||v(no order)||
#      on identical inputs, from the trained checkpoint;
#   3. single_fragment_rate and three_ring_share on a 32-sample pool, which
#      are the two quantities MOD1's done_when names.
#
# WHAT IT IS NOT
# --------------
# Not a quality claim.  64 clouds and 2 epochs measure whether the path is
# wired and whether it moved, not whether typed edges help.  The help/no-help
# question needs the T3-scale arm.

data:
  dataset: csv
  csv: .data/molmetal/metalcytotox_5metal_multitask_v3.csv

model:
  hidden_dim: 128
  n_layers: 3
  atom_vocab_size: 13
  bond_head: learned
  joint_train: true
  cfm_decoder: yuelbond
  use_egnn_velocity: true
  egnn_max_atomic_number: 100
  egnn_context_dropout: 0.1
  use_tmqm_init: false
  pcgrad_multi_task: false
  q_head_enabled: false

flow:
  use_fm_objective: true
  fm_weight: 1.0
  fm_noise_sigma: 2.485
  fm_t_per_cloud: 1
  fm_t_dist: log_normal
  fm_log_normal_mu: 0.0
  fm_log_normal_sigma: 3.0
  prediction_target: velocity
  velocity_head: vector_channels
  vector_channels: 8
  vector_channel_norm_gain: fixed
  velocity_head_init: lsq
  velocity_head_init_knots: 9
  metal_conditioning: embedding
  t_embedding_dim: 32

  # ---- the one variable this arm adds (MOD1) ----------------------------
  # The EGNN otherwise reads [h_i || h_j || dist || dist^2] and nothing
  # about what a pair IS.  The bond head reaches macro-F1(type) 0.618 on the
  # c8 full corpus while the same run logs bond_features=OFF, so the order
  # never reaches the coordinates.
  typed_edge_features: true
  typed_edge_classes: 5
  # Half the clouds per step carry no order.  The sampler has no order to
  # supply, so the unconditional branch has to be trained or the field is
  # tested off-distribution; the mask multiplies the projection, so a
  # withheld cloud is the untyped field exactly.
  typed_edge_dropout: 0.5

  # 0.0 on both of these to keep the arm single-variable.  Their measured
  # reasons are in configs/wfa108l_geom_smoke_2026_10_25.yaml; briefly,
  # FmOdeTerm costs 16 extra forwards per step and is the open D11 memory
  # question, and EnergyConservation was 73% of the objective at weight 0.05.
  fm_ode_term_weight: 0.0
  energy_conservation_weight: 0.0
  geometry_consistency_weight: 0.0
  sboo3_term_weight: 0.05
  sboo3_n_rot: 1
  bond_class_weights: true
  bond_class_weight_power: 0.5
  bond_decision: threshold
  bond_decision_threshold: 0.5
  bond_decision_threshold_sweep: [0.5]
  dative_distance_cutoff: 2.6
  metal_placement: legacy
  use_metal_pair_features: true
  bond_aux_mse_weight: 0.1
  bond_aux_temperature: 0.5
  bond_candidate_source: truth_only
  bond_candidate_cutoff: 2.4
  subsample_neg_ratio: 0
  subsample_neg_seed: epoch
  bond_z_table: pt
  bond_z_metal_set: all7
  n_steps: 4
  method: euler
  optimizer: adam
  warmup_steps: 0
  ema_decay: 0.999
  wasserstein_weight: 0.0
  closure_bounded: true
  use_yuelbond: true
  edge_cutoff: 3.5
  bond_length_guidance_weight: 0.0
  ring_template_weight: 0.0

protocol:
  n_train: 64
  n_val: 32
  batch_size: 8
  lr: 0.001
  gen_validity_samples: 0
  gen_eval_n: 32
  gen_eval_seeds: "0"
  n_seeds: 1
  epochs: 2
  n_seeds_min: 1
  scheduler:
    type: none
    warmup_epochs: 0
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0
  early_stop_patience: 999

output:
  base_dir: results/wfa110_typed_edges_smoke
  log_master: results/wfa110_typed_edges_smoke/master.log
  ckpt_dir: results/wfa110_typed_edges_smoke/checkpoints
  events_jsonl: true
  resume_from: none
  resume_from_path: null

natural_charge_mse_weight: 0.0
use_natural_charges: false
q_channel_lr_multiplier: 1.0
q_channel_hints:
  - q_channel
  - natural_charge_proj
  - charge_head
  - q_head

compute:
  gpu: cpu
  device: cpu

directives:
  kill_then_adapt: true
  time_budget: 30m
  user_ok_required: false
  user_ok_granted: "Wf-A110 typed-edge smoke (2026-10-25), CPU, 64 clouds x 2 epochs"
  pre_flight_gates_required:
  - p1_pytorch_cuda_available

entry:
  script: molmetal/scripts/train_cfm_yuelbond_wasserstein.py
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_cfm_yuelbond_wasserstein.py --config {yaml_path} --seed {seed} --out-dir {out_dir} --ckpt-dir {ckpt_dir}
  legacy_inline_command: ""

honest_framing:
  claims:
  - "The typed-edge path reaches the velocity field and its projection is
    trained: the M2-style ablation is measured on the resulting checkpoint."
  do_not_claim:
  - "That typed edges improve generation. 64 clouds and 2 epochs cannot show
    that; the comparison needs the T3-scale arm."
  deferred:
  - "single_fragment_rate and three_ring_share against the untyped arm at the
    same budget."
