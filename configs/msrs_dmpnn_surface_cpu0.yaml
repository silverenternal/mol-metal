# configs/msrs_dmpnn_surface_cpu0.yaml — FIX-M1 CPU smoke.
#
# Consumed by: molmetal/scripts/msrs_dmpnn_surface.py
# Invoke with: .venv/bin/python molmetal/scripts/msrs_dmpnn_surface.py \
#                  --config configs/msrs_dmpnn_surface_cpu0.yaml --dry-run
#
# WHY THIS FILE (§5.11, user directive 2026-10-09): every hyperparameter lives
# here. The CLI only selects *which run* (--config / --out / --limit / --dry-run),
# never *what to train*.
#
# This is the CPU smoke: `data.limit: 400` keeps the whole chain (graphs, folds,
# LightGBM baseline, D-MPNN) on CPU in minutes so the wiring is verified before
# any GPU0 budget is spent. The formal run is
# `configs/msrs_dmpnn_surface_gpu0.yaml`, identical except data.limit / compute.

entry:
  script: molmetal/scripts/msrs_dmpnn_surface.py
  command_template: "/home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/msrs_dmpnn_surface.py --config {yaml_path}"

data:
  long: data/msrs/measurements.parquet
  endpoint: potency
  top_cell_lines: 40
  # 0 = full cohort (21,404 rows). >0 = first N ligand_main_fragment groups.
  limit: 400

model:
  hidden: 128
  depth: 3
  dropout: 0.1

train:
  # 3 epochs: this config verifies *wiring* (graphs → folds → 3 arms → dual-split
  # artifact), not accuracy. A 40-epoch CPU run of the full 3-arm × 2-split grid
  # is ~3 hr; that is what the gpu0 config is for.
  epochs: 3
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  patience: 8
  # Ligand-grouped inner split for early stopping; never touches the outer test fold.
  inner_val_fraction: 0.1
  seed: 20261018

compute:
  device: cpu
  num_threads: 1
  deterministic: true

eval:
  # Both splits are mandatory (FIX-E1): the same arm moves ~0.06 R2 between them.
  splits:
    - fragment_grouped
    - canonical_grouped
  # LightGBM reference recomputed inside the same folds, same rows.
  baseline_arm: complex

# Arm = (what the conditioning vector carries, whether the graph has a metal node,
# where the conditioning enters). The three arms decompose the L2 finding:
#   ligand_cell   -> metal-blind control (cell line only, readout injection)
#   metal_identity-> + metal identity one-hot + coordination node/edges (message)
#   metal_state   -> + oxidation state / charge / d-electrons / geometry
arms:
  ligand_cell:
    metal_mode: blind
    use_metal_node: false
    metal_injection: readout
  metal_identity:
    metal_mode: identity
    use_metal_node: true
    metal_injection: message
  metal_state:
    metal_mode: state
    use_metal_node: true
    metal_injection: message

output:
  path: metrics/by_metric/msrs_dmpnn_surface.json
