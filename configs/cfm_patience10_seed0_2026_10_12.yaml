# Track E (Wf-60231cff-03e-15, m14-admet-paper-align) — proof-of-concept YAML binding.
#
# This config exercises the §5.11 round-trip for the 5 NEW keys added
# by Track E.  Defaults to current behaviour: every key resolves to a
# dest of its own `entry.script` parser, every opt-in switch defaults
# to current behaviour, and the corresponding produce/consume path is
# bit-exact on every existing CFM config (cfm_patience10_seed0 etc.).
#
entry:
  script: molmetal/scripts/bench_cfm_decode_real.py
  # 2026-11-04 (Wf-A269) — `--config {yaml_path}` REMOVED.
  #
  # SUPERSEDED RENDERING PRESERVED VERBATIM per AGENTS.md section 5.5
  # rule #6: the template used to read, in full —
  #
  #   command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/bench_cfm_decode_real.py --config {yaml_path} --out-dir {out_dir}
  #
  # MEASURED 2026-11-04 by scripts/_runtime_transport_gate.py: the
  # benchmark script's parser declares --out-dir but NOT --config
  # (molmetal/scripts/bench_cfm_decode_real.py::parse_args declares
  # --ckpt-path / --data-path / --data-config / --nci60-path /
  # --drugood-path / --out-dir / --out-json / --n-samples / --n-rows /
  # --seeds / --device / --pocket-id / --jitter / --smoke), so the launch
  # aborted with argparse's "unrecognized arguments: --config" before the
  # benchmark ran a single sample.
  #
  # The script imports no YAML loader and reads no `cfg[...]`, so the
  # `dest:` pointers in the annotation blocks below have never reached
  # it either — the config is DECLARATION-ONLY.  Recorded as an
  # honest-negative in docs/HONEST_NEGATIVE_CATALOG.md §6.269.23.
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/bench_cfm_decode_real.py --out-dir {out_dir}
  legacy_inline_command: ""

# ---- m14 per-atom decode ratio gate (Track E EV1) ----------------------
strict_large_frag:
  type: bool
  default: false
  dest: bench_cfm_decode_real.py::strict_large_frag
  desc: >
    Per-atom largest-fragment gate; OFF = RDKit-strict m14 backward-compat.
    When ON, evaluate_decode_ratio_per_atom applies GetMolFrags >= 0.80
    largest-frag + min_atoms >= 2 sanity floor to the canonical m14
    decode_ratio metric.  Emitted side-by-side with the legacy
    RDKit-strict number in cfm_decode_real.json + a NEW
    cfm_decode_real_per_atom.json.

largest_frag_min_frac:
  type: float
  default: 0.80
  dest: bench_cfm_decode_real.py::largest_frag_min_frac
  desc: >
    Per-atom largest-frag threshold (largest_fragment_atoms / total_atoms).
    0.80 = this repo's OWN project-strict choice, not a published standard.
    MOSES (arXiv:1811.12823) has NO fragment term; GuacaMol's is_valid
    (Brown et al., J. Chem. Inf. Model. 2019, 59(3), 1096-1108) requires
    only >= 1 fragment.  See molmetal/eval/scoring/decode_gate.py.
    0.0  = no per-atom fragment gate (legacy RDKit-strict only).

min_atoms_per_mol:
  type: int
  default: 2
  dest: bench_cfm_decode_real.py::min_atoms_per_mol
  desc: >
    Reject molecules with < N heavy atoms.
    2 = this repo's OWN floor (rejects [He], [Pt], etc.); MOSES
    (arXiv:1811.12823) has no such floor.
    0 = no min-atoms gate (legacy RDKit-strict only).

# ---- 8 ADMET proxy emission (Track E EV2) -----------------------------
emit_admet8:
  type: bool
  default: false
  dest: cfm_property_panel.py::emit_admet8
  desc: >
    Standalone per-mol SA+QED+logP+TPSA+HBD+HBA+RotB+AromRings JSON
    emission.  When ON, the panel writes
    metrics/by_metric/cfm_admet8_{cohort}.json with
    {n, sa_mean, qed_mean, logP_mean, tpsa_mean, hbd_mean, hba_mean,
    rotB_mean, aromatic_rings_mean, plus medians + IQRs}.

# ---- m4/m5/m7 paper alignment (Track E EV7) ---------------------------
paper_table_cohort:
  type: str
  default: "platinai_pt_subset_5k"
  dest: bench_cfm_paper_table.py::cohort_id
  desc: >
    Cohort key feeding paper §X table (Vina+MCF7+IntDiv1 triple).
    Must be one of bench_cfm_paper_table.COHORT_KEYS:
      [platinai_pt_subset_5k, nci60_9_cell, drugood, lambda_pilot_5x1,
       lambda_path_a_10x3]
    A custom descriptor string is allowed (a NEW benchmark cohort id
    may extend the canonical list).

# ---- Honest-negative preservation (no OVERRIDE; sanity block) --------
honest_framing:
  m14:
    pre_fix: "0.9939 (RDKit-only, disconnected fragments silently accepted)"
    post_fix_with_defaults: "bit-exact same (strict_large_frag=False)"
    post_fix_with_on: "drops to per-atom honest number; both emitted side-by-side"
  m5_mcf7:
    status: "PENDING_GPU_RETRAIN — widzuipcl Phase 2+ not started"
    note: "GPU retrain required to wire r_platinai into RewardAggregator; NOT executed"
  m7_intdiv1:
    status: "PRESERVED VERBATIM — ~0.017 BELOW training distribution (n=37-47)"
    note: "0.88 Vendi Score threshold does not apply at this n"

# ---- AGENTS.md §5.1 standing GPU grant hyperparam contract (Wf-A30 §6.53) ----
# This is a §5.11 binding example for ``bench_cfm_decode_real.py`` etc.; it does
# not invoke the CFM trainer, but every active configs/*.yaml MUST carry the 4
# canonical hyperparams so a reviewer can read the GPU-budget footprint at a
# glance per AGENTS.md §5.1 ("hyperparameters via config files").  The values
# here are the default peer-paper-aligned defaults (not binding to any trainer
# argparse dest in this YAML's entry.script = bench_cfm_decode_real.py).
train:
  batch_size: 64         # 64 = chemprop/v2 peer-paper default
  lr: 0.0003              # 3e-4 = Adam default for CFM/EGNN family
  weight_decay: 0.0
  max_norm: 5.0
model:
  hidden_dim: 128        # 128 = PocketGen paper-aligned default (Zhang 2024)
  n_layers: 3             # 3 = Lipman CFM/EGNN family default
  depth: 3                # §5.1 alias for n_layers
