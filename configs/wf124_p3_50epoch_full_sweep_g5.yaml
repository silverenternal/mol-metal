# Wf-A8 yaml-unify pattern applied 2026-10-03 per task brief
# Per AGENTS.md §5.5 filesystem-truth + §5.6 atomic-write + §5.7 trainer-flag-smoke
# Cross-links: TODO/completed/A8_m17_yaml_rewrite.md §0 + TODO/decisions/0002-tier2-scope.md
# Cross-links: TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md + COMPARISON_BASELINES.md
# Original yaml preserved in .bak.wfa8other (yaml.safe_dump loses comments by design)
dry_run: true
user_ok_required: true
data:
  dataset: metalcytotox_5metal  # Wf-A8c FIX
  split:
    type: scaffold_split  # Krasnov 2026 baseline
  csv: .data/molmetal/metalcytotox_5metal_multitask_v4.csv
  n_rows_expected: 26632
  expected_columns_subset:
  - smiles
  - metal
  - pic50
  - source
  cohort_filter:
  dataset: metalcytotox_5metal  # Wf-A8c FIX
  split:
    type: scaffold_split  # Krasnov 2026 baseline
    metals:
    - Ru
    - Ir
    - Os
    - Rh
    - Re
    scaffold_split: true
model:
  backbone: chemprop_v2_v3
  ablation_config: mtl_baseline
  hidden_dim: 300
  depth: 3
  task: multi_task
  wasserstein_weight: 0.05
  alpha: 0.5
  n_mc: 256
  w2_gradient_mode: sliced
  use_l2_guard: true
protocol:
  n_seeds: 3
  seeds:
  - 0
  - 1
  - 2
  epochs: 50
  batch_size: 64
  lr: 0.001
  grad_clip_norm: 5.0
  bf16: true
  enumerated_runs:
  - metal: Ru
    seed: 0
  - metal: Ru
    seed: 1
  - metal: Ru
    seed: 2
  - metal: Ir
    seed: 0
  - metal: Ir
    seed: 1
  - metal: Ir
    seed: 2
  - metal: Os
    seed: 0
  - metal: Os
    seed: 1
  - metal: Os
    seed: 2
  - metal: Rh
    seed: 0
  - metal: Rh
    seed: 1
  - metal: Rh
    seed: 2
  - metal: Re
    seed: 0
  - metal: Re
    seed: 1
  - metal: Re
    seed: 2
  n_runs_total: 15
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0
sweep_pairs:
  ru:
  - 0
  - 1
  - 2
  ir:
  - 0
  - 1
  - 2
  os:
  - 0
  - 1
  - 2
  rh:
  - 0
  - 1
  - 2
  re:
  - 0
  - 1
  - 2
  total_pairs: 15
eval:
  per_pair_metrics:
  - test_auc
  - val_auc
  - wasserstein_final
  - best_epoch
  comparison_metrics:
  - delta_test_auc_30vs50
  - delta_w2_final_30vs50
  target_test_auc: 0.86
output:
  base_dir: results/wf124_p3_50epoch_full_sweep_g5
  per_metal_dir: results/wf124_p3_50epoch_full_sweep_g5/{metal}/per_seed_metrics_seed{seed}.json
  wasserstein_decay_dir: results/wf124_p3_50epoch_full_sweep_g5/{metal}/wasserstein_decay_seed{seed}.json
  training_summary: results/wf124_p3_50epoch_full_sweep_g5/training_summary.json
  comparison_30vs50: results/wf124_p3_50epoch_full_sweep_g5/30ep_vs_50ep_comparison.json
  log_master: results/wf124_p3_50epoch_full_sweep_g5/master.log
  ckpt_dir: molmetal/checkpoints
  events_jsonl: true
waves:
  total_waves: 8
  enforce_budget: false
  per_wave_budget_hr: 1.0
  wave_a:
    description: Ru s0 (1 pair)
    pairs:
    - metal: Ru
      seed: 0
    n_pairs: 1
    wall_time_estimate: 0.5
  wave_b:
    description: Ru s1 (1 pair)
    pairs:
    - metal: Ru
      seed: 1
    n_pairs: 1
    wall_time_estimate: 0.5
  wave_c:
    description: Ru s2 (1 pair)
    pairs:
    - metal: Ru
      seed: 2
    n_pairs: 1
    wall_time_estimate: 0.5
  wave_d:
    description: Ir s0/s1 (2 pairs)
    pairs:
    - metal: Ir
      seed: 0
    - metal: Ir
      seed: 1
    n_pairs: 2
    wall_time_estimate: 1.0
  wave_e:
    description: Ir s2 + Os s0 (2 pairs)
    pairs:
    - metal: Ir
      seed: 2
    - metal: Os
      seed: 0
    n_pairs: 2
    wall_time_estimate: 1.0
  wave_f:
    description: Os s1/s2 + Rh s0 (3 pairs)
    pairs:
    - metal: Os
      seed: 1
    - metal: Os
      seed: 2
    - metal: Rh
      seed: 0
    n_pairs: 3
    wall_time_estimate: 1.0
  wave_g:
    description: Rh s1/s2 + Re s0 (3 pairs)
    pairs:
    - metal: Rh
      seed: 1
    - metal: Rh
      seed: 2
    - metal: Re
      seed: 0
    n_pairs: 3
    wall_time_estimate: 1.0
  wave_h:
    description: Re s1/s2 (2 pairs)
    pairs:
    - metal: Re
      seed: 1
    - metal: Re
      seed: 2
    n_pairs: 2
    wall_time_estimate: 1.0
  total_wall_time_estimate: 6.5
compute:
  gpu: cuda:1
  cpu_workers: 4
  bf16: true
directives:
  kill_then_adapt: true
  time_budget: 10h
  user_ok_required: true
  user_ok_granted: pending — DRY-RUN only
  per_wave_user_ok_required: true
  pre_flight_gates_required:
  - p1_pytorch_cuda_available
  - p2_tests_pass
  - p3_wf343c4_anchor_freshness_24h
  - p3_wf343c2_per_wave_runtime_check
entry:
  script: molmetal/scripts/train_dmpnn_multitask_wasserstein.py
  command_template: python molmetal/scripts/train_dmpnn_multitask_wasserstein.py --config {yaml_path}
    \ \\\\\n  --metals {metal} \\\\\n  --seeds {seed} \\\\\n  --epochs 50 \\\\\n  --batch-size 64 \\\\\n  --lr 1e-3 \\\\\n\
    \  --alpha 0.5 \\\\\n  --wasserstein-weight 0.05 \\\\\n  --use-l2-guard \\\\\n  --device cuda:1 \\\\\n  --out-dir {out_dir}\
    \ \\\\\n  --ckpt-dir {ckpt_dir} \\\\\n  --no-enforce-budget\n"
  warm_start_checkpoint: n/a
honest_framing:
  data_grounding:
    scaffold_split_source: Wf-261 strict Bemis-Murcko 70/10/20 split (0 leak)
    scaffold_split_audit: molmetal/reports/wf261_audit/split_audit.md
    cfm_todo_audit: molmetal/reports/wf258_audit/cfm_todo_gap_audit.md
    csv_v4: v4 retains v2's 26632 rows; adds scaffold_id + split columns (Wf-261 regeneration output)
  time_budget_directive:
    user_statement: 时间预算没关系的
    no_enforce_budget_override: true
    wall_time_target: ~6.5 hr on RTX 5090 GPU-1 (8 waves x <=1 hr)
  claims:
  - 5 x 3 x 50 = 15 runs on RTX 5090 GPU-1, ~6.5 hr wall-time (8 waves)
  - 50-ep convergence check vs 30-ep Wf-124 P3 baseline
  - 30ep_vs_50ep_comparison.json per-metal lift delta
  - Wf-261 strict scaffold split ensures 0 leakage across 15 (metal, seed) pairs
  - Wf-258 audit identifies undertraining; 50-ep sweep is the proper scientific measurement
  do_not_claim:
  - 50-ep lift magnitude as MEASURED until sweep completes
  - Per-seed best-epoch as MEASURED convergence (use mean+/-std unfiltered)
  - Krasnov 2026 0.86 target until 5x3 sweep aggregates honestly
  deferred:
  - Per-innovation ablation (TODO-182 G6) for lever attribution
  - Hyperparameter tuning (Wf-120 P3 follow-up) if per-metal std too high
cross_references:
- molmetal/reports/wf258_audit/cfm_todo_gap_audit.md
- TODO/pending/181_wf124_p3_50_epoch_full_sweep.md
- molmetal/reports/wf124_p3_multitask/ru/per_seed_metrics_seed0.json
- molmetal/scripts/train_dmpnn_multitask_wasserstein.py
- TODO/pending/180_wf124_p3_remaining_metals_seeds.md
- TODO/pending/182_wf124_p3_per_innovation_ablation.md
