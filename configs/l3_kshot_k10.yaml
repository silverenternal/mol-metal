# L3 shot-curve (K=10) — how many labelled ligands from the held-out metal
# recover the zero-shot cross-metal collapse?  Same cohort / split / backbone as
# the PA15 none arm; only the support-set size changes.  This is a K-SWEEP arm:
# the paired baseline (zero-shot on the identical query rows) is computed in-run.
#
# AGENTS.md §5.11: launched from this YAML; the wrapper passes --config only.
entry:
  script: molmetal/scripts/train_chemprop_lomo_paper_cohort.py
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python -u molmetal/scripts/train_chemprop_lomo_paper_cohort.py
    --config {yaml_path}

data:
  cohort_filter: "CytotoxFilter(24h, ic50>=0.01uM) then collapse_duplicates"
  time_threshold: 24.0
  ic50_min: 0.01
  metals: [Ru, Ir, Rh, Os, Re]

model:
  hidden: 300
  depth: 3
  ffn_hidden: 300
  ffn_layers: 1
  dropout: 0.0
  metal_mode: none
  metal_embed_dim: 16

train:
  epochs: 50
  batch_size: 64
  lr: 0.001
  bf16: true

k_shot: 10
k_shot_ft_epochs: 20
k_shot_ft_lr: 0.001

protocol:
  wave_decomposition: "LOMO 5 folds x 10 seeds; K=10 stratified support from the held-out metal"
  seeds: [42, 43, 44, 49, 123, 7, 8, 9, 10, 11]

mode: cross
n_permutations: 0
perm_seed: 42

compute:
  gpu: cuda:0

output:
  base_dir: molmetal/reports/l3_kshot_k10
  out_json: molmetal/reports/l3_kshot_k10/metrics.json
  log_master: molmetal/reports/l3_kshot_k10/master.log

metric_name: l3_kshot_k10

directives:
  user_ok_required: true

honest_framing: >
  MEASURED only.  zero_shot_query and kshot_query are scored on identical query
  rows (paired).  Support labels come from the held-out metal, so this is an
  ADAPTATION result, not a zero-shot one.
