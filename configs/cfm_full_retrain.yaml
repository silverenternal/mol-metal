# Wf-A8 yaml-unify pattern applied 2026-10-03 per task brief
# Per AGENTS.md §5.5 filesystem-truth + §5.6 atomic-write + §5.7 trainer-flag-smoke
# Cross-links: TODO/completed/A8_m17_yaml_rewrite.md §0 + TODO/decisions/0002-tier2-scope.md
# Cross-links: TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md + COMPARISON_BASELINES.md
# Original yaml preserved in .bak.wfa8other (yaml.safe_dump loses comments by design)
data:
  # 2026-10-04 — REPOINTED: MetalCytoToxDB -> tmQM.
  #
  # This config used to declare `dataset: metalcytotox_5metal` plus a full
  # MetalCytoToxDB cohort schema, and its honest_framing claimed
  # "MetalCytoToxDB 5-metal v2 corpus (26632 rows, Wf-261 strict Bemis-Murcko
  # 70/10/20, 0 leak)".  None of that ever reached the trainer:
  #
  #   * `data.dataset` resolved to no argparse dest, so the loader dropped it.
  #   * the corpus schema (n_rows_expected / cohort_filter / split) likewise.
  #   * the trainer found neither --tmqm-dir nor --data-csv and took the else
  #     branch: build_synthetic_pt_click_clouds -- ONE jittered square-planar
  #     Pt layout, the same 5 atoms every time.
  #
  # So the run advertised 26,632 property rows and trained on a single
  # geometry.  The corpus is also the wrong KIND of data for this entry: its
  # structure column is `SMILES_Ligands`, the metal is a separate column, and
  # MEASURED on 800-row samples of v1 and v2 ZERO rows contain any metal atom.
  # A CFM whose claim is metal-GEOMETRY-conditioned decoding has no metal
  # centre to condition on; pointed at it, decode_ratio collapsed 1.000->0.000.
  #
  # tmQM replaces it: 108,541 CSD-derived mononuclear d-block complexes with
  # the metal IN the geometry, MIT-licensed, already on disk.  MEASURED with a
  # disjoint CSD-code-hash split, 20 epochs, 120 train / 48 held-out val:
  # decode_ratio 1.000 for each of Pt / Ru / Ir / Os / Re / Rh.
  #
  # The property corpus still belongs to the D-MPNN entry, which consumes it
  # correctly -- see the `data.dataset: metalcytotox_5metal` configs under
  # configs/training/.
  dataset: tmqm
  tmqm_dir: .data/molmetal/tmQM
  # All six target metals.  Order is irrelevant; it is a filter, and the
  # loader raises on an unknown symbol rather than dropping it.
  tmqm_metals: Pt,Ru,Ir,Rh,Os,Re
  # -1 = no coordination-number filter (4 = square-planar, 6 = octahedral).
  tmqm_coord_number: -1
  # Val fraction of the DISJOINT split (assigned by CSD-code hash).  Drawing
  # train and val separately with different seeds LEAKS: MEASURED, the val
  # candidate pool was a strict subset of the train one, 160/160.
  tmqm_val_frac: 0.2
  # Wf-A14 (2026-10-13) Bemis-Murcko scaffold 80/10/10 split. Default random preserves Wf-A8c hash split bit-exactly.
  tmqm_split_kind: random
  # Wf-A11 (2026-10-13) — 5 new keys re-enabling loader-output fields that
  # were silently dropped by the 4 getattr defaults before this round (A1
  # root cause = float BO strip at tmqm_clouds.py:248-249; D1 = missing
  # tmQM_X.q reader; A5 = per-atom coord-neighbour list collapse).
  use_natural_charges: true
  use_dft_properties: true
  use_continuous_bo: true
  use_coord_neighbors: true
  use_stoichiometry: true
model:
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'backbone' removed (no --backbone dest).
  hidden_dim: 128
  n_layers: 3
  # 2026-10-04: was 14, which matched NOTHING.  The YuelBond path derives
  # its width from _YUELBOND_Z_TABLE (13 entries) and the Lipman adapter
  # uses 12; the declared value reached no code path, so it was never
  # checked.  It is now a GUARD: --atom-vocab-size fails loudly on mismatch.
  atom_vocab_size: 13
  bond_head: learned
  joint_train: true
  cfm_decoder: yuelbond
  learnable_vel_scale: true
  # 2026-10-04 — production EGNN velocity field (see configs/cfm_tmqm_all6.yaml
  # for the full rationale).  Without this the trainer builds CFMJointModel,
  # whose velocity path is a 2-layer MLP placeholder, and every `flow:` term
  # below regularises that placeholder instead of a real SE(3) field.
  # 2026-09-09 ALIGNMENT — this key was ABSENT, so the argparse default (False)
  # applied. With it off, fm_term is an exact zero
  # (train_cfm_yuelbond_wasserstein.py:2710 initialises it; :2715 gates the whole
  # block on `if fm_objective and batch_clouds:`), so the EGNN velocity field's
  # ONLY gradient source is the Wasserstein geometry anchor at :2355 — an anchor
  # pulling predicted velocity toward a reference square-planar Pt geometry, NOT
  # the flow-matching regression onto dx = x1 - x0. MEASURED gradient census on
  # the sibling configs/cfm_blk_c5_repair_2026_10_09.yaml (same model shape,
  # CPU 1-epoch): head.msg_mlps 2.24e+03 | other 1.14e+03 | vel_field 1.27e+01.
  # Aligned with cfm.yaml + cfm_tmqm_all6.yaml, which both set this true.
  use_fm_objective: true
  use_egnn_velocity: true
  egnn_max_atomic_number: 100
  egnn_context_dropout: 0.1
  # 2026-10-04 — warm-start the EGNN encoder from the F2 tmQM pretrain
  # output (138,112 params, 5 regression targets incl. metal_bo_total and
  # coord_number).  The interface has existed since TODO-08 and the checkpoint
  # has been on disk all along, but no config-driven path ever set it, so the
  # velocity field trained from random init in every shipped run.
  use_tmqm_init: true
  pcgrad_multi_task: false
  # ----------------------------------------------------------------------
  # Wf-A11 (2026-10-13) bond-head surface — APPENDED, never rearranged.
  # ----------------------------------------------------------------------
  # Reaches BondOrderHead (molmetal/models/bond_head.py:650) when the
  # Lipman adapter / BondAwareDecoder consume it; CFMJointModel's
  # YuelBondDecoderHead is unaffected.  Defaults match the Round-10
  # BondOrderHead.__init__ kwargs so omitting this block keeps the
  # legacy shape exactly.  See TODO/completed/wfa11_bond_head_redo.md.
  bond_head_hidden_dim: 128
  bond_head_n_layers: 4
  bond_head_dropout: 0.15
  bond_head_continuous_bo: false
  bond_head_training_mode: "joint"
  head_use_cloud_ctx: false
  # Wf-A11 (2026-10-13) — BondOrderHead in_dim 9 → 11 (D5: 1 of the 9
  # shipped features was hardcoded 0.0; the slot now carries the real
  # distance_to_metal + bond_orders_continuous supervision target).
  bond_head_in_dim: 11
flow:
  # 2026-10-04 — bond head objective + decision rule.  See
  # configs/cfm_tmqm_all6.yaml for the full reasoning and the MEASURED
  # numbers behind each value.
  bond_class_weights: true
  bond_class_weight_power: 0.5
  bond_decision: threshold
  bond_decision_threshold: 0.5
  # 2026-10-04 — RESTORED, now that there is a sampler to configure.
  #
  # These keys were removed earlier the same day because the CFM trainer had
  # no generation path at all: no --n-steps, no --method, no generate(), so a
  # step count and an integrator configured nothing.  `decode_ratio` measures
  # the bond decoder on the REAL geometry, which is perception, not sampling.
  #
  # The trainer now integrates v(x,t) from x0 ~ N(0,I) with the cloned
  # reference solver (molmetal/adapters/flow_matching_lipman/_reference/solver)
  # and decodes the result — `gen_validity` in the metrics.  Integrator
  # accuracy verified against the exact solution of dx/dt = -x at 64 steps:
  # euler 2.9e-3, midpoint 1.5e-5, rk4 6.0e-8.
  n_steps: 100
  method: rk4
  # NOTE: `ot_solver: w_flow` is NOT restored.  The trainer's OT switch is
  # `--ot-coupling-mode {assignment,sample}` (plus --use-ot-cfm), which picks
  # between an exact permutation and a two-point Bass draw — not the
  # solver/loss pairing the old key name implied.  Naming it `ot_solver` here
  # would re-create exactly the kind of key that looks wired and is not.
  optimizer: adam
  # 2026-10-04 — `batch_size` / `lr` MOVED to `protocol:`.  They sat under
  # `flow:` here while every sibling CFM config declares them under
  # `protocol:`; the trainer resolved them anyway (the yaml loader's leaf
  # fallback spans flow/protocol/data/...), so the misplacement was invisible
  # to a run and visible only to pre-flight's
  # `p3_wf343c4_hyperparams_config_complete`, which accepts `train.*`,
  # `protocol.*` and `data.*` but not `flow.*`.  A batch size is a training
  # setting, not a flow-matching one.
  warmup_steps: 200
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'grad_clip_norm: 1.0' REMOVED — never reached the trainer (real dest --max-norm, declared 5.0 below). Intent flagged AMBIGUOUS.
  ema_decay: 0.999
  wasserstein_weight: 0.1
  closure_bounded: true
  use_yuelbond: true
  # 2026-10-04: was 6.0, which the run never used — the decoder's own
  # default of 3.5 was in force, so this key misreported the geometry the
  # run actually had.  3.5 is the value YuelBond actually filters at
  # ("cutoff=3.5 A excludes 4.1 A Cl-Cl"), and --edge-cutoff now carries
  # it into YuelBondDecoderHead.  Changing this number now changes the run.
  edge_cutoff: 3.5
  # Wf-A11 (2026-10-13) — auxiliary MSE on the float Wiberg BO the loader
  # now carries end-to-end. Weight 0.1 matches the design brief; 0.0
  # disables the term and falls back to legacy CE-only training (no
  # behavioural change for pre-Wf-A11 runs).
  bond_continuous_mse_weight: 0.1
  # Wf-A11 (2026-10-13) — when true, BondAwareDecoder + ConnectivityAwareDecoder
  # replace the hardcoded 0.0 angle_to_metal with a real angle deviation
  # computed from `metal_atom_index` (closes D5 + #12 honest-negative).
  angle_to_metal_enabled: true
  # ----------------------------------------------------------------------
  # Wf-A11 (2026-10-13) trainer-level intent — APPENDED, never rearranged.
  # ----------------------------------------------------------------------
  # Reach CFMJointModel.__init__ via the cfg loader's leaf fallback.
  # t_eval_grid drives `forward_with_t_grid(...)`; training (forward())
  # still anchors at t=1 so the W2 baseline is unchanged.
  # clash_penalty_weight gates whether `_compute_clash_penalty(...)` runs
  # inside forward() and stashes a scalar on `model.last_clash_penalty`.
  # bond_pattern_mask_in_train is an INTENT flag recorded on the model —
  # BondOrderHead applies the mask in its own forward path when True.
  t_eval_grid: [1.0]
  clash_penalty_weight: 0.01
  bond_pattern_mask_in_train: true
  # 2026-10-04 — REMOVED the eval:/orchestration keys and the
  # protocol.full_protocol block.  They described an evaluation panel
  # (decode-smoke cadence, 5-pocket sweep, per-pocket output dirs,
  # a launch_loop.sh) that this trainer does not implement: it takes a
  # single --pocket-id, emits one metrics JSON per run, and has no
  # smoke/panel/sweep driver.  Like the old flow: block they are
  # residue from metallo_drug_smoke_retrain.py.  The intent is now
  # recorded under honest_framing.deferred instead of sitting in the
  # config as keys that configure nothing.
protocol:
  # 2026-10-04 — moved here from `flow:` (see the note there).
  batch_size: 16
  lr: 0.0001
  # 2026-10-04 — how many val compositions to generate from noise
  # and decode for RDKit validity each epoch.  0 disables (decode-only).
  gen_validity_samples: 16
  # 2026-10-05 (Round-3 D3) — n=16 was MEASURED too noisy to gate on:
  # gen_validity read 0.375/0.312/0.562/0.688/0.750 over five
  # consecutive epochs of one run, a 44pp swing on a monotone
  # trajectory (binomial 1-sigma at p~0.5, n=16 is +-12.5pp).  Below
  # turns the eval into 3 seeds x 64 samples over 3 DISJOINT windows of
  # val compositions — 192 distinct chemistries, 1-sigma +-3.6pp.
  # EVAL-ONLY: no training or checkpoint behaviour changes.
  gen_eval_n: 64
  gen_eval_seeds: "0 1 2"
  n_seeds: 5
  epochs: 50
  n_seeds_min: 3
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0
output:
  base_dir: results/cfm_full_retrain_v2
  log_master: results/cfm_full_retrain_v2/master.log
  ckpt_dir: results/cfm_full_retrain_v2/checkpoints
  # 2026-10-04 — was `molmetal/checkpoints`, the repo-global directory.
  # MEASURED: that default let a 1-epoch/32-sample pytest run overwrite the
  # shipped `cfm_yuelbond_wasserstein.pt`, whose 50-epoch weights are not in
  # git and had no surviving copy.  With `--resume-from auto` also reading
  # this directory, a stale smoke checkpoint then poisons the next real
  # launch.  Pointed at this run's own directory so a run can only ever
  # resume from itself.  See the `--ckpt-dir` help in the trainer.
  events_jsonl: true
  # 2026-10-04 — `resume_from` replaces the `entry.warm_start_checkpoint`
  # key, which was DEAD: grep across *.py/*.sh finds zero readers, and
  # `entry:` is outside the config loader's whitelisted sections, so it
  # was dropped without even the usual skip warning.  start.sh reads
  # THIS key (scripts/start.sh:438) and passes it as --resume-from, which
  # the trainer now implements (it, too, had zero read sites before).
  # 'auto' = resume ckpt_dir/cfm_yuelbond_wasserstein_seed{seed}.pt when
  # present; 'none' = cold start; 'path' = --resume-from-path.
  resume_from: auto
  resume_from_path: null
compute:
  gpu: cuda:0
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'cpu_workers: 4' removed (CFM trainer has no --cpu-num-workers dest; only D-MPNN does).
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'bf16' removed (zero bf16/autocast in either trainer).
directives:
  kill_then_adapt: true
  # 2026-10-03 user directive: session budget is 48h ("我给48小时的预算").
  # The old 10h/13h values made the per-wave budget gate FAIL on a resource
  # dimension that is not actually constrained; with 48h the gate still does
  # real work (it FAILs a wave whose declared grid exceeds the declared
  # budget) but no longer blocks a legitimate launch.
  time_budget: 48h
  user_ok_required: true
  user_ok_granted: 10h budget + PRO 6000 + project root results/ + GPU util ≥90% check (2026-09-28)
  pre_flight_gates_required:
  - p1_pytorch_cuda_available
  - p2_tests_pass
  - p3_wf343c4_anchor_freshness_24h
  - p3_wf343c2_per_wave_runtime_check
entry:
  # 2026-10-04 (user decision): was molmetal/scripts/metallo_drug_smoke_retrain.py
  # — a 1000-step SMOKE script — on a config named `cfm_full_retrain`.  Every
  # train.*/flow.*/model.* key below was therefore unresolved against the entry
  # trainer and silently dropped.  Repointed at the real CFM trainer; those keys
  # are re-evaluated against it (see todo.json).
  script: molmetal/scripts/train_cfm_yuelbond_wasserstein.py
  # Wf-A8c FIX C: replace inline CLI flags with yaml-driven --config pattern
  # Per AGENTS.md §5.5 + §5.7 + user voice "never use CLI again always yaml"
  # All retrain hyperparameters live in yaml sections above (data + model + flow + train + protocol);
  # trainer applies via wfA2_config_loader.py
  # 2026-10-04: the repoint above changed `entry.script` but NOT this line, and
  # THIS is what start.sh actually executes (it renders command_template into
  # TRAINER_CMD).  So the launch kept running the 1000-step smoke script while
  # the file, the comment and the pre-flight classifier all said the real CFM
  # trainer -- the fix looked applied and was not.  Both must name the same
  # script; two other configs spell the entry ONLY here, which is why start.sh
  # scans the command for a .py path as well as reading entry.script.
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_cfm_yuelbond_wasserstein.py --config {yaml_path} --seed {seed} --out-dir {out_dir}
  # FIX C: yaml-driven config + only debug/seed/out-dir CLI flags remain (per task brief DEBUG_FLAG_OVERRIDES)
  # Original inline-CLI command preserved as legacy_inline_command for backward-compat rollback only
  # NOT used by start.sh per AGENTS.md §5.8 + §5.5 filesystem-truth
  legacy_inline_command: "CUDA_VISIBLE_DEVICES=0 /home/hugo/codes/mol-metal/.venv/bin/python \\n  molmetal/scripts/metallo_drug_smoke_retrain.py\\n  --csv .data/molmetal/metalcytotox_5metal_multitask_v2.csv \\n  --n-train 26632 \\n  --steps 5000 \\n  --batch-size 16 \\n  --lr 1e-4 \\n  --hidden-dim 128 \\n  --n-layers 3 \\n  --joint-train \\n  --bond-head learned \\n  --decode-smoke-every 500 \\n  --decode-smoke-samples 16 \\n  --seed {seed} \\n  --out-dir {out_dir}\n"
# ---------------------------------------------------------------------------
# EGNN refactor — S3, S4, S-A3..S-A10 (2026-10-13 Wf-T-implement)
#
# 8 NEW YAML keys documenting the EGNN module-side refactor landed in
# molmetal/adapters/egnn_rocm.py + egnn_extensions.py +
# molmetal/adapters/flow_matching_lipman/__init__.py.  Per AGENTS.md §5.11,
# these are added APPEND-only and are wired by a future wave that brings
# molmetal/scripts/train_cfm_yuelbond_wasserstein.py flags in line.  The
# module code-path changes (in_edge_dim expansion, dual coord scale,
# SinusoidalEmbedding per-layer t, PerLayerPocketInjector) are live now,
# guarded by their own defaults to keep the legacy bit-exact contract on
# existing callers — every key in this block currently inert in the CFM
# trainer's argparse.
# ---------------------------------------------------------------------------
egnn:
  # S4 wiring — auto-fill EDGE_TYPE_SINGLE when caller passes None.
  use_edge_types_default: true
  # S3 wiring — auto-derive dative mask from edge_types when caller passes None.
  use_dative_bond_edge_attr_default: true
  # S-A10 — dative coord scale init (overridable via YAML).
  coord_scale_dative_init: 0.85
  # S-A5 — covariant coord scale init (separate learnable per-edge scale).
  coord_scale_covalent_init: 1.0
  # S-A6 — degree normalization toggle (sum -> sum / max(deg, 1)).
  use_degree_normalization: true
  # S-A7 — message dropout (applied AFTER SiLU, before aggregation).
  message_dropout: 0.0
  # S6 / S-A9 — SinusoidalEmbedding dim per layer. 0 = legacy scalar.
  t_embedding_dim: 32
  # S7 / S-A8 — per-layer pocket injection toggle.
  pocket_per_layer: true

# ---------------------------------------------------------------------------
# Wf-A15 (2026-10-13) — chemistry-signal pipeline full-link fix
# APPEND-only, additive, opt-in.  Defaults preserve bit-for-bit backward
# compat with the pre-Wf-A15 12-term objective (per AGENTS.md §5.11
# YAML-only mandate + §5.7 backward-compat rule).  Per the
# ``chem_head_hints`` list, the head hints ARE a list, not a space-separated
# string (per AGENTS.md §5.11 list-valued flag mandate).
# ---------------------------------------------------------------------------
wfa15:
  # Layer E (egnn_rocm.py — EquivariantGraphConv): 5 chemistry channels
  # appended to mlp_in (BO cont / natural_charge / oxidation_state /
  # coord_neighbors / metal_proximity).  Defaults OFF → bit-exact legacy
  # mlp_in = [h_i, h_j, dist, dir_vec, edge_type_emb].
  operator:
    use_chemistry_channels: false
  # Layer F (trainer loss sum): 6 NEW chemistry-signal loss terms.
  # Each weight defaults to 0.0 → exact torch.zeros(()) in the sum so
  # the 12-term objective is preserved bit-exactly.  Set > 0 to enable.
  loss:
    chem_loss_weight: 0.0
    qed_loss_weight: 0.0
    molecule_loss_weight: 0.0
    stereo_loss_weight: 0.0
    fragment_loss_weight: 0.0
    property_loss_weight: 0.0
  # Layer G (build_differential_optimizer): opt-in switch from the
  # BLK-C5 3-group optimiser to the Wf-A11 4-group differential_lr.
  optimizer:
    use_differential_lr: false
    chem_head_lr_multiplier: 1.0
    # LIST per AGENTS.md §5.11 list-valued flag mandate (verified on
    # 2026-10-09 — a space-string silently delivers ONE literal string
    # to ``chem_head_hints`` instead of 4 substrings).
    chem_head_hints:
      - head
      - atom_head
      - bond_head
      - chemistry
  # Layer H (eval discriminators): 4 NEW discriminator calls.
  eval:
    compute_discriminators: false

honest_framing:
  # 2026-10-04 CORRECTION — the four `claims` below used to assert a
  # MetalCytoToxDB 5-metal v2 corpus (26632 rows, Wf-261 strict Bemis-Murcko
  # 70/10/20, 0 leak) that this config never read: `data.dataset` had no
  # argparse dest, and with no --tmqm-dir / --data-csv the trainer took the
  # synthetic Pt-click branch.  Meanwhile `do_not_claim[0]` forbade exactly
  # that ("Synthesized Pt click clouds (this is a decoder smoke, not full
  # retrain)") — the config's own do-not-claim list prohibited what it was
  # doing.  The data block is now repointed to tmQM and the claims below
  # describe what the run actually consumes.  Any number still belongs to a
  # report path on disk per AGENTS.md section 5.2; the decode_ratio figures
  # are from results/cfm_tmqm_all6/ (20 epochs, 120 train / 48 held-out).
  claims:
  - CFM retrain on tmQM CSD-derived metal-bearing 3D geometry (108,541 mononuclear d-block complexes, MIT;
    six target metals Pt/Ru/Ir/Rh/Os/Re), split disjointly by CSD-code hash
  - decode_ratio 1.000 per metal on held-out real geometry (MEASURED, 20 epochs, 120 train / 48 val)
  - 5 seeds × 50 epochs
  - GPU util ≥90% on PRO 6000 Blackwell (or honest-negative)
  do_not_claim:
  # NB: keep each entry on ONE line.  A wrapped plain scalar whose
  # continuation contains ': ' is a YAML mapping, and safe_load rejects the
  # file outright ("mapping values are not allowed here").
  - MetalCytoToxDB 5-metal v2 corpus (26632 rows) — its structures contain NO metal atom, MEASURED 0 of 800 sampled rows; it belongs to the D-MPNN property entry, not to CFM decoder training
  - Krasnov head-to-head parity via a shared corpus — the CFM and the D-MPNN now read DIFFERENT datasets by design
  - Aggregate lift before per-lever ablation (Wf-256 honest-negative BCa CI)
  - Best-seed selection (per Wf-245 n-seeds-min + Wf-126 §7)
  - Beat TargetDiff 0.86 m7 diversity (long-standing honest-negative)
  deferred:
  - F5_RDKIT_2D 32-d integration into CFM training (CPU code done, GPU run pending)
  - Per-lever ablation paper-grade (5-seed × 30-epoch GPU, requires explicit user OK)
  - M1/M2 master module full retrain (Wf-250 fix shipped, GPU run pending)
  - W₂ pic50 as GRADIENT (Wf-246 wired as diagnostic only)
  - m17 DrugOOD forward pass (Wf-256 deferred)
  - Flow-matching ODE sampler (n_steps / method / ot_solver) — NOT IMPLEMENTED in this trainer; the pieces exist in molmetal/adapters/flow_matching_lipman incl. the cloned reference solver
  - Evaluation panel (decode-smoke cadence, 5-pocket sweep, per-pocket output dirs, launch_loop.sh) — NOT IMPLEMENTED; this trainer takes one --pocket-id and has no panel driver

# ----------------------------------------------------------------------
# Wf-A12 (2026-10-13) operator-layer enhancements — APPENDED, opt-in.
# ----------------------------------------------------------------------
# Drop-in surface from molmetal.adapters.egnn_operator_enhancements.
# All flags default true so the new operators engage; set any to false
# to fall back to the legacy EquivariantGraphConv path bit-exactly.
# Per AGENTS.md §5.6 atomic-write + §5.11 YAML-only.
operator:
  use_enhanced_mlp: true
  use_enhanced_coord_update: true
  use_enhanced_aggregate: true
  use_enhanced_feature_update: true
  aggregate_mode: "sum_edge_type_weighted"   # {sum, sum_degree_norm, sum_edge_type_weighted, attention}
  chem_embed_dim: 16
  dative_angular_strictness: 0.5             # [0=soft, 1=hard]


# ----------------------------------------------------------------------
# Wf-A13 (2026-10-13) loss-layer modular surface — APPENDED, opt-in.
# ----------------------------------------------------------------------
# Drop-in surface from molmetal.loss.* (consumed by the sum-block agent
# post-Wf-A13; for now, no argparse dest exists in the CFM trainer for
# ``loss.*`` keys, so they appear in pre-flight's skip report.  Defaults
# are documented intent; flipping any to true activates the corresponding
# class with the documented default weight.
#
# Per AGENTS.md §5.11 — every key reaches a dest, has a verified
# non-trainer consumer (``molmetal.loss.<Class>.compute(...)``), or is
# DECLARED_INERT.  These are PENDING non-trainer consumers: the sum-block
# agent wires them in a sibling wave; for now, they are inert-but-known.
#
# Cross-links: TODO/pending/wfa13_loss_layer_modular.md (DRAFT).
loss:
  # L-A3 — read chemistry from the DECODED cloud, not the real one.
  use_molecule_loss: true
  molecule_loss_weight: 0.1
  # L1 / L-A1 — continuous BO supervision on head.continuous_bo_logits.
  bo_continuous_mse_weight: 0.1
  # L-A8 — Tanimoto-diversity over decoded SMILES (decoded path).
  diversity_term_weight: 0.1
  # L6 / L-A7 — assemble formulation.  ``arithmetic_mean`` is ~7e4x the
  # gradient magnitude of the shipped ``product`` formulation.
  assemble_formulation: "arithmetic_mean"
  # Default OFF: opt-in breaks test_fully_connected_graph_has_near_zero_gradient.
  assemble_term_weight: 0.0
  # Standalone clash penalty (independent of model-side clash_penalty_weight).
  clash_penalty_weight_override: 0.01

# ----------------------------------------------------------------------
# Wf-A14 (2026-10-13) end-of-training orchestrator — APPENDED, opt-in.
# ----------------------------------------------------------------------
# 9 keys wiring molmetal/end_of_training.py::auto_run(cfg) on_train_end.
# Per AGENTS.md §5.11 YAML-only: every key here resolves to a dest inside
# end_of_training.auto_run's cfg-dict consumer. Defaults are all true
# except cross_dataset_validation (deferred until 8-wave bench completes).
# Cross-links: TODO/completed/wf_design_ultracode9_eot.md §A-§G.
end_of_training:
  # FIX END-A4 — sascorer.py now uses the canonical LigandDiff algorithm
  # + fpscores.pkl.gz bundled on disk (sha256 verified).
  use_liganddiff_scoring: true
  # FIX END-A3 — torch.jit.script with eager fallback. HONEST-NEGATIVE-099:
  # ≥60% expected failure on EGNN + YuelBond + BondOrderHead.
  use_torchscript_export: true
  # FIX END-A5 — PaperTable emits Tables 1-3 in LigandDiff + tmcinvdes
  # combined format with MEASURED / PROJECTED provenance tracked per cell.
  use_paper_table_liganddiff_format: true
  # FIX END-A6 + END7 — FastAPI deployment surface
  # (/health, /decode).  Eager-fallback returns HONEST-NEGATIVE when no
  # TorchScript ckpt is provided.
  use_deployment_api: true
  # DEFERRED until the 8-wave bench completes (TODO-pending post-R21).
  cross_dataset_validation: false
  # FIX END5 — 12-field reproducibility manifest (git / torch / CUDA /
  # yaml sections / RNG / dataset / ckpt / environment) written as
  # YAML + JSON + paper-appendix MD.
  manifest_generator: true
  # Per AGENTS.md §5.10 license-header mandate — every NEW file under
  # molmetal/{eval/reporting,manifest,api,end_of_training.py} carries
  # an Apache-2.0 SPDX header.
  license_header: "Apache-2.0"
  # Cite LigandDiff (PRIMARY_1, Jin & Merz J. Chem. Theory Comput. 2024
  # DOI: 10.1021/acs.jctc.4c00232) and tmcinvdes (SECONDARY_1, Balcells &
  # Skjelstad JACS Au 2025) in paper Tables 1-3.
  cite_liganddiff: true
  cite_tmcinvdes: true

# ---------------------------------------------------------------------------
# Wf-A11 (2026-10-13) — Optimizer wave APPEND
# 8 NEW YAML keys documenting molmetal/optim/* primitives.  Per
# AGENTS.md §5.11, all 8 are added APPEND-only and have trainer-side
# default values that match the legacy Wf-13 path, so the bit-exact
# contract on existing callers is preserved.
# ---------------------------------------------------------------------------
optimizer:
  # bf16 hardware-compatibility gate.  When true, the trainer calls
  # check_bf16_compatibility() and disables autocast on sm<8.0.
  bf16_auto_disable: true
  # Minimum acceptable compute capability (Ampere A100 sm_80 = the
  # conservative floor).  Override per-config (e.g. RTX 5090 = 12.0).
  bf16_min_compute_capability: 8.0
  # Differential LR: 4-group param split (head_decay/head_no_decay /
  # backbone_decay/backbone_no_decay).  When true AND
  # head_lr_multiplier != 1.0, the trainer builds a 4-group Adam;
  # otherwise falls back to flat single-group Adam.
  use_differential_lr: true
  # Head LR multiplier (head_lr = base_lr * 0.1 by default).
  head_lr_multiplier: 0.1
  # No-decay parameter suffixes (canonical Transformer convention).
  no_decay_param_names: ["bias", "LayerNorm.weight", "layer_norm.weight"]
  # EMA shadow decay (was 0.999 in legacy 1.x trainer; 0.9999 is the
  # post-Wf-A11 default for stable R^2 fits at 50 epochs).
  ema_decay: 0.9999
  # Linear warmup steps (200 = default; 0 = no warmup, legacy Wf-13).
  warmup_steps: 200
  # EGNN gradient-checkpointing default (true = checkpoint ON by default).
  gradient_checkpointing_default: true

# ---------------------------------------------------------------------------
# Wf-A11 (2026-10-13) — Eval wave APPEND
# 9 NEW YAML keys documenting molmetal/eval/discriminators/* primitives.
# All 9 are added APPEND-only.  When all keys are at default, the
# trainer preserves the legacy Wf-13 eval path (no discriminator call,
# bond_type_f1 early stop, plain checkpoint save).
# ---------------------------------------------------------------------------
eval:
  # Master switch for the 4-discriminator audit trail
  # (TopologyDiscriminator + ChemistryDiscriminator + MetalAwareADMET
  # + ModelOutputAlignment).  When false, the trainer emits no
  # discriminator metrics — bit-exact match to Wf-13 behaviour.
  use_real_discriminators: true
  # Discriminator weights (currently informational only; the Wf-13
  # trainer does not loss-blend the discriminator metrics — they are
  # audit-only).
  discriminator_weight_single_fragment: 1.0
  discriminator_weight_ring_size: 1.0
  # Decode mode for YuelBondDecoder: "threshold" (legacy, default) or
  # "argmax" (Wf-A11 new).
  decode_mode: "argmax"
  # Toggle for MetalAwareADMET: when true, the 8 ADMET proxies carry a
  # per-metal offset proportional to (EN(metal) - 2.0).
  metal_aware_admet: true
  # Early-stop patience (was 3 in legacy 1.x trainer; 20 = new default
  # for the val_loss criterion).
  early_stop_patience: 20
  # Early-stop criterion: "val_loss" (new), "bond_type_f1" (legacy),
  # "gen_validity" (legacy).  The criterion drives which scalar the
  # trainer compares against the patience window.
  early_stop_metric: "val_loss"
  # ReduceLROnPlateau(val_loss, patience=10) — only honoured when
  # early_stop_metric == "val_loss".
  use_reduce_lr_on_plateau: true
  reduce_lr_patience: 10
