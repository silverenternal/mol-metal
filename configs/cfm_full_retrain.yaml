    - "CFM uses SAME data + scaffold split as chemprop v2 v3 → strict Krasnov head-to-head parity (no synthetic Pt click clouds, no 449-mol metallo_drugs_500_train subset)"
    - "5 seeds × 5 pockets × 50 epochs, paper-grade protocol"
    - "GPU util ≥90% on PRO 6000 Blackwell (or honest-negative)"
  # What we do NOT claim:
  do_not_claim:
    - "Synthesized Pt click clouds (this is a decoder smoke, not full retrain)"
    - "Aggregate lift before per-lever ablation (Wf-256 honest-negative BCa CI)"
    - "Best-seed selection (per Wf-245 n-seeds-min + Wf-126 §7)"
