# Wf-A8 yaml-unify pattern applied 2026-10-03 per task brief
# Per AGENTS.md §5.5 filesystem-truth + §5.6 atomic-write + §5.7 trainer-flag-smoke
# Cross-links: TODO/completed/A8_m17_yaml_rewrite.md §0 + TODO/decisions/0002-tier2-scope.md
# Cross-links: TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md + COMPARISON_BASELINES.md
# Original yaml preserved in .bak.wfa8other (yaml.safe_dump loses comments by design)
model:
  hidden_dim: 128
  # 2026-10-09: declared via the alias the D-MPNN trainer actually has.
  # `n_layers` was removed earlier as a dead key (that trainer declares
  # --depth, not --n-layers), which was correct but left the hyperparam
  # contract unsatisfied. --depth defaults to None, meaning "use
  # DMPNN_DEPTH=3" (train_dmpnn_multitask_wasserstein.py:3458-3461), so 3 is
  # the value the run has been using all along.
  depth: 3
train:
  batch_size: 32
  lr: 0.0001
  epochs: 30
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'warmup_steps: 200' removed — D-MPNN has no --lr-warmup-steps dest; its warmup is protocol.scheduler.warmup_epochs -> --lr-warmup-epochs.
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'grad_clip_norm: 1.0' removed — real dest is protocol.max_norm (5.0 below); loader alias now maps grad_clip_norm->max_norm.
  # WIRED 2026-10-04: `train.ema_decay` now reaches the D-MPNN trainer via
  # --ema-decay (with --use-ema).  This trainer had NO EMA code at all before
  # today, so the declared 0.999 reached nothing; see the EMA methods on
  # MultiTaskWassersteinModel and the init in main().
  ema_decay: 0.999
  # 2026-10-04: `edge_cutoff: 6.0` REMOVED.  It names a 3D interatomic distance
  # cutoff, which belongs to EquivariantDMPNN (whose own default is 5.0).  The
  # D-MPNN trainer builds DMPNNMultiTaskModel instead -- a 2D message-passing
  # net over the SMILES-derived molecular graph, which has NO cutoff parameter
  # and no 3D coordinates at all (grep for coords/positions/rbf over
  # train_dmpnn_multitask_wasserstein.py returns nothing).  So the key
  # described a geometry for a model this entry does not build.  Left absent
  # rather than registered as spec, because unlike flow.n_steps there is no
  # sibling config that uses it.
data:
  dataset: metalcytotox_5metal  # Wf-A8c FIX: rename qm9 to metalcytotox_5metal per Tier-1 allowed list
  split:  # Wf-A8c FIX: convert split string to block with type
    type: scaffold_split  # Krasnov 2026 baseline
    train_frac: 0.7
    val_frac: 0.1
    test_frac: 0.2
device: cuda
# Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'seed: 42' removed — D-MPNN dest is --seeds (list), not --seed; seed enumeration is per-pair.
output:
  ckpt_dir: molmetal/checkpoints
  events_jsonl: true
directives:
  pre_flight_gates_required:
  - p1_pytorch_cuda_available
  - p2_tests_pass
  - p3_wf343c4_anchor_freshness_24h
  - p3_wf343c2_per_wave_runtime_check
protocol:
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0

# Wf-A8c FIX: add entry block (yaml drives config)
entry:
  command_template: python molmetal/scripts/train_dmpnn_multitask_wasserstein.py --config {yaml_path}
