# Wf-A8 yaml-unify pattern applied 2026-10-03 per task brief
# Per AGENTS.md §5.5 filesystem-truth + §5.6 atomic-write + §5.7 trainer-flag-smoke
# Cross-links: TODO/completed/A8_m17_yaml_rewrite.md §0 + TODO/decisions/0002-tier2-scope.md
# Cross-links: TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md + COMPARISON_BASELINES.md
# Original yaml preserved in .bak.wfa8other (yaml.safe_dump loses comments by design)
model:
  hidden_dim: 128
  n_layers: 4
flow:
  n_steps: 100
  method: rk4
train:
  batch_size: 32
  lr: 0.0001
  epochs: 30
  warmup_steps: 200
  grad_clip_norm: 1.0
  ema_decay: 0.999
  edge_cutoff: 6.0
data:
  dataset: metalcytotox_5metal  # Wf-A8c FIX: rename qm9 to metalcytotox_5metal per Tier-1 allowed list
  split:  # Wf-A8c FIX: convert split string to block with type
    type: scaffold_split  # Krasnov 2026 baseline
    train_frac: 0.7
    val_frac: 0.1
    test_frac: 0.2
  target_index: null
device: cuda
seed: 42
output:
  ckpt_dir: molmetal/checkpoints
  events_jsonl: true
directives:
  pre_flight_gates_required:
  - p1_pytorch_cuda_available
  - p2_tests_pass
  - p3_wf343c4_anchor_freshness_24h
  - p3_wf343c2_per_wave_runtime_check
protocol:
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0

# Wf-A8c FIX: add entry block (yaml drives config)
entry:
  command_template: python molmetal/scripts/train_dmpnn_multitask_wasserstein.py --config {yaml_path}
