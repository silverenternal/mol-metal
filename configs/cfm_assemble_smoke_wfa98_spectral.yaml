# configs/cfm_assemble_smoke_wfa98_spectral.yaml
#
# Wf-A98 (2026-10-19) — CPU smoke for the SPECTRAL connectivity formulation.
#
# The sibling config (cfm_assemble_smoke_wfa98.yaml) runs the escape_time
# arm and MEASURED it inert at epoch 0: assemble_loss = 0.0 with
# assemble_stay_mean = 0.0983 against a corpus-derived tau of 0.24, while the
# same batch carried 21.96 hard fragments per cloud.  The soft graph is
# denser than every truth graph, so the hinge cannot fire without also
# firing on correct complexes.
#
# This arm replaces the statistic: 1 - 1/trace(exp(-tL)) on the DECODE-RULE
# graph, which is 0 for one component and rises with the component count,
# with no threshold to calibrate (see
# molmetal_lam/lam_chem/assemble_connectivity.py::_spectral_component_penalty).
#
# WHAT IT PROVES, and nothing else:
#   1. assemble_loss is NONZERO on the real cohort (the escape_time arm could
#      not manage this at any tau);
#   2. the term carries a live gradient (pinned by
#      molmetal/tests/test_wfa98_spectral_connectivity.py);
#   3. assemble_hinge_tau / assemble_inert reach events.jsonl.
#
# It is NOT a quality measurement: 2 epochs on 24 clouds says nothing about
# whether the term improves single_fragment_ratio. That is the A/B.

data:
  tmqm_dir: .data/molmetal/tmQM
  tmqm_metals:
    - Pt
  tmqm_coord_number: -1
  tmqm_val_frac: 0.25
  tmqm_split_kind: random

model:
  hidden_dim: 128
  n_layers: 3
  yuelbond_vocab: pt
  use_egnn_velocity: true
  use_fm_objective: true
  fm_t_per_cloud: 1
  connectivity_prior: "on"
  connectivity_prior_min_logit: 0.0

train:
  epochs: 2
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 0.0
  max_norm: 5.0
  bond_head_warmup_epochs: 0

flow:
  # The term under test. 'spectral' evaluates the DECODE-RULE graph (see
# molmetal_lam/lam_chem/assemble_connectivity.py::_spectral_component_penalty).
# escape_time is kept in the sibling config as the measured-inert control.
  # gradient (~7e4x the product's); product would be a diagnostic.
  assemble_loss_weight: 1.0
  assemble_formulation: spectral
  # Wf-A98 — derive the dead zone from this run's own bond truth.
  assemble_hinge_tau_mode: fixed
  # Leave the dead-zone value unset: corpus mode overwrites it, and writing
  # 0.30 here would suggest it still has an effect.
  bond_decision: threshold
  bond_decision_threshold: 0.5
  dative_distance_cutoff: 2.6
  n_steps: 8
  method: midpoint
  edge_cutoff: 3.5

protocol:
  n_train: 24
  n_val: 8
  seed: 0
  n_seeds: 1

compute:
  device: cpu
  tf32: false
  torch_compile: false

eval:
  gen_eval_n: 4
  gen_eval_seeds: "0"
  gen_validity_samples: 4

output:
  base_dir: /tmp/wfa98_smoke_spectral
  log_master: /tmp/wfa98_smoke_spectral/master.log
  ckpt_dir: /tmp/wfa98_smoke_spectral/checkpoints
  events_jsonl: true
  resume_from: none

directives:
  kill_then_adapt: true
  time_budget: 1h
  user_ok_required: false

entry:
  script: molmetal/scripts/train_cfm_yuelbond_wasserstein.py
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_cfm_yuelbond_wasserstein.py --config {yaml_path} --seed {seed} --out-dir {out_dir} --ckpt-dir {ckpt_dir}
