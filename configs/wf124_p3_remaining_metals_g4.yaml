# TODO-180 G4 — Wf-124 P3 14 PENDING (metal, seed) pairs at 30 epochs
# Date: 2026-09-28 (Wf-258-Prepare dry-run config)
# Owner: Hugo Lee + ultracode agent
# Status: DRY-RUN (--dry-run mode; no GPU execution)
#
# Parent: TODO-180 G4 — 14 PENDING (metal, seed) pairs (Ru s0 MEASURED;
# Ru s1/s2 + Ir s0/s1/s2 + Os s0/s1/s2 + Rh s0/s1/s2 + Re s0/s1/s2 PENDING).
# Parent audit: molmetal/reports/wf258_audit/cfm_todo_gap_audit.md §1.3
# Parent TODO: TODO/pending/180_wf124_p3_remaining_metals_seeds.md §1-§5
# Wf-257 §5.1 cite: Wf-257 §5.1 (CFM TODO shortlist, entry 3)
#
# HONEST FRAMING (party-twenty-spirit §3.5):
# - Ru seed=0 MEASURED: test_auc = 0.7613, val_auc = 0.6648, W2 decay
#   0.8990 -> 0.3906 (Wf-124 P3 ship).
# - 14 PENDING pairs at 30 epochs; ~7.7 min each on RTX 5090 GPU-1.
# - Smaller-metal caveat: Rh/Os/Re cohorts < 1.2k rows -> per-seed std
#   likely +/- 0.10; honest framing: report mean +/- std unfiltered,
#   no best-seed selection (per mol-metal-gpu-execution §7).

dry_run: true          # skip GPU; CPU verification only
user_ok_required: true  # per kill_then_adapt standing directive

# ============================================================================
# DATA — REAL CSV (NOT synthetic)
# ============================================================================
data:
  csv: .data/molmetal/metalcytotox_5metal_multitask_v2.csv
  n_rows_expected: 26632   # v2 26633 lines - 1 header = 26632 rows (per Wf-261 strict scaffold split; 169 null-scaffold rows dropped)
  expected_columns_subset: [smiles, metal, pic50, source]
  cohort_filter:
    metals: [Ru, Ir, Os, Rh, Re]
    # Per Wf-124 P3 §0: 5-metal joint pool (not single-metal)
    # Wf-261 strict Bemis-Murcko scaffold 70/10/20 split (0 leak; 3069 unique scaffolds)
    scaffold_split: true

# ============================================================================
# MODEL — chemprop_v2_v3 multi-task D-MPNN + W2 pIC50
# ============================================================================
model:
  backbone: chemprop_v2_v3           # chemprop v2 + v3 fixes (Wf-120 P2)
  ablation_config: mtl_baseline       # Wf-251-F3 default
  hidden_dim: 300                    # chemprop default
  depth: 3
  task: multi_task                   # 5-metal joint pool
  wasserstein_weight: 0.05           # Wf-131 P1 ship
  alpha: 0.5                         # BCE loss weight
  n_mc: 256                          # sliced-W2 projections
  w2_gradient_mode: sliced           # Wf-251-F4 default
  use_l2_guard: true                 # grad-norm clip at 5.0

# ============================================================================
# TRAINING PROTOCOL — Wf-124 P3 standard (30 epochs per (metal, seed) pair)
# ============================================================================
protocol:
  n_seeds: 3                         # 0, 1, 2 (per Wf-124 P3)
  seeds: [0, 1, 2]
  epochs: 30                         # Wf-124 P3 standard (TODO-180 §1)
  batch_size: 64
  lr: 1.0e-3
  grad_clip_norm: 5.0                # L2 guard
  bf16: true

# ============================================================================
# 14 PENDING (metal, seed) PAIRS — explicit enumeration
# ============================================================================
pending_pairs:
  ru: [1, 2]                         # Ru seed=0 already MEASURED
  ir: [0, 1, 2]
  os: [0, 1, 2]
  rh: [0, 1, 2]
  re: [0, 1, 2]
  total_pairs: 14

# ============================================================================
# EVALUATION
# ============================================================================
eval:
  per_pair_metrics:
    - test_auc                       # m1 — primary
    - val_auc                        # m1 — best-epoch selection (NOT best-seed)
    - wasserstein_final              # W2 trajectory endpoint
    - grad_norm_max                  # L2 guard stability check
  target_test_auc: 0.86              # Krasnov 2026 target (PROJECTED, NOT MEASURED)

# ============================================================================
# OUTPUT — project root results/ per user 2026-09-28 instruction
# ============================================================================
output:
  base_dir: results/wf124_p3_remaining_metals_g4
  per_metal_dir: results/wf124_p3_remaining_metals_g4/{metal}/per_seed_metrics_seed{seed}.json
  wasserstein_decay_dir: results/wf124_p3_remaining_metals_g4/{metal}/wasserstein_decay_seed{seed}.json
  training_summary: results/wf124_p3_remaining_metals_g4/training_summary.json
  log_master: results/wf124_p3_remaining_metals_g4/master.log

# ============================================================================
# WAVES — 2 waves on RTX 5090 GPU-1 (each <=1 hr per kill_then_adapt)
# ============================================================================
waves:
  total_waves: 2
  wave_a:
    description: "Ru s1/s2 + Ir s0/s1/s2 + Os s0/s1/s2 (8 pairs)"
    pairs:
      - {metal: Ru, seed: 1}
      - {metal: Ru, seed: 2}
      - {metal: Ir, seed: 0}
      - {metal: Ir, seed: 1}
      - {metal: Ir, seed: 2}
      - {metal: Os, seed: 0}
      - {metal: Os, seed: 1}
      - {metal: Os, seed: 2}
    n_pairs: 8
    wall_time_estimate: 1.0          # hr on RTX 5090 (8 x ~7.7 min)
  wave_b:
    description: "Rh s0/s1/s2 + Re s0/s1/s2 (6 pairs)"
    pairs:
      - {metal: Rh, seed: 0}
      - {metal: Rh, seed: 1}
      - {metal: Rh, seed: 2}
      - {metal: Re, seed: 0}
      - {metal: Re, seed: 1}
      - {metal: Re, seed: 2}
    n_pairs: 6
    wall_time_estimate: 0.8          # hr on RTX 5090 (6 x ~7.7 min)
  total_wall_time_estimate: 1.8      # hr on RTX 5090

# ============================================================================
# COMPUTE
# ============================================================================
compute:
  gpu: cuda:1                        # RTX 5090 GPU-1
  cpu_workers: 4
  bf16: true

# ============================================================================
# STANDING DIRECTIVES
# ============================================================================
directives:
  kill_then_adapt: true
  time_budget: 10h                   # user 2026-09-28 standing budget
  user_ok_required: true
  user_ok_granted: "pending — DRY-RUN only"
  per_wave_user_ok_required: true

# ============================================================================
# ENTRY POINT — reference existing script (do NOT recreate)
# ============================================================================
entry:
  # Reuses Wf-124 P3 shipped multi-task D-MPNN trainer (~700 LOC).
  # Per --help output: has --metals, --seeds, --epochs, --alpha,
  # --wasserstein-weight, --use-l2-guard, --out-dir, --ckpt-dir flags.
  script: molmetal/scripts/train_dmpnn_multitask_wasserstein.py
  command: |
    CUDA_VISIBLE_DEVICES=1 /home/hugo/codes/CadButEaas/.venv-vlm/bin/python \\
      molmetal/scripts/train_dmpnn_multitask_wasserstein.py \\
      --metals {metal} \\
      --seeds {seed} \\
      --epochs 30 \\
      --batch-size 64 \\
      --lr 1e-3 \\
      --alpha 0.5 \\
      --wasserstein-weight 0.05 \\
      --use-l2-guard \\
      --device cuda:1 \\
      --out-dir {out_dir} \\
      --ckpt-dir {ckpt_dir}

  warm_start_checkpoint: "n/a"        # cold-start each pair (Wf-124 P3 protocol)

# ============================================================================
# HONEST FRAMING (party-twenty-spirit §3.5)
# ============================================================================
honest_framing:
  claims:
    - "Run 14 PENDING (metal, seed) pairs at 30 epochs on RTX 5090 GPU-1"
    - "~1.8 hr wall-time, 2 waves each <=1 hr per kill_then_adapt"
    - "Per-metal 3-seed mean +/- std unfiltered, NO best-seed selection"
  do_not_claim:
    - "5-metal x 3-seed mean test_auc >= 0.86 (Krasnov 2026 target PROJECTED,
       not MEASURED; +0.049 -> +0.098 gap uncertain at 30 ep)"
    - "Best-seed selection (per mol-metal-gpu-execution §7)"
    - "30-epoch convergence (TODO-181 G5 may be needed for that)"
  deferred:
    - "50-epoch full sweep (TODO-181 G5) for convergence verification"
    - "Per-innovation ablation (TODO-182 G6) for lever attribution"
    - "W2 as GRADIENT vs DIAGNOSTIC verification (per Wf-246-A)"

# ============================================================================
# CROSS-REFERENCES
# ============================================================================
cross_references:
  - molmetal/reports/wf258_audit/cfm_todo_gap_audit.md
  - TODO/pending/180_wf124_p3_remaining_metals_seeds.md
  - molmetal/reports/wf124_p3_multitask/ru/per_seed_metrics_seed0.json
  - molmetal/scripts/train_dmpnn_multitask_wasserstein.py
  - TODO/pending/181_wf124_p3_50_epoch_full_sweep.md
  - TODO/pending/182_wf124_p3_per_innovation_ablation.md