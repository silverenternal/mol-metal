# Wf-A8 yaml-unify pattern applied 2026-10-03 per task brief
# Per AGENTS.md §5.5 filesystem-truth + §5.6 atomic-write + §5.7 trainer-flag-smoke
# Cross-links: TODO/completed/A8_m17_yaml_rewrite.md §0 + TODO/decisions/0002-tier2-scope.md
# Cross-links: TODO/03_baselines/PROTOCOL_ALIGNMENT_MATRIX.md + COMPARISON_BASELINES.md
# Original yaml preserved in .bak.wfa8other (yaml.safe_dump loses comments by design)
# Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: removed 'dry_run: true' + 'user_ok_required: true' (no consumer anywhere; launch mode = start.sh flags + USER_OK env, AGENTS.md 5.1)
data:
  dataset: metalcytotox_5metal  # Wf-A8c FIX
  split:
    type: scaffold_split  # Krasnov 2026 baseline
  csv: .data/molmetal/metalcytotox_5metal_multitask_v2.csv
  n_rows_expected: 26632
  expected_columns_subset:
  - smiles
  - metal
  - pic50
  - source
  cohort_filter:
  dataset: metalcytotox_5metal  # Wf-A8c FIX
  split:
    type: scaffold_split  # Krasnov 2026 baseline
    metals:
    - Ru
    - Ir
    - Os
    - Rh
    - Re
    scaffold_split: true
model:
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'backbone' removed (no --backbone dest in either trainer; never reached the trainer).
  ablation_config: mtl_baseline
  hidden_dim: 300
  depth: 3
  task: multi_task
  wasserstein_weight: 0.05
  alpha: 0.5
  n_mc: 256
  w2_gradient_mode: sliced
  use_l2_guard: true
protocol:
  n_seeds: 3
  seeds:
  - 0
  - 1
  - 2
  epochs: 30
  batch_size: 64
  lr: 0.001
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'grad_clip_norm: 5.0' removed (loader alias grad_clip_norm->--max-norm; operative key = protocol.max_norm: 5.0 below).
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'bf16' removed (ZERO bf16/autocast/GradScaler occurrences in either trainer; claimed an AMP path that does not exist).
  scheduler:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-06
  weight_decay: 1.0e-05
  max_norm: 5.0
pending_pairs:
  ru:
  - 1
  - 2
  ir:
  - 0
  - 1
  - 2
  os:
  - 0
  - 1
  - 2
  rh:
  - 0
  - 1
  - 2
  re:
  - 0
  - 1
  - 2
  total_pairs: 14
eval:
  per_pair_metrics:
  - test_auc
  - val_auc
  - wasserstein_final
  - grad_norm_max
  target_test_auc: 0.86
output:
  base_dir: results/wf124_p3_remaining_metals_g4
  per_metal_dir: results/wf124_p3_remaining_metals_g4/{metal}/per_seed_metrics_seed{seed}.json
  wasserstein_decay_dir: results/wf124_p3_remaining_metals_g4/{metal}/wasserstein_decay_seed{seed}.json
  training_summary: results/wf124_p3_remaining_metals_g4/training_summary.json
  log_master: results/wf124_p3_remaining_metals_g4/master.log
  ckpt_dir: molmetal/checkpoints
  events_jsonl: true
waves:
  total_waves: 2
  wave_a:
    description: Ru s1/s2 + Ir s0/s1/s2 + Os s0/s1/s2 (8 pairs)
    pairs:
    - metal: Ru
      seed: 1
    - metal: Ru
      seed: 2
    - metal: Ir
      seed: 0
    - metal: Ir
      seed: 1
    - metal: Ir
      seed: 2
    - metal: Os
      seed: 0
    - metal: Os
      seed: 1
    - metal: Os
      seed: 2
    n_pairs: 8
    wall_time_estimate: 1.0
  wave_b:
    description: Rh s0/s1/s2 + Re s0/s1/s2 (6 pairs)
    pairs:
    - metal: Rh
      seed: 0
    - metal: Rh
      seed: 1
    - metal: Rh
      seed: 2
    - metal: Re
      seed: 0
    - metal: Re
      seed: 1
    - metal: Re
      seed: 2
    n_pairs: 6
    wall_time_estimate: 0.8
  total_wall_time_estimate: 1.8
compute:
  gpu: cuda:0
  cpu_workers: 4
  # Wf-A11 (2026-10-03): see TODO/completed/config_dead_key_remediation.md: 'bf16' removed (ZERO bf16/autocast/GradScaler occurrences in either trainer; claimed an AMP path that does not exist).
directives:
  kill_then_adapt: true
  # 2026-10-03 user directive: session budget is 48h ("我给48小时的预算").
  # The old 10h/13h values made the per-wave budget gate FAIL on a resource
  # dimension that is not actually constrained; with 48h the gate still does
  # real work (it FAILs a wave whose declared grid exceeds the declared
  # budget) but no longer blocks a legitimate launch.
  time_budget: 48h
  user_ok_required: true
  user_ok_granted: pending — DRY-RUN only
  per_wave_user_ok_required: true
  pre_flight_gates_required:
  - p1_pytorch_cuda_available
  - p2_tests_pass
  - p3_wf343c4_anchor_freshness_24h
  - p3_wf343c2_per_wave_runtime_check
entry:
  script: molmetal/scripts/train_dmpnn_multitask_wasserstein.py
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_dmpnn_multitask_wasserstein.py --config {yaml_path} --metals {metal} --seeds {seed} --epochs 30 --batch-size 64 --lr 1e-3 --alpha 0.5 --wasserstein-weight 0.05 --use-l2-guard --device cuda:0 --out-dir {out_dir} --ckpt-dir {ckpt_dir}
  warm_start_checkpoint: n/a
honest_framing:
  claims:
  - Run 14 PENDING (metal, seed) pairs at 30 epochs on RTX 5090 GPU-1
  - ~1.8 hr wall-time, 2 waves each <=1 hr per kill_then_adapt
  - Per-metal 3-seed mean +/- std unfiltered, NO best-seed selection
  do_not_claim:
  - 5-metal x 3-seed mean test_auc >= 0.86 (Krasnov 2026 target PROJECTED, not MEASURED; +0.049 -> +0.098 gap uncertain at
    30 ep)
  - Best-seed selection (per mol-metal-gpu-execution §7)
  - 30-epoch convergence (TODO-181 G5 may be needed for that)
  deferred:
  - 50-epoch full sweep (TODO-181 G5) for convergence verification
  - Per-innovation ablation (TODO-182 G6) for lever attribution
  - W2 as GRADIENT vs DIAGNOSTIC verification (per Wf-246-A)
cross_references:
- molmetal/reports/wf258_audit/cfm_todo_gap_audit.md
- TODO/pending/180_wf124_p3_remaining_metals_seeds.md
- molmetal/reports/wf124_p3_multitask/ru/per_seed_metrics_seed0.json
- molmetal/scripts/train_dmpnn_multitask_wasserstein.py
- TODO/pending/181_wf124_p3_50_epoch_full_sweep.md
- TODO/pending/182_wf124_p3_per_innovation_ablation.md
