# configs/msrs_dmpnn_protocols_gpu0.yaml — STR-2a formal run on GPU0.
#
# Same model/train block as configs/msrs_dmpnn_surface_gpu0.yaml (FIX-M1), so
# the protocol numbers are comparable to the ligand-grouped reference. Only the
# metal_state arm is trained: FIX-M2 already showed it is the best of the three.
#
# Invoke per seed with:
#   .venv/bin/python molmetal/scripts/msrs_dmpnn_protocols.py \
#       --config configs/msrs_dmpnn_protocols_gpu0.yaml --seed N
#
# GPU policy: cuda:0 only (user directive 2026-10-16). This script calls torch
# directly, so compute.device is the only device knob; do not add compute.gpu.

entry:
  script: molmetal/scripts/msrs_dmpnn_protocols.py
  command_template: "/home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/msrs_dmpnn_protocols.py --config {yaml_path}"

data:
  long: data/msrs/measurements.parquet
  endpoint: potency
  top_cell_lines: 40
  limit: 0

model:
  hidden: 128
  depth: 3
  dropout: 0.1

train:
  epochs: 60
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  patience: 10
  inner_val_fraction: 0.1
  seed: 20261018

compute:
  device: cuda:0
  num_threads: 1
  deterministic: true

# REMOVED 2026-10-21 (config-binding gate).  This block used to carry
# `eval.splits / eval.baseline_arm / arms.metal_state.* / output.path`.
# `msrs_dmpnn_protocols.py` reads none of them: the four protocols are the
# module constant `SCHEMES = ("ligand", "doi", "scaffold", "year")`, the arm is
# `ARM_NAME = "gnn_metal_state"` with `use_metal_node=True` hardcoded, and the
# artifact path defaults to `results/msrs_dmpnn_protocols/seed{N}.json`.
#
# They were not merely inert, they were wrong: `eval.splits: [canonical_grouped]`
# names a protocol this script never runs, and none of the four it does run is
# called `canonical_grouped`.  A config that describes a different experiment
# from the one the script performs is worse than no config.
