# Objective terms that are implemented but default to weight 0.0.
#
# SEPARATE FROM configs/cfm_fullcorpus_b64_2026_10_11.yaml ON PURPOSE. That
# file exists to be a single-variable batch-size A/B, and these four keys were
# briefly injected into it, which made its "differs in batch size and nothing
# else" header false. Do not merge them back.
#
# WHAT EACH TERM IS, AND WHY IT IS SAFE OR NOT:
#   assemble_loss_weight / assemble_formulation / assemble_hinge_tau
#     The connectivity term, and the only loss term that corresponds to the
#     tracked gen_single_fragment_ratio. Measured gradient magnitudes
#     (MEASURED): product 5.008e-09, escape_time 3.742e-04. `product` is the
#     argparse default and is NOT an objective; escape_time with tau=0.30
#     returns exactly (0.0, 0.0) on already-connected clouds, so it penalises
#     fragmentation without fighting a good molecule.
#   entropy_reg_weight
#     Motivated by a recorded failure, not a guess: BLK-C4 measured
#     gen_validity = 0.000 from epoch 4 onward because the head collapsed onto
#     one degenerate skeleton while the CE term stayed happy. Measured
#     |d/dlogits| = 1.8155e-05 - a small, always-signed nudge, not a
#     collapse-inducing pressure.
#
# WHAT IS *NOT* HERE, DELIBERATELY: gen_validity_weight (soft-valence). Its
# definition (molmetal/molmetal_lam/lam_chem/decoder_rework.py) is a
# ONE-SIDED squared hinge, sum_a max(0, cap - sum_orders - eps)^2, with zero
# gradient in the feasible region. It can only push bond orders DOWN, and
# metrics/by_metric/decode_ratio.json around line 243 records that a NO_BOND
# head reads gen_validity 0.977 while bond precision craters. Turning it on
# would improve the tracked validity metric by degrading the metric the
# early-stop gate selects on. molmetal/tests/test_wf_track5_zero_weight_loss_terms.py
# pins its one-sidedness so it is not re-enabled by someone who assumes it
# rewards forming bonds.
#
# HONEST STATUS: the WEIGHTS below are unvalidated. The gradient magnitudes
# and directions are measured; the choice of 1.0 and 0.01 is not. Treat a run
# from this file as a first measurement, not a tuned configuration.
compute:
  device: auto
  tf32: false
  torch_compile: false
  triton_ot: false
data:
  tmqm_coord_number: -1
  tmqm_dir: .data/molmetal/tmQM
  tmqm_metals: Pt,Ru,Ir,Rh,Os,Re
  tmqm_val_frac: 0.2
directives:
  kill_then_adapt: true
  time_budget: 48h
  user_ok_granted: 48h budget + RTX PRO 6000 Blackwell + project root results/ (2026-09-28)
  user_ok_required: true
entry:
  command_template: /home/hugo/codes/mol-metal/.venv/bin/python molmetal/scripts/train_cfm_yuelbond_wasserstein.py
    --config {yaml_path} --seed {seed}
  script: molmetal/scripts/train_cfm_yuelbond_wasserstein.py
eval:
  early_stop_epsilon: 0.85
  early_stop_metric: bond_type_f1
  gen_eval_n: 256
  gen_eval_seeds: 0 1 2 3
  method: midpoint
  n_steps: 50
  wasserstein_weight: 0.1
flow:
  bond_decision: threshold
  bond_decision_threshold: 0.5
  monge_ampere: false
  use_ot_cfm: false
model:
  connectivity_prior: 'on'
  connectivity_prior_min_logit: 0.0
  fm_t_per_cloud: 1
  hidden_dim: 128
  n_layers: 3
  use_egnn_velocity: true
  use_fm_objective: true
  use_tmqm_init: true
  yuelbond_vocab: all6
output:
  base_dir: molmetal/reports/cfm_fullcorpus_2026_10_10
  checkpoint_interval: 5
  ckpt_dir: molmetal/reports/cfm_objective_terms_2026_10_11/checkpoints
  log_master: molmetal/reports/cfm_objective_terms_2026_10_11/master.log
  out_dir: molmetal/reports/cfm_objective_terms_2026_10_11
  training_summary: molmetal/reports/cfm_objective_terms_2026_10_11/synthesis.md
protocol:
  seed: 0
train:
  batch_size: 16
  bond_head_warmup_epochs: 0
  ema_decay: 0.999
  epochs: 50
  fm_noise_sigma: 2.485
  lr: 0.0003
  lr_scheduler: cosine
  lr_warmup_epochs: 5
  max_norm: 5.0
  n_train: 26715
  resume_from: none
  weight_decay: 0.0
  assemble_loss_weight: 1.0
  assemble_formulation: escape_time
  assemble_hinge_tau: 0.3
  entropy_reg_weight: 0.01
