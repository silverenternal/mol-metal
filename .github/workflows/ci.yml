# Mol-Metal — CI gate (evaluator sanity + pitfall guards + mechanism smoke)
#
# Authoritative spec: TODO/completed/ (see wf_ci_guard/final.md).
# Run this on every push + PR; it must show:
#
#   [evaluators]   14/14 PASS  (eval_all_evaluators.py)
#   [pitfall-rnr]   7/7  PASS  (wf_pitfall_guard/check_all.py)
#   [pitfall-pt]   ≥11 PASSED  (test_pitfall_guards.py)
#   [mechanism]   ≥217 PASSED  (8 named mechanism smoke test files)
#
# Hardware target: self-hosted runner (mol-metal dev box) with the
# canonical repo-local .venv at $UV_PROJECT_ENVIRONMENT (AGENTS.md §5.9
# single-venv rule).  GPU is NOT required for this CI gate — everything
# is CPU-only sanity.  A GitHub-hosted ubuntu-latest runner needs a
# repo-local `uv sync` first (same .venv path).
name: ci

on:
  push:
    branches: [master, main, 'release/*', 'round*']
  pull_request:
    branches: [master, main, 'release/*', 'round*']
  workflow_dispatch:

# Cancel in-flight runs of this same workflow on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Job 1 — evaluator sanity (14/14 PASS gate)
  # ----------------------------------------------------------------------
  evaluator-sanity:
    name: "[1/4] Evaluator sanity (14/14)"
    runs-on: [self-hosted, linux, x64, mol-metal]  # see runs-on notes above
    timeout-minutes: 15
    env:
      # Canonical repo-local .venv (AGENTS.md §5.9) with rdkit, torch, posebusters, meeko, etc.
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      # Project-local data (loaders honour these since the 2026-09-25 patch)
      MOLMETAL_DATA_DIR: /home/hugo/codes/mol-metal/.data/molmetal
      MOLMETAL_TMQM_DIR: /home/hugo/codes/mol-metal/.data/molmetal/tmQM
      # Quiet / hygiene
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_VERBOSITY: "error"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python (canonical .venv path)
        run: |
          set -euo pipefail
          echo "PYTHON_BIN=$UV_PROJECT_ENVIRONMENT/bin/python"
          $UV_PROJECT_ENVIRONMENT/bin/python --version
          $UV_PROJECT_ENVIRONMENT/bin/python -c "import rdkit, openbabel, posebusters, meeko; print('rdkit/openbabel/posebusters/meeko OK')"

      - name: Run evaluator sanity suite (must show 14/14 PASS)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          $UV_PROJECT_ENVIRONMENT/bin/python molmetal/scripts/eval_all_evaluators.py | tee eval_all_evaluators.log
          tail -3 eval_all_evaluators.log | grep -q "14/14 evaluators PASS"

      - name: Upload evaluator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-all-evaluators-log
          path: eval_all_evaluators.log
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 1b — Blackwell GPU sanity (optional; only on manual dispatch or
  #          the cron schedule). The first 4 jobs stay CPU-only so every
  #          push and PR is gated without needing a Blackwell runner.
  # ----------------------------------------------------------------------
  blackwell-gpu-sanity:
    name: "[1b] Blackwell GPU sanity (optional)"
    runs-on: [self-hosted, linux, x64, mol-metal-blackwell]
    timeout-minutes: 30
    # Only invoked when a maintainer dispatches this workflow manually or
    # the schedule trigger fires — pushed branches and PRs deliberately
    # skip this job so the self-hosted Blackwell box isn't a hard dep.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      # Canonical repo-local .venv (CUDA-enabled torch, rdkit, …)
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      # Project-local data (loaders honour these since the 2026-09-25 patch)
      MOLMETAL_DATA_DIR: /home/hugo/codes/mol-metal/.data/molmetal
      MOLMETAL_TMQM_DIR: /home/hugo/codes/mol-metal/.data/molmetal/tmQM
      # CUDA allocator + AMP toggles mirrored from env.sh so the job
      # reflects what an interactive shell run would do.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      MOLMETAL_CFM_AMP: "1"
      MOLMETAL_CFM_AMP_DTYPE: bfloat16
      MOLMETAL_EGNN_CHECKPOINT: "1"
      # Quiet / hygiene
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_VERBOSITY: "error"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Source env.sh (CUDA, BF16, data dirs, canonical .venv)
        run: |
          set -euo pipefail
          source ./env.sh
          echo "[env] UV_PROJECT_ENVIRONMENT=${UV_PROJECT_ENVIRONMENT}"
          echo "[env] MOLMETAL_DATA_DIR=${MOLMETAL_DATA_DIR}"
          "$UV_PROJECT_ENVIRONMENT"/bin/python - <<'PYEOF'
          import torch
          print(f"[env] torch={torch.__version__} cuda_avail={torch.cuda.is_available()}")
          if torch.cuda.is_available():
              print(f"[env] device_count={torch.cuda.device_count()}")
              for i in range(torch.cuda.device_count()):
                  print(f"[env] cuda:{i} -> {torch.cuda.get_device_name(i)} "
                        f"cc={torch.cuda.get_device_capability(i)} "
                        f"vram={torch.cuda.get_device_properties(i).total_memory // (1024**3)} GiB")
          PYEOF

      - name: CFM subsystem smoke (200 train steps + 4 decode probes)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          bash molmetal/scripts/smoke/smoke_cfm.sh | tee cfm_smoke.log
          grep -E "CFM_SMOKE PASS" cfm_smoke.log

      - name: 200-step metallo-drug retrain sanity on GPU
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p molmetal/reports/wf_blackwell_optional
          "$UV_PROJECT_ENVIRONMENT"/bin/python molmetal/scripts/metallo_drug_smoke_retrain.py \
              --steps 200 --hidden-dim 128 --n-layers 3 \
              --joint-train --bond-head learned --n-train 500 \
              --atom-vocab 14 --decode-smoke-every 100 \
              --out-dir molmetal/reports/wf_blackwell_optional/ \
              | tee retrain_smoke.log
          grep -E "decode_ratio" retrain_smoke.log

      - name: Pytest integration suite (Lipman + pocket + Blackwell path)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Wf-A269 wave-28 (2026-11-06) — `molmetal/tests/test_rocm_lipman.py`
          # WAS DELETED in commit 09c2202a ("…rocm cleanup"; it is not in
          # `git ls-tree HEAD`).
          #
          # SUPERSEDED RENDERING PRESERVED VERBATIM per AGENTS.md section 5.5
          # rule #6 — the sentence below was TRUE at HEAD and is FALSE in
          # this working tree:
          #   "…and this step still named it ⇒ pytest exits
          #    4 (usage error: file not found) ⇒ THE STEP COULD NEVER PASS, on
          #    the one job that is allowed to touch the GPU box."
          #
          # CORRECTION (MEASURED 2026-11-09, Wf-A269 runner-coverage wave):
          # the argv BELOW no longer names `test_rocm_lipman.py` — that line
          # was removed — so this step names only files that exist and pytest
          # no longer exits 4.  The quoted rendering above is a DATED
          # 2026-11-06 reading of HEAD, not of this tree.
          # `molmetal/tests/test_rocm_egnn.py` still exists and is NOT
          # substituted: this step is the Lipman/pocket suite, and adding a
          # different file to it would change what the job MEASURES.
          # The guards that pin this class live in
          # molmetal/tests/test_wfa269_wave28_published_number_guards.py
          # (group F: every `molmetal/tests/*.py` named by this file must
          # exist on disk) and in
          # molmetal/tests/test_wfa269_runner_coverage_gate.py (a runner that
          # names a path which does not exist is a DEAD INVOCATION and fails
          # the gate); both run in CI job 4e.
          "$UV_PROJECT_ENVIRONMENT"/bin/python -m pytest \
              molmetal/tests/test_lipman_spatial_contract.py \
              molmetal/tests/test_pocket_conditioned_lipman.py \
              molmetal/tests/test_synflownet_env.py \
              -q --tb=short --no-header \
              | tee blackwell_pytest.log
          grep -E "[0-9]+ passed" blackwell_pytest.log

      - name: Upload Blackwell sanity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackwell-gpu-sanity-logs
          path: |
            cfm_smoke.log
            retrain_smoke.log
            blackwell_pytest.log
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 2 — pitfall guard matrix runner (7/7 PASS gate)
  # ----------------------------------------------------------------------
  pitfall-runner:
    name: "[2/4] Pitfall guard runner (7/7)"
    runs-on: [self-hosted, linux, x64, mol-metal]
    timeout-minutes: 10
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run pitfall guard runner (must show 7/7 PASS)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          $UV_PROJECT_ENVIRONMENT/bin/python molmetal/scripts/wf_pitfall_guard/check_all.py | tee pitfall_check.log
          # The runner's real footer is 'PASS=7 FAIL=0 SKIP=0 MISS=0'
          # (molmetal/scripts/wf_pitfall_guard/check_all.py::_format_table).
          # The regex must match that shape exactly — a loose 'contains
          # PASS=7' would also accept a FAIL/MISS footer, and dropping the
          # trailing MISS counter made the pattern unmatchable in the
          # first place.
          # SUPERSEDED RENDERING PRESERVED VERBATIM per AGENTS.md section 5.5 rule #6:
          #   grep -E "^\s*PASS=7\s+FAIL=0\s+SKIP=0\s*$" pitfall_check.log
          # (omitted the trailing 'MISS=0' counter the producer always
          #  emits, so this step could never pass — the job was red for
          #  a reason unrelated to the code under test.)
          grep -E "^\s*PASS=7\s+FAIL=0\s+SKIP=0\s+MISS=0\s*$" pitfall_check.log

      - name: Upload pitfall guard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitfall-check-log
          path: pitfall_check.log
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 3 — pitfall guard pytest (≥11 PASSED gate; matrix + sub-tests)
  # ----------------------------------------------------------------------
  pitfall-pytest:
    name: "[3/4] Pitfall guard pytest (≥11)"
    runs-on: [self-hosted, linux, x64, mol-metal]
    timeout-minutes: 10
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run pitfall guard pytest
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          $UV_PROJECT_ENVIRONMENT/bin/python -m pytest molmetal/tests/test_pitfall_guards.py \
              -q --tb=short --no-header \
              | tee pitfall_pytest.log
          # Expect ≥11 passed (7 canonical + 7 parametrized matrix, some
          # sub-tests collapse to the same set when guards skip).
          grep -E "[0-9]+ passed" pitfall_pytest.log

      - name: Upload pitfall pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitfall-pytest-log
          path: pitfall_pytest.log
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 4 — mechanism smoke (≥217 PASSED gate; 8 named test files)
  # ----------------------------------------------------------------------
  mechanism-smoke:
    name: "[4/4] Mechanism smoke (≥217)"
    runs-on: [self-hosted, linux, x64, mol-metal]
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      MOLMETAL_DATA_DIR: /home/hugo/codes/mol-metal/.data/molmetal
      MOLMETAL_TMQM_DIR: /home/hugo/codes/mol-metal/.data/molmetal/tmQM
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_VERBOSITY: "error"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run mechanism smoke tests (≥217 passed required)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          $UV_PROJECT_ENVIRONMENT/bin/python -m pytest \
              molmetal/tests/test_f2a_metal_ligand_exchange.py \
              molmetal/tests/test_synthemol_reactions.py \
              molmetal/tests/test_lambda_combinators_expansion.py \
              molmetal/tests/test_pll_signature.py \
              molmetal/tests/test_reducer.py \
              molmetal/tests/test_lambda_reward_coupling.py \
              molmetal/tests/test_biolm_score_adapter.py \
              molmetal/tests/test_synflownet_env.py \
              -q --tb=short --no-header \
              | tee mechanism_smoke.log
          # Pull the 'X passed' integer and assert ≥217.  Tolerate the
          # trailing 'in N.NNs' summary line by capturing only digits
          # before 'passed'.
          PASSED=$(grep -oE '[0-9]+ passed' mechanism_smoke.log | head -1 | awk '{print $1}')
          echo "PASSED=${PASSED}"
          if [ "${PASSED:-0}" -lt 217 ]; then
            echo "ERROR: mechanism smoke gate requires ≥217 passed, got ${PASSED}" >&2
            exit 1
          fi

      - name: Upload mechanism smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-smoke-log
          path: mechanism_smoke.log
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 4b — Wf-35 Phase 4: R18 train-scripts master verify (CPU-only)
  #          Runs master_verify_r18.py on a fresh GitHub-hosted
  #          ubuntu-latest runner so the Wf-35 refactor contract
  #          (parse_args + main + _common_train_args group titles)
  #          is exercised end-to-end without depending on the
  #          host venv.  `--skip-smoke` is required
  #          because the 1-epoch smokes need .data/molmetal/*.csv
  #          which is local-only.
  # ----------------------------------------------------------------------
  r18-train-scripts-master-verify:
    name: "[4b] R18 train-scripts master verify (Wf-35)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # master_verify_r18.py hard-codes this path; the Install step
      # builds a uv venv there so the import + argparse checks can
      # resolve torch / rdkit / sklearn.
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/molmetal/.venvs/mol-metal-venv
      VIRTUAL_ENV: ${{ github.workspace }}/molmetal/.venvs/mol-metal-venv
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"

      - name: Install minimal deps for master verify
        run: |
          set -euo pipefail
          uv venv "$UV_PROJECT_ENVIRONMENT" --python 3.12
          # Minimal deps the train scripts pull in at module-import
          # time.  CUDA-enabled torch wheel is fine on a CPU runner
          # (no kernels launch).
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" \
              "torch>=2.11,<3" \
              "numpy>=1.26,<3" \
              "pandas>=2.0" \
              "scipy>=1.11" \
              "scikit-learn>=1.3" \
              "rdkit>=2024.3" \
              --index-strategy unsafe-best-match
          "$UV_PROJECT_ENVIRONMENT/bin/python" -c "import rdkit, numpy, torch, sklearn, scipy; print('imports OK')"

      - name: Run master_verify_r18 (--skip-smoke on data-less runner)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # --skip-smoke: 1-epoch smokes need .data/molmetal/*.csv
          # which is NOT checked in (loaders honour $MOLMETAL_DATA_DIR
          # pointing at the local-only data lake).  Import + argparse
          # checks alone prove the Wf-35 refactor contract holds.
          "$UV_PROJECT_ENVIRONMENT/bin/python" molmetal/scripts/master_verify_r18.py \
              --skip-smoke | tee master_verify_r18.log
          # Sanity footer — fail must be 0; pass+pending matches the
          # SHIPPED_SCRIPTS + PLANNED_SCRIPTS registry.
          grep -E "DONE in [0-9.]+s — pass=[0-9]+ fail=0 pending=[0-9]+" master_verify_r18.log

      - name: Upload master verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-verify-r18-log
          path: master_verify_r18.log
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 4c — git-hook installer gate (clone-survivable commit gate)
  #   Proves the commit gate survives a fresh clone: installs hooks from
  #   the TRACKED source (scripts/git_hooks/) via scripts/install_git_hooks.sh,
  #   asserts the installed hook is executable + byte-identical to the
  #   tracked source, proves the installer is idempotent (second run
  #   changes nothing), and runs the single-venv guard directly
  #   (AGENTS.md §5.9).  Deliberately does NOT run
  #   `pre_flight_check.py --pipeline all` here — that is the hook's
  #   commit-time job and needs a full local env (50-step smoke).
  #   LFS payload not needed — this job only touches bash scripts.
  # ----------------------------------------------------------------------
  hook-install-gate:
    name: "[4c] git-hook installer (clone-survivable)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert fresh checkout has no hook, then install from tracked source
        run: |
          set -euo pipefail
          if [ -e .git/hooks/pre-commit ]; then
            echo "ERROR: a pre-existing hook was checked out — .git/hooks must not be tracked" >&2
            exit 1
          fi
          bash scripts/install_git_hooks.sh | tee hook_install_run1.log

      - name: Assert hook executable + byte-identical to tracked source
        run: |
          set -euo pipefail
          test -x .git/hooks/pre-commit
          cmp scripts/git_hooks/pre-commit .git/hooks/pre-commit
          grep -q "pre-flight v3 gate" .git/hooks/pre-commit
          echo "hook-install gate: PASS"

      - name: Assert installer idempotency (second run is a no-op)
        run: |
          set -euo pipefail
          before=$(sha256sum .git/hooks/pre-commit | awk '{print $1}')
          bash scripts/install_git_hooks.sh | tee hook_install_run2.log
          after=$(sha256sum .git/hooks/pre-commit | awk '{print $1}')
          test "$before" = "$after"
          grep -q "already installed and identical" hook_install_run2.log

      - name: Single-venv guard (direct, AGENTS.md §5.9)
        run: bash molmetal/scripts/check_no_stale_venv.sh

      - name: Upload hook-install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-install-logs
          path: |
            hook_install_run1.log
            hook_install_run2.log
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 4d — Wf-A167 command-prefix census guard (CPU-only drift gate)
  #   Runs ONLY molmetal/tests/test_wfa167_command_prefix_guard.py with the
  #   GPU hidden.  The guard's module imports no torch and never shells out
  #   to nvidia-smi (the file's own tests assert both), so this job needs
  #   pytest and nothing else — no torch/rdkit wheel, no data lake.
  #   WHY THIS JOB EXISTS: no runner executed this test file, so the census
  #   could drift silently (AGENTS.md 6.269.29 class — "a guard that no
  #   runner executes").  The job is deliberately SEPARATE from the two
  #   jobs that carry their own hard pass-count gates (mechanism-smoke's
  #   ">=217 passed" and pitfall-pytest's own): this file is not added to
  #   either of their pytest lists.
  #   The failure message names the drifting file(s) (census sha vs live
  #   sha) instead of a bare count delta, and the posture step prints the
  #   checkout's own census so a red run says WHICH tree it measured.
  # ----------------------------------------------------------------------
  wfa167-command-prefix-guard:
    name: "[4d] Wf-A167 command-prefix census guard (CPU-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"

      - name: Install pytest (CPU-only; the guard needs nothing else)
        run: |
          set -euo pipefail
          uv venv "$UV_PROJECT_ENVIRONMENT" --python 3.12
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" pytest

      - name: Run Wf-A167 command-prefix census guard tests
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest \
              molmetal/tests/test_wfa167_command_prefix_guard.py \
              -q --tb=short --no-header \
              | tee wfa167_command_prefix_guard.log

      - name: Census posture of THIS checkout (attribution + live-axis verdict)
        if: always()
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          # Wf-A269 wave-28 (2026-11-06) — THE REAL EXIT CODE IS NOW
          # EXERCISED IN CI.  It never was: the step passed --advisory,
          # which short-circuits the verdict to 0, so a defect in the
          # guard's exit PREDICATE could never show up here (the guard
          # itself used to exit 1 for ever — a gate that cannot PASS).
          #
          # THE STEP STILL DOES NOT FAIL ON THE LIVE COUNT, and that is
          # deliberate and MEASURED, not lazy.  The live count is a
          # property of the TREE, not of the guard.  MEASURED 2026-11-06
          # by replaying HEAD's blobs through the guard's own scanner:
          #   HEAD    : 113 tracked *.sh, 44 LIVE real defeaters, 12 archived
          #   WORKTREE:                    0 LIVE real defeaters,  3 archived
          # ⇒ a CI checkout of HEAD would be RED here for reasons that have
          # nothing to do with this job, and the commit that carries the
          # lock-preserving repairs is USER-gated (AGENTS.md §6.269.23.12:
          # "the commit is load-bearing, not cosmetic").  Shipping a
          # red-by-construction CI job is the very defect class this step
          # exists to expose (§6.269.17), so the count is REPORTED, not
          # enforced, until the commit lands.
          #
          # WHAT IS ENFORCED: that the exit code TRACKS the selected axis
          # (the guard can fail AND can pass) — pinned by job 4e, group D
          # of molmetal/tests/test_wfa269_wave28_published_number_guards.py.
          "$UV_PROJECT_ENVIRONMENT/bin/python" \
              molmetal/scripts/wfa167_command_prefix_guard.py \
              --repo-root . --json > wfa167_census.json
          live_rc=$?
          echo "live_axis_exit_code=${live_rc}"
          "$UV_PROJECT_ENVIRONMENT/bin/python" - <<'PYEOF'
          import json
          counts = json.load(open("wfa167_census.json"))["counts"]
          print("live_axis_defeaters  =", counts["real_defeaters_live"])
          print("archived_defeaters   =", counts["real_defeaters_archived"])
          print("total_real_defeaters =", counts["real_defeaters"])
          PYEOF
          # The human rendering is kept for the artifact (attribution).
          "$UV_PROJECT_ENVIRONMENT/bin/python" \
              molmetal/scripts/wfa167_command_prefix_guard.py \
              --repo-root . --advisory > wfa167_census_posture.txt

      - name: Upload guard test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfa167-command-prefix-guard-log
          path: |
            wfa167_command_prefix_guard.log
            wfa167_census_posture.txt
            wfa167_census.json
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 4e — Wf-A269 wave-28 published-number guards (CPU-only)
  #   Runs ONLY molmetal/tests/test_wfa269_wave28_published_number_guards.py
  #   with the GPU hidden.  That file is stdlib-only (ast / importlib.util /
  #   json / re / pathlib) and every producer it loads is stdlib-only at
  #   IMPORT time ⇒ this job needs pytest and nothing else — no torch/rdkit
  #   wheel, no data lake.
  #   WHY THIS JOB EXISTS: the wave-28 repairs — the Wf-299 wrapper's byte
  #   count measured at RUN TIME; the PROBE/evaluator label; the audit's
  #   MEASURED canonical probe count; the guard's LIVE verdict axis; the
  #   trainer's documented failure taxonomy; the CI's own dangling test
  #   path — are guarded by that file, and a guard that no runner executes
  #   is the §6.269.29 class (it can be green while it watches nothing).
  #   IT IS ALSO WHAT ENFORCES the part job 4d deliberately only REPORTS:
  #   that the guard's exit code TRACKS its selected axis, i.e. "the gate can
  #   fail AND can pass".
  #   NB: job 4d's own pytest step could not run AT ALL until this wave
  #   fixed the repo's conftest — an unguarded module-level `import torch`
  #   killed every torch-less pytest session.  Five earlier waves NAMED that
  #   closure path and never executed it (TODO/completed/420a3_wave_a_launch
  #   .md:122, 394a1:99, 394a3:235, 356b1:154, 384a1:82, 414a3:193).
  # ----------------------------------------------------------------------
  wave28-published-number-guards:
    name: "[4e] Wf-A269 wave-28 published-number guards (CPU-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"

      - name: Install pytest (CPU-only; the guards need nothing else)
        run: |
          set -euo pipefail
          uv venv "$UV_PROJECT_ENVIRONMENT" --python 3.12
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" pytest

      - name: Run Wf-A269 wave-28 published-number guards
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Wf-A269 runner-coverage wave (2026-11-09) — the second file
          # below is the runner-coverage gate's own test.  It is listed
          # HERE, on an executing runner's pytest argv, because a guard
          # that no runner executes is invisible (AGENTS.md section 6.269.29
          # class).  The gate makes the "test file on no executing runner"
          # class VISIBLE without running the whole suite: it enumerates
          # the population, enumerates the executed set from the SAME axis,
          # and fails when a new test file is added that no runner names.
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest \
              molmetal/tests/test_wfa269_wave28_published_number_guards.py \
              molmetal/tests/test_wfa269_runner_coverage_gate.py \
              -q --tb=short --no-header \
              | tee wave28_published_number_guards.log

      - name: Upload guard test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave28-published-number-guards-log
          path: wave28_published_number_guards.log
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 5 — summary (always succeeds; surfaces a single badge-style status)
  # ----------------------------------------------------------------------
  ci-summary:
    name: "ci-summary"
    runs-on: [self-hosted, linux, x64, mol-metal]
    needs: [evaluator-sanity, pitfall-runner, pitfall-pytest, mechanism-smoke, r18-train-scripts-master-verify, hook-install-gate, wfa167-command-prefix-guard, wave28-published-number-guards]
    if: always()
    steps:
      - name: Emit summary
        run: |
          echo "## Mol-Metal CI summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for job in evaluator-sanity pitfall-runner pitfall-pytest mechanism-smoke r18-train-scripts-master-verify hook-install-gate wfa167-command-prefix-guard wave28-published-number-guards; do
            echo "- $job: ${{ needs.$job.result }}" >> "$GITHUB_STEP_SUMMARY"
          done
