test_set: crossdocked_pocket10
n_test_pockets: 100
docking:
  engine: vina
  version: 1.2.7
  exhaustiveness: 8
  n_poses: 9
vina_per_pocket:
  1h36:
    exhaustiveness: 32
    n_poses: 20
    scoring: ad4
    scoring_file: AD4Zn.dat
  3eml:
    exhaustiveness: 8
    n_poses: 9
    scoring: vina
  3ny8:
    exhaustiveness: 16
    n_poses: 15
    scoring: vina
  4aaw:
    exhaustiveness: 32
    n_poses: 20
    scoring: ad4
