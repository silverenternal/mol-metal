# NOTE: this yaml is a docking/scoring test config (not a trainer launch config); FIX C not applicable (no entry block)
# FIX A: add data.dataset = crossdocked_100 (Lovato 2019 baseline anchor)
# FIX B: add data.split.type = scaffold_split (matches test_set design)
test_set: crossdocked_pocket10
data:
  dataset: crossdocked_100  # Wf-A8c FIX A: add data.dataset per PROTOCOL_ALIGNMENT_MATRIX.md §1 (Lovato 2019 CrossDocked100 baseline)
  split:
    type: scaffold_split  # Wf-A8c FIX B: crossdocked scaffold split (default Bemis-Murcko per crossdocked_pocket10 subset)
    train_frac: 0.8
    val_frac: 0.1
    test_frac: 0.1
    seed: 100
  cohort_filter:
    test_pockets_subset: 10  # 10-pocket subset of crossdocked_100 for quick smoke
n_test_pockets: 100
docking:
  engine: quickvina2
  version: '2.1'
  exhaustiveness: 1
  n_poses: 1
scoring:
  sa: ertl_2000
  qed: rdkit
  lipinski: true
  logp_threshold: 5
success_rate:
  vina_threshold_kcal: -8.0
  sa_threshold: 4
  qed_threshold: 0.5
  logp_max: 5
nfe:
  target_per_pocket: 4
  method: mcts_rollouts
posebusters:
  enabled: true
  threshold: pass_all
mcts:
  top_k: 10
  max_depth: 1
  patience: 50
  early_stop: true
  branching_target: 12
lambda_specific:
  tile_library: standard_12
  click_rules: CuAAC
  synthesis_oracle: false
  symbolic_prior: false
  symbolic_prior_refit_every: 0
output:
  ckpt_dir: molmetal/checkpoints
  events_jsonl: true
directives:
  # Wf-A176 (2026-11-01): the required-gate entry `p1_pytorch_cuda_available`
  # was removed — that gate name has 0 occurrences in any .py (HEAD + full
  # git history), so it had no referent. See catalog §6.268.
  pre_flight_gates_required:
  - p2_tests_pass
  - p3_wf343c4_anchor_freshness_24h
  - p3_wf343c2_per_wave_runtime_check
