  cfm_fm_term_percloud:
    source_json: metrics/by_metric/cfm_fm_term_percloud.json
    source_json_sha256: e8ffb6f5a40a4ab99e2c267d9267db23795814c157100ce96b684ad2817d0985
    source_json_missing: false
    value: null
    value_basis: null
    status: MEASURED
    status_source: tag
    status_narrative_source: null
    verdict:
      hypothesis: F.mse_loss averages over all elements, so a cloud with few atoms
        and a tight metal centre dominates the gradient while the organic ligand branch
        contributes almost nothing; the fix would be a per-cloud normalisation.
      hypothesis_holds: false
      why_not:
      - 'The reduction barely matters: (a) element-mean 9.3250 vs (b) cloud-mean 8.9480,
        a 4.2% gap. A per-cloud normalisation would move the objective by ~4%, not
        the ~10x the hypothesis needs.'
      - The sign is wrong. Pearson(loss, n_atoms) = +0.408 — LARGER clouds have HIGHER
        per-element loss, so the element-mean reduction up-weights big organic complexes,
        not small metal centres. Pearson(loss, ligand radius of gyration) = +0.696.
      - Small clouds do NOT own the gradient. The 23 clouds with n_atoms <= 25 hold
        6.6% of the atoms and 4.9% of the gradient under (a) — they are UNDER-represented,
        not dominant.
      - Metal atoms are almost free. 192 metal atoms (2.6% of atoms) carry 1.0% of
        the squared error; their per-element MSE is 3.76 vs 9.47 for the 7250 ligand
        atoms.
      - 'Concentration is mild and top-HEAVY, not tail-heavy: the top 10% of clouds
        hold 21.9% of the gradient under (a) and 16.3% under (b), against a uniform
        10%.'
      what_the_data_shows_instead: 'Loss rises with molecule size because the TARGET''s
        own scale does: Pearson(loss, zero-predictor MSE on the same cloud) = +0.685,
        and normalising by it collapses the size effect (Pearson(loss/zero, ligand
        radius) falls 0.696 -> 0.197). Pearson(loss, t) = +0.076 and eta for metal
        identity = 0.092, so neither the flow time nor which metal it is explains
        the variance. The remaining live signal is the mid-interpolant band: t in
        [0.4,0.6) scores 11.63 against 7.19 at t<0.2.'
      why_fm_term_moves_slowly: 'MEASURED: the model removes only 24.6% of the trivial
        v==0 predictor''s loss (9.325 vs 12.363 per element). Most of 12.46 is the
        variance of the regression target itself, not a failure to fit. Both subsets
        are equally far from the floor: 25.4% of zero-predictor loss removed below
        median carbon, 24.1% at or above — no subset is being neglected.'
      recommended_action: DO NOT change the reduction. It is worth ~4% and no subset
        is starved. The measured lever is the mid-interpolant band (t in [0.4,0.8)
        carries 43.9% of the gradient at the highest per-element loss), so if anything
        moves, weight t — which is a sampling-distribution change (Karras sigma weighting),
        not a reduction change, and would need its own A/B.
    verdict_shape: structured
    scope: null
    metric_timestamp: '2026-10-12'
