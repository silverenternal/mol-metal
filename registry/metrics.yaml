      IN BO 1.30-1.50 (4912 of 5539 = 88.7% fall inside [1.30, 1.70)); tightening
      the band relabels those ''correct'' predictions as ''false positive'' rather
      than ''correct'' and F1 falls. THE COLLAPSE IS RELOCATED, NOT FIXED: the constant
      edit would lower F1, not raise it. The binding axis is the head''s intrinsic
      over-prediction of aromatic on lower-BO bonds, not the band boundary.'
