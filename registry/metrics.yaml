        under per-complex aggregation -- nearly a factor of two apart. That is exactly
        why 0.9194 must never be placed beside OpenBabel's 0.5051.
      what_it_does_NOT_change: macro-F1(type) still loses. Scale helped enormously
        (n_train 256 gave F1(exist) 0.6118 / type 0.2801 / exact 0.0011) but has not
        closed the type gap.
