    verdict: 'MEASURED_HONEST_NEGATIVE + ROOT-CAUSE ISOLATED (2026-10-08) — D-MPNN
      does not beat ridge on exact-row pearson, AND the bottleneck is the READOUT,
      not the features or the multi-task alpha. Decisive probe (wf_pearson_ridge_gpu
      + wf_pearson_diag, one split each): a Ridge probe on the D-MPNN encoder''s OWN
      frozen embedding reaches test_pearson 0.34-0.41, while the neural pIC50 HEAD
      on the SAME embedding reaches only 0.01-0.21 — the head extracts ~2-30x less
      signal than a linear probe. Reg-weighting the loss (alpha 0.5 -> 0.2) makes
      the head WORSE (0.2143 -> 0.1690), refuting the ''head is alpha-starved'' hypothesis.
      Historical best neural 0.3091 (wf124_p3, older 2026-09 split) remains below
      the ridge ceiling. Honest paper framing: the gap to the historical ridge 0.572
      is a readout/architecture problem to be closed with a ridge-or-better readout
      on the encoder embedding, not a feature problem.'
    verdict_shape: text
