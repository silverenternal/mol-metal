        off-clean. A pure ARCH-1 retrain (noising the input) might raise the post-cliff
        floor but cannot recover the t=1 regime from noisy x_t.'
      t1_macro_f1: 0.6108482787269279
      t1_macro_f1_vs_baseline:
        baseline_mean: 0.4784
        baseline_std: 0.0055
        abs_diff: 0.13244827872692794
        consistent_within_4std: false
        explanation: Protocol difference, NOT a finding about the curve. The baseline
          (metrics/by_metric/tmqm_bond_perception_3seed.json) is macro_f1_type OVER
          SUCCESSES -- a TYPE-only macro-F1 that EXCLUDES BOND_NO_BOND. The script's
          macro_f1_all_classes averages over ALL 5 classes INCLUDING BOND_NO_BOND,
          which is the easy class with the largest support (2614 of 3770 pairs at
          t=1) and the head classifies it well (F1 0.95). Including the easy class
          inflates the macro average relative to a type-only average. Additionally,
          the baseline uses 900 complexes (150 per metal, 3 seeds); this run uses
          32 mixed-metal clouds and 1 seed. A higher t=1 number is the direction the
          protocol difference predicts; the gap is expected.
      verdict_label: ARCH-1 PARTIALLY REFUTED. The head IS hurt by noise (sharp cliff
        from t=1 to t=0.9) but the post-cliff floor does not depend on t, so the strict-monotonic
        prediction fails. The retrain slot should NOT be spent on ARCH-1 alone --
        the cliff-then-plateau shape suggests a capacity floor not bridged by noising
        the input.
    scope: null
