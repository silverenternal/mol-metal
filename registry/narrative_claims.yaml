  # ---- NCI-60 9-cell panel ------------------------------------------------
  - id: nci60_mean_auc
    claim: NCI-60 precious-metal panel mean AUC (over the cells that have one)
    value: 0.7293802091886383
    tol: 0.0005
    source: metrics/by_metric/nci60_precious_9cell_auc.json
    field: value_overall_mean_auc
    note: >
      Krasnov reference is 0.81. The mean is over 8 cells, not 9 — DU145 has
      auc_mean = null across all 3 seeds. The metric's own `corrections` field
      records this and sets n_cells = 8. The metric NAME and filename still say
      "9cell"; do not propagate that label into prose. UPDATED 2026-10-12: this
      value was 0.80072017249287 before the BLK-PA12 fixed-splitter rerun. The
      rerun (nci60_precious_9cell_auc.json::fixed_split_rerun_2026_10_12) also
      dropped the std to 0.21366749340562713 because several cell lines now have
      single-digit test sets (SKOV3 n_test=3, DU145 n_test=7); the panel no
      longer supports a tie against the 0.81 comparator.
  - id: nci60_mean_std
    claim: NCI-60 panel mean AUC std
    value: 0.21366749340562713
    tol: 0.0005
    source: metrics/by_metric/nci60_precious_9cell_auc.json
    field: value_overall_mean_std
    note: >
      UPDATED 2026-10-12 (BLK-PA12 fixed-splitter rerun): was
      0.01598032473882782 on the degenerate splitter. The spread is real, not
      noise — A2780cis 0.3356 and A2780 0.5104 pull the panel down while HL60 /
      SKOV3 / DU145 sit at 0.8-1.0 on single-digit test sets.
  - id: nci60_cells_with_auc
    claim: NCI-60 cells that actually have a measured AUC
    value: 9
    tol: 0
    source: metrics/by_metric/nci60_precious_9cell_auc.json
    field: n_cells_with_measured_auc
    note: >
      UPDATED 2026-10-12 (BLK-PA12 fixed-splitter rerun): was 8, with
      cells_without_measured_auc=['DU145'] (DU145's per-seed AUC was null under
      the degenerate splitter). The rerun trained DU145 and it scored
      test_auc=1.0 on n_test=7, so all 9 panel cells now carry a measured AUC.
      Two of the nine have single-digit test sets (DU145 n_test=7, SKOV3
      n_test=3) and score 1.0 — the mean is reported over all 9 to stay
      consistent with value_overall_mean_auc, and the paper flags the tiny-test-
      set caveat rather than quoting a tidy 8-cell number.
