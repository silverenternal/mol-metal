# Narrative claims — machine-checkable provenance for docs/00_MODEL_NARRATIVE.md
#
# WHY THIS FILE EXISTS
# --------------------
# AGENTS.md §5.2 requires every number in agent output to trace to a JSON or
# report path on disk. Until now that rule was enforced by hand, and hand
# enforcement failed: a manual audit on 2026-10-10 found that ALIGNED_COMPARISON
# carried stale per-cell values (A549 0.870 is actually PC3's) that were copied
# verbatim into the pinned narrative, and that n_distinct's headline "20" is a
# saturated cap rather than a measurement.
#
# So the claims are declared here, once, with an explicit source pointer, and
# `molmetal/scripts/verify_narrative_claims.py` resolves each pointer against
# disk. It runs in pre-flight, so a drifted claim is a red gate rather than
# something the next reader has to notice.
#
# Each claim:
#   id       stable key the narrative cites
#   claim    one-line human description
#   value    the number the narrative states
#   tol      absolute tolerance (defaults to 5e-4)
#   source   path relative to repo root
#   field    dotted path inside the JSON; a list index is allowed
#   note     why the claim is worded the way it is, when that is not obvious
#
# A claim that is CAPPED, PROXY, or otherwise not a direct measurement must say
# so in `note` — that is how n_distinct went wrong.

schema: molmetal-narrative-claims-v1
narrative_doc: docs/00_MODEL_NARRATIVE.md

