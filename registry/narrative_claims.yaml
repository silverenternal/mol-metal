  - id: n_distinct_capped
    claim: n_distinct after the 4-fix bundle — SATURATED CAP, not a measurement
    value: 20
    tol: 0
    source: metrics/by_metric/n_distinct.json
    field: aggregate.best_measured_with_all_fixes
    note: >-
      This equals aggregate.n_top_k_cap = 20; the file's own interpretation
      says 'saturate the n_top_k cap on every cell'. So the true statement is
      '>= 20, capped' — NOT '20 vs gate 3 = 6.7x'. Never render this as a
      multiplier of the gate.

