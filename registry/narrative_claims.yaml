      Krasnov reference is 0.81. The mean is over 8 cells, not 9 — DU145 has
      auc_mean = null across all 3 seeds. The metric's own `corrections` field
      records this and sets n_cells = 8. The metric NAME and filename still say
      "9cell"; do not propagate that label into prose.
  - id: nci60_mean_std
